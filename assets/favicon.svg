<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="BFFX">
  <!-- A mesma ideia da página em 32px: a lâmina de grafite e o LED aceso.
       Sem letras — em 16px, "BF" vira dois borrões; a barra sobrevive ao
       tamanho de aba. O ícone segue ESCURO mesmo com a página branca: a
       aba do navegador tem fundo próprio, e o grafite é o que identifica
       o produto. -->
  <rect width="32" height="32" rx="8" fill="#16161A"/>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <circle cx="10.5" cy="12.5" r="3.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="1.6"/>
  <circle cx="21.5" cy="12.5" r="3.6" fill="none" stroke="#3D8BFF" stroke-width="1.6"/>
  <rect x="7" y="22" width="18" height="3" rx="1.5" fill="#3D8BFF"/>
</svg>
