<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BFMiDi · Backup View</title>
<style>
  :root {
    --bg: #141617; --screen: #1B1D1F; --card: #26292E; --card2: #2E3238; --card3: #3A3E43;
    --text: #E9EBED; --muted: #8C9298; --faint: #878D94; --ghost: #44484E;
    --hair: rgba(255,255,255,0.055); --hair2: rgba(255,255,255,0.10);
    --accent: #FC6337; --accent2: #FF8A4C; --ok: #22cc44; --warn: #ffcc20; --bad: #ff3030;
    --r: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { min-height: 100vh; }
  ::selection { background: rgba(252,99,55,.35); }

  /* ── topo ── */
  .top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 20px; background: linear-gradient(180deg, #1c1f22, #17191b); border-bottom: 1px solid var(--hair2);
    box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  .brand { font-weight: 800; letter-spacing: .06em; font-size: 15px; text-transform: uppercase; }
  .brand b { color: var(--accent); }
  .brand span { color: var(--muted); font-weight: 500; letter-spacing: .12em; font-size: 11px; margin-left: 8px; }
  .filebtn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 10px; cursor: pointer;
    background: linear-gradient(180deg, var(--accent2), var(--accent)); color: #1b0c05; font-weight: 800; letter-spacing: .08em;
    font-size: 12px; text-transform: uppercase; box-shadow: 0 4px 14px rgba(252,99,55,.35), inset 0 1px 0 rgba(255,255,255,.35); }
  .filebtn:hover { filter: brightness(1.07); }
  .filebtn input { display: none; }
  .fileinfo { color: var(--muted); font-size: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-width: 0; }
  .fileinfo .fname { color: var(--text); font-weight: 600; max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seg { margin-left: auto; display: inline-flex; background: var(--screen); border: 1px solid var(--hair2); border-radius: 12px; padding: 4px; gap: 4px; }
  .seg button { border: 0; background: transparent; color: var(--muted); font-weight: 800; letter-spacing: .1em; font-size: 12px;
    padding: 9px 22px; border-radius: 9px; cursor: pointer; text-transform: uppercase; transition: .15s; }
  .seg button.on { background: linear-gradient(180deg, var(--card3), var(--card2)); color: var(--accent2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 2px 8px rgba(0,0,0,.35); }
  .seg button:disabled { opacity: .35; cursor: default; }

  /* ── conteúdo ── */
  main { padding: 20px; max-width: 1500px; margin: 0 auto; }
  .empty { margin: 8vh auto; max-width: 560px; text-align: center; padding: 46px 30px; border: 2px dashed var(--ghost); border-radius: 22px;
    color: var(--muted); transition: .2s; }
  .empty.over { border-color: var(--accent); background: rgba(252,99,55,.06); color: var(--text); }
  .empty h2 { margin: 0 0 8px; color: var(--text); letter-spacing: .04em; }
  .empty p { margin: 6px 0; }
  .empty .k { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--accent2); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; align-items: start; }
  .grid .span2 { grid-column: span 2; }
  @media (max-width: 760px) { .grid .span2 { grid-column: span 1; } }
  .card { background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--hair2); border-radius: var(--r);
    box-shadow: 0 10px 30px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.05); overflow: hidden; }
  .card > h3 { margin: 0; padding: 12px 16px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent2);
    border-bottom: 1px solid var(--hair); display: flex; align-items: center; gap: 10px; }
  .card > h3 .sub { margin-left: auto; color: var(--muted); letter-spacing: .04em; font-weight: 500; text-transform: none; font-size: 11px; }
  .card .body { padding: 12px 16px 14px; }
  .kv { display: grid; grid-template-columns: minmax(120px, 42%) 1fr; gap: 6px 12px; align-items: center; }
  .kv .k { color: var(--muted); font-size: 12px; letter-spacing: .03em; }
  .kv .v { font-weight: 600; min-width: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .kv .v.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 500; }
  .hr { height: 1px; background: var(--hair); margin: 10px 0; }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; }

  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700;
    letter-spacing: .05em; background: var(--card3); border: 1px solid var(--hair2); color: var(--text); white-space: nowrap; }
  .chip.ok { color: #7cf0a0; border-color: rgba(34,204,68,.4); background: rgba(34,204,68,.10); }
  .chip.off { color: var(--faint); background: transparent; }
  .chip.acc { color: var(--accent2); border-color: rgba(252,99,55,.5); background: rgba(252,99,55,.12); }
  .chip.warn { color: #ffd766; border-color: rgba(255,204,32,.45); background: rgba(255,204,32,.10); }
  .chip.bad { color: #ff8a8a; border-color: rgba(255,48,48,.45); background: rgba(255,48,48,.10); }

  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex: none; border: 1px solid rgba(0,0,0,.4);
    box-shadow: 0 0 8px var(--c, transparent), inset 0 0 3px rgba(255,255,255,.25); background: var(--c, #444); }
  .sw { width: 22px; height: 14px; border-radius: 4px; display: inline-block; flex: none; border: 1px solid rgba(255,255,255,.18); background: #000; }
  .swname { font-size: 12px; color: var(--muted); font-weight: 500; }

  table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.t th { text-align: left; color: var(--muted); font-weight: 600; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
    padding: 6px 8px; border-bottom: 1px solid var(--hair2); }
  table.t td { padding: 6px 8px; border-bottom: 1px solid var(--hair); vertical-align: middle; }
  table.t tr:last-child td { border-bottom: 0; }
  table.t td.n { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
  table.t tr.dim td { color: var(--faint); }

  /* letras A..J */
  .letters { display: flex; gap: 6px; flex-wrap: wrap; }
  .letter { width: 46px; height: 46px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; font-weight: 800; background: var(--card3); border: 1px solid var(--hair2); }
  .letter.off { opacity: .35; }
  .letter .dot { width: 10px; height: 10px; }

  /* placa (hero) — sem desenho da controladora (removido em set/2026) */
  .hero { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: center; }
  .hero .name { font-size: 26px; font-weight: 900; letter-spacing: .02em; line-height: 1.1; }
  .hero .name small { display: block; font-size: 11px; color: var(--accent2); letter-spacing: .18em; font-weight: 700; margin-bottom: 4px; }
  .hero .tags { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }

  /* prévia de tela */
  .screen { aspect-ratio: 3/2; width: min(480px, 100%); container-type: inline-size; background: #000; border-radius: 6px; position: relative; overflow: hidden;
    border: 4px solid #2b2f33; box-shadow: 0 0 0 1px #000, 0 14px 30px rgba(0,0,0,.5); font-family: "Helvetica Neue", Arial, sans-serif; }
  .screen .bgimg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .screen .pname { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-weight: 800; letter-spacing: .02em; font-size: calc(var(--fs) * 1cqw); }
  .screen .ptag { position: absolute; left: 3%; top: 3%; font-size: 3.6cqw; font-weight: 800; }
  .screen .strip { position: absolute; left: 0; right: 0; top: 0; height: 15%; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 4.2cqw; letter-spacing: .04em; background: rgba(0,0,0,.35); }
  .screen .tiles { position: absolute; left: 2%; right: 2%; top: 17%; bottom: 3%; display: grid; gap: 2.5%; }
  .screen .tiles.c3 { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; --ts: 24cqw; }
  .screen .tiles.c4 { grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr; --ts: 21cqw; }
  .screen .tiles.c2 { grid-template-columns: repeat(2, 1fr); grid-template-rows: 1fr 1fr; --ts: 28cqw; }
  .screen .tiles .tile { --s: var(--ts); border-width: 0.6cqw; }
  .screen .tiles .tile .sg { font-size: calc(var(--ts) * .15 * var(--k, 1)); }
  .screen .tiles .tile .sg.big { font-size: calc(var(--ts) * .26); }
  .screenwrap { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; flex: 1 1 300px; min-width: 240px; max-width: 480px; }
  .screenwrap .cap { font-size: 11px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }

  /* tile do SW (porte simplificado do icon_tile_render) */
  .tile { position: relative; border-radius: 12%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; gap: 4%; width: var(--s, 84px); height: var(--s, 84px); flex: none; border: 3px solid transparent; }
  .tile.circle { border-radius: 50%; }
  .tile.octagon { clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }
  .tile .ico { width: 58%; height: 58%; -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
  .tile img.ico { -webkit-mask: none; mask: none; object-fit: contain; }
  .tile .sg { font-size: calc(var(--s, 84px) * .15 * var(--k, 1)); font-weight: 800; letter-spacing: .03em; line-height: 1; max-width: 92%; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .tile .sg.big { font-size: calc(var(--s, 84px) * .26); }
  .tile .miss { font-size: 20px; color: #777; }
  .tile.bare { border-color: #3a3e43; }

  /* presets: seletor */
  .pbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .pgroup { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pgroup .pl { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-weight: 900;
    background: var(--card3); border: 1px solid var(--hair2); flex: none; }
  .pgroup .pl.off { opacity: .35; }
  .pbtn { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 10px; border: 1px solid var(--hair2);
    background: linear-gradient(180deg, var(--card2), var(--card)); color: var(--text); cursor: pointer; font-weight: 600; font-size: 12.5px;
    max-width: 240px; transition: .12s; }
  .pbtn:hover { border-color: var(--accent); }
  .pbtn.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 6px 18px rgba(252,99,55,.25); }
  .pbtn.off { opacity: .45; }
  .pbtn .tg { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 800; color: var(--accent2);
    background: rgba(252,99,55,.12); padding: 3px 6px; border-radius: 6px; }
  .pbtn .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pbtn .sw { width: 16px; height: 11px; }

  .phead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .phead .big { font-size: 28px; font-weight: 900; letter-spacing: .01em; }
  .phead .tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 20px; font-weight: 800; color: var(--accent2);
    background: rgba(252,99,55,.12); padding: 6px 12px; border-radius: 10px; }
  .layerseg { display: inline-flex; gap: 4px; background: var(--screen); border: 1px solid var(--hair2); border-radius: 10px; padding: 3px; }
  .layerseg button { border: 0; background: transparent; color: var(--muted); font-weight: 800; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; }
  .layerseg button.on { background: var(--card3); color: var(--accent2); }

  /* cards de SW */
  .swgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; margin-top: 16px; }
  .swcard h3 .num { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #1b0c05; display: inline-flex; align-items: center;
    justify-content: center; font-weight: 900; font-size: 12px; }
  .swcard h3 .mode { color: var(--text); letter-spacing: .08em; }
  .states { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .state { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .state .cap { font-size: 10px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
  .sec { border: 1px solid var(--hair); border-radius: 10px; padding: 8px 10px; margin-top: 8px; background: rgba(0,0,0,.12); }
  .sec .sh { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 800; display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .sec .sh .dot { width: 11px; height: 11px; }
  .msg { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; flex-wrap: wrap; }
  .msg .kind { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 5px;
    background: var(--card3); color: var(--accent2); }
  .msg .ch { font-size: 11px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .msg .nm { font-weight: 600; }
  .msg .val { margin-left: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); }
  .flags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }

  /* mídia */
  .media { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
  .media .it { background: #0f1113; border: 1px solid var(--hair2); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .media .it .im { aspect-ratio: 3/2; background: #000 center / cover no-repeat; display: flex; align-items: center; justify-content: center; }
  .media .it .im.ic { aspect-ratio: 1; background-size: contain; background-color: #1a1c1f; }
  .media .it .cp { font-size: 10.5px; padding: 5px 7px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
  .media .it .cp b { color: var(--text); }

  details.raw { margin-top: 20px; }
  details.raw summary { cursor: pointer; color: var(--muted); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; padding: 8px 0; }
  details.raw pre { background: #0f1113; border: 1px solid var(--hair2); border-radius: 10px; padding: 12px; font-size: 11.5px; overflow: auto;
    max-height: 420px; color: #c9ced3; }
  .warnbox { padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,204,32,.45); background: rgba(255,204,32,.08); color: #ffd766; margin-bottom: 16px; font-weight: 600; }
  .custom { position: relative; aspect-ratio: 3/2; background: #000; border-radius: 6px; border: 2px solid #2b2f33; overflow: hidden; }
  .custom .ci { position: absolute; transform: translate(-50%, -50%); border-radius: 12%; border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 800; color: var(--accent2); background: rgba(252,99,55,.12); }
  .custom .ci.x { opacity: .3; border-style: dashed; }
  .pill { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; background: var(--card3); border-radius: 6px; padding: 2px 7px; }
  h2.sect { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px; }

  /* ── modo de edição (global_config) ── */
  .acts { display: inline-flex; gap: 8px; }
  .btn { border: 1px solid var(--hair2); background: linear-gradient(180deg, var(--card3), var(--card2)); color: var(--text); font-weight: 800;
    letter-spacing: .08em; font-size: 12px; text-transform: uppercase; padding: 9px 16px; border-radius: 10px; cursor: pointer; transition: .15s; }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: .35; cursor: default; border-color: var(--hair2); }
  .btn.on { border-color: var(--accent); color: var(--accent2); box-shadow: 0 0 0 1px var(--accent), 0 4px 14px rgba(252,99,55,.25); }
  .btn.exp { border: 0; background: linear-gradient(180deg, #4ce27a, #22cc44); color: #062a10; box-shadow: 0 4px 14px rgba(34,204,68,.3), inset 0 1px 0 rgba(255,255,255,.35); }
  .btn.exp:hover { filter: brightness(1.07); }
  .btn.sm { padding: 6px 12px; font-size: 11px; }
  .ed { font: inherit; font-size: 12.5px; font-weight: 600; color: var(--text); background: #0f1113; border: 1px solid var(--hair2); border-radius: 8px;
    padding: 5px 8px; max-width: 100%; }
  .ed:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px rgba(252,99,55,.4); }
  .ed.chg { border-color: var(--warn); box-shadow: 0 0 0 1px rgba(255,204,32,.45); }
  input.ed[type=number] { width: 78px; }
  input.ed[type=text] { width: 120px; }
  select.ed { max-width: 280px; }
  label.edc { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; font-weight: 700; user-select: none; }
  label.edc input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  label.edc.chg { color: var(--warn); }
  .edrow { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .editbox { padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(252,99,55,.5); background: rgba(252,99,55,.08); margin-bottom: 16px;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .editbox b { color: var(--accent2); letter-spacing: .1em; }
  .editbox .chglist { flex-basis: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--muted); line-height: 1.7; }
  .editbox .chglist i { color: var(--warn); font-style: normal; }
  table.t td .ed { font-size: 12px; padding: 3px 6px; }
  table.t td input.ed[type=number] { width: 64px; }

  /* Visão de leitura: banco, envios e switches no mesmo painel. */
  .view-intro { margin: 12px 0 22px; }
  .view-intro h1 { margin: 0 0 5px; font-size: clamp(24px,3vw,34px); }
  .view-intro p { margin: 0; color: var(--muted); }
  .preset-selector { padding: 18px; border: 1px solid var(--hair2); border-radius: 18px; background: #1b1f23; margin-bottom: 20px; }
  .bank-row, .preset-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .selector-label { display: block; margin: 0 0 10px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .preset-row { margin-top: 16px; }
  .bank-btn { padding: 10px 17px; border: 1px solid var(--hair2); background: var(--card); color: var(--text); border-radius: 10px; cursor: pointer; font-weight: 800; }
  .bank-btn.on, .preset-row .pbtn.on { border-color: var(--accent); background: #fc633719; color: var(--accent2); }
  .bank-btn.off { color: var(--muted); border-style: dashed; }
  .preset-row .pbtn { flex: 1 1 140px; min-height: 62px; max-width: 230px; }
  .preset-overview { display: grid; grid-template-columns: minmax(0,1.3fr) minmax(0,1fr); gap: 16px; }
  .preset-overview .sec { margin-top: 0; }
  .swgrid { grid-template-columns: repeat(3,minmax(0,1fr)); align-items: start; }
  .swcard { min-width: 0; }
  .swcard .states { padding: 10px 0; border-bottom: 1px solid var(--hair2); margin-bottom: 12px; }
  .swcard h3 .num { white-space: nowrap; width: auto; min-width: 46px; padding: 0 8px; border-radius: 8px; flex-shrink: 0; }
  .section-note { margin: -7px 0 18px; color: var(--muted); font-size: 13px; }
  .more { margin-top: 22px; border: 1px solid var(--hair2); border-radius: 14px; padding: 16px; background: #191c20; }
  .more > summary { cursor: pointer; font-weight: 700; color: var(--accent2); }
  .more[open] > summary { margin-bottom: 18px; }
  .grid, .preset-overview { min-width: 0; }
  .grid { grid-template-columns: repeat(auto-fit,minmax(min(100%,340px),1fr)); }
  button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent2); outline-offset: 4px; }
  @media (max-width: 1000px) { .swgrid { grid-template-columns: repeat(2,minmax(0,1fr)); } }
  @media (max-width: 640px) {
    main { padding: 14px; } .top { position: static; padding: 14px; } .brand span { display: none; }
    .seg { width: 100%; margin-left: 0; } .seg button { flex: 1; padding: 13px; }
    .preset-overview, .swgrid { grid-template-columns: minmax(0,1fr); }
    .grid .span2 { grid-column: span 1; } .card .body { overflow-x: auto; }
    .phead { flex-wrap: wrap; } .phead .big { overflow-wrap: anywhere; }
    .msg { flex-wrap: wrap; } .bank-btn { padding: 10px 14px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>BFMiDi</b> Backup View <span>visualizador de backup</span></div>
  <label class="filebtn">Abrir backup <input id="file" type="file" accept=".json,application/json"></label>
  <div class="fileinfo" id="fileinfo">Nenhum arquivo aberto</div>
  <nav class="seg">
    <button data-view="global" class="on" aria-pressed="true">Global</button>
    <button data-view="presets" aria-pressed="false">Preset</button>
  </nav>
  <div class="acts">
    <button id="edit" class="btn" disabled title="Editar as configurações globais deste backup (a placa, o modo amigável, LEDs…)">Editar</button>
    <button id="export" class="btn exp" disabled title="Baixar o backup com as alterações (o arquivo original não é tocado)">Exportar</button>
  </div>
</header>
<main id="main"></main>

<script src="data.js"></script>

// SW_MODE_IDS (BANK_MEMORY.h) — índice = o que vai em sw_modes do preset.
const SW_MODE_IDS = ['mute','fx1','fx2','fx3','spin','ramp','momentary','favorite','macros','tap_tempo','single','steps','control'];
const SW_MODE_TITLE = { mute: 'MUTE', fx1: 'STOMP', fx2: 'STOMP-2 (legado)', fx3: 'STOMP-3 (legado)', spin: 'SPIN', ramp: 'RAMP',

const ACTIONS = ['NENHUM','CHAMAR PRESET','STANDBY','ENTRAR EM MODO LIVE','SUBIR BANCO','DESCER BANCO','SUBIR BANCO (STANDBY)',
  'DESCER BANCO (STANDBY)','SUBIR PRESET','DESCER PRESET','LIGAR/DESLIGAR WI-FI','SW_LIVE','SAIR PRO BANK','TROCAR LAYER','IR PARA PRESET FIXO'];

const SPECIAL_CCS = { 128: 'UP BANK', 129: 'DOWN BANK', 130: 'UP PRESET', 131: 'DOWN PRESET', 132: 'OUT LIVE MODE', 133: 'TO LAYER', 134: 'SW_LIVE',
  135: 'UP BANK STANDBY', 136: 'DOWN BANK STANDBY' };
const KEMPER = Object.fromEntries(D.KEMPER_NRPN || []);
const GP5 = Object.fromEntries(D.GP5_PARAMS || []);

const MATCH_MODE_OPTIONS = ['MULTIPLE MODE','AMPERO AS2','AMPERO MINI','HX STOMP','A. STAGE 2','GP-200LT','Valeton GP-5','POCKET MASTER','TONEX ONE',
  'KEMPER PLAYER','AMPERO MP350','MX5','NANO CORTEX','QUAD CORTEX','SYNERGY AMPS','BigSky','BlueSky','TimeLine','ELCAPISTAN','FLINT','HX-ONE',
  'VTR NARCISO','VTR LOKI','VTR KAILANI','BFMiDi - Keyboard','CUSTOM',"UAFX Ruby '63","UAFX Enigmatic '82","UAFX Lion '68","UAFX Dream '65",
  'FRACTAL VP4','FRACTAL VP4+','TONEX ONE+','VTR IGNIS','VTR HELIOS','VTR VENATOR','HEADRUSH FLEX PRIME','Valeton GP-50','TONEX PEDAL',
  'PLETHORA X5/X3','PANTHEON DELUXE','GT-1000 / CORE','BOSS MS-3','EVENTIDE H90','USER 1','USER 2','USER 3','SEPIA DELAY','COSMOS REVERB',
  'BOSS SL-2','WAVELENGTH','SCARLETT LOVE OD','Valeton GP-150','Valeton GP-180','LINE 6 M5','LINE 6 M9'];
const MATCH_MODE_PEDAL = [
  null, ['AS2','AMPEROST2'], ['AMPERO_MINI','AMPERO_MINI'], ['HX_STOMP','HX_STOMP'], ['ASTG2','AMPEROST2'], ['GP200LT','GP200LT'],
  ['VALETON_GP5','VALETON_GP5'], ['POCKET_MASTER','POCKET_MASTER'], ['TONEX_ONE','TONEX'], ['KEMPER_PLAYER','KEMPER_PLAYER'],
  ['AMPERO_MP350','AMPERO_MP350'], [null,'MX5'], [null,'NANO_CORTEX'], ['QUAD_CORTEX','QUAD_CORTEX'], [null,'SYN2'], ['BIGSKY','BIGSKY'],
  ['BLUESKY','BLUESKY'], ['TIMELINE','TIMELINE'], [null,'ELCAPISTAN'], [null,'FLINT'], [null,'HXONE'], [null,'VTR_NARCISO'], [null,'VTR_LOKI'],
  [null,'KAILANI'], [null,'BFMIDI_KEYBOARD'], [null,'CUSTOM'], [null,'RUBY63'], [null,'ENIGMATIC82'], [null,'LION68'], [null,'DREAM65'],
  ['FRACTAL_VP4',null], ['FRACTAL_VP4_PLUS','CUSTOM'], ['TONEX_ONE_PLUS','TONEX_ONE_PLUS'], [null,'VTR_IGNIS'], [null,'VTR_HELIOS'],
  [null,'VTR_VENATOR'], [null,'FLEX_PRIME'], ['VALETON_GP5','VALETON_GP50'], ['TONEX','TONEX_PEDAL'], ['PLETHORA','PLETHORA'],
  ['PANTHEON','PANTHEON'], [null,'GT1000'], ['BOSS_MS3','BOSS_MS3'], [null,'EVENTIDE_H90'], ['user',1], ['user',2], ['user',3],
  ['SEPIA','SEPIA'], ['COSMOS','COSMOS'], [null,'SL2'], ['WAVELENGTH','WAVELENGTH'], [null,'SCARLETT_OD'], ['VALETON_GP150','VALETON_GP150'],
  ['VALETON_GP150','VALETON_GP180'], ['LINE6_M5','LINE6_M5'],
];
const STEP_FIGS = ['1/1','1/2','1/2 T','1/4 .','1/4','1/4 T','1/8 .','1/8','1/8 T','1/16 .','1/16','1/16 T','1/32'];
const PRESET_LAYOUTS = ['CLÁSSICO','L1','L2','L3','L4','LISTA','CUSTOM'];
const LIVE_LAYOUTS = ['—','L1','L2','L3','L4','CUSTOM'];
const ICON_SHAPES = ['PADRÃO','CÍRCULO','OCTÓGONO'];
const FAV_MODES = ['PRESET', 'LIVE'];

// ─────────────────────────────────────────────────────────────────────────────
// ESTADO
// ─────────────────────────────────────────────────────────────────────────────
// edit = modo de edição ligado; orig = cópia do global_config como veio no
// arquivo (pra marcar o que mudou e pro "desfazer tudo").
const S = { backup: null, name: '', view: 'global', tag: null, layer: 1, edit: false, orig: null };
let LED = LED_DEFAULT.map(([n, rgb]) => ({ name: n, rgb }));

// ─────────────────────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────────────────────
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v, d = 0) => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : d; };
const hex6 = (h) => '#' + (h >>> 0).toString(16).padStart(6, '0');
const rgbCss = (rgb) => `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
function darken(h, f) { const r = (h >> 16) & 255, g = (h >> 8) & 255, b = h & 255; return `rgb(${(r * f) | 0},${(g * f) | 0},${(b * f) | 0})`; }
function parseKv(str, sep) {
  const out = {};
  for (const pair of String(str || '').split(sep)) {
    const eq = pair.indexOf('='); if (eq < 0) continue;
    out[pair.slice(0, eq)] = pair.slice(eq + 1);
  }
  return out;
}
const gc = () => (S.backup && S.backup.global_config) || {};
const g = (k, d = '') => { const v = gc()[k]; return v === undefined || v === null ? d : String(v); };
const gi = (k, d = 0) => num(g(k), d);
const onoff = (v) => num(v) ? '<span class="chip ok">LIGADO</span>' : '<span class="chip off">DESLIGADO</span>';
const yes = (v) => num(v) ? '<span class="chip ok">SIM</span>' : '<span class="chip off">NÃO</span>';

// ── MODO DE EDIÇÃO (só global_config) ─────────────────────────────────────
// Cada controle carrega data-k = chave do global_config. O `change` delegado
// em $main grava a string no S.backup.global_config (mesmo formato que o
// editor manda no POST /config/global: tudo texto) e re-renderiza. A chave
// só passa a existir no arquivo quando o usuário mexe nela.
const E = () => S.edit;
const isChg = (k) => !!S.orig && String(gc()[k] ?? '') !== String(S.orig[k] ?? '');
function chgKeys() {
  const cur = gc(), o = S.orig || {};
  return [...new Set([...Object.keys(cur), ...Object.keys(o)])].filter((k) => String(cur[k] ?? '') !== String(o[k] ?? '')).sort();
}
const edCls = (k) => `ed${isChg(k) ? ' chg' : ''}`;
const optsHtml = (opts, cur) => opts.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(cur) ? ' selected' : ''}>${esc(l)}</option>`).join('');
const edSel = (k, opts, d = 0) => `<select class="${edCls(k)}" data-k="${k}">${optsHtml(opts, g(k, d))}</select>`;
const edNum = (k, min, max, d = 0) => `<input class="${edCls(k)}" type="number" data-k="${k}" min="${min}" max="${max}" value="${esc(g(k, d))}">`;
const edTxt = (k, max = 8) => `<input class="${edCls(k)}" type="text" data-k="${k}" maxlength="${max}" value="${esc(g(k))}">`;
const edChk = (k, d = 0, lbl = ['SIM', 'NÃO']) => `<label class="edc${isChg(k) ? ' chg' : ''}"><input type="checkbox" data-k="${k}" data-bool="1"${gi(k, d) ? ' checked' : ''}>${gi(k, d) ? lbl[0] : lbl[1]}</label>`;
const edLed = (k, d = 0) => `<span class="edrow">${ledDot(g(k, d), false)}${edSel(k, LED.map((c, i) => [i, c.name]), d)}</span>`;
const edPal = (k, d = 0) => `<span class="edrow"><span class="sw" style="background:${palCss(g(k, d))}"></span>${edSel(k, PAL.map((p, i) => [i, p.name]), d)}</span>`;
const edAct = (k, d = 0) => edSel(k, ACTIONS.map((a, i) => [i, a]), d);
const edLetter = (k, d = 0) => edSel(k, 'ABCDEFGHIJ'.split('').map((L, i) => [i, L]), d);
// leitura x edição: mesmo valor, controle só quando o modo está ligado
const vYes = (k, d = 0) => E() ? edChk(k, d) : yes(g(k, d));
const vOnOff = (k, d = 0) => E() ? edChk(k, d, ['LIGADO', 'DESLIGADO']) : onoff(g(k, d));
const vLed = (k, d = 0) => E() ? edLed(k, d) : ledDot(g(k, d));
const vSel = (k, opts, d, html) => E() ? edSel(k, opts, d) : html;
const vNum = (k, min, max, d, html) => E() ? edNum(k, min, max, d) : html;
const idx = (arr) => arr.map((a, i) => [i, a]);
function setKey(k, v) {
  if (!S.backup) return;
  if (!S.backup.global_config) S.backup.global_config = {};
  S.backup.global_config[k] = String(v);
}
function undoAll() {
  if (!S.backup || !S.orig) return;
  S.backup.global_config = JSON.parse(JSON.stringify(S.orig));
  render(true); updateInfo();
}
function exportBackup() {
  if (!S.backup) return;
  const base = (S.name || 'bfmidi-backup.json').replace(/\.json$/i, '').replace(/-editado(-\d+)?$/i, '');
  const fname = `${base}-editado.json`;
  // Mesmo formato do editor: JSON numa linha só. Estrutura intacta (presets,
  // sw_params, imagens, ícones, user_pedals) — só o global_config muda.
  const blob = new Blob([JSON.stringify(S.backup)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function ledDot(idx, withName = true) {
  const c = LED[num(idx)] || { name: '?', rgb: [80, 80, 80] };
  return `<span class="dot" style="--c:${rgbCss(c.rgb)}"></span>${withName ? `<span class="swname">${esc(c.name)}</span>` : ''}`;
}
function palCss(id) {
  const p = PAL[num(id)]; if (!p) return 'transparent';
  switch (p.type) {
    case 'none': return 'transparent';
    case 'solid': return hex6(p.hex);
    case 'g1': return `linear-gradient(180deg, ${hex6(p.hex)}, ${darken(p.hex, .35)})`;
    case 'g2': return `linear-gradient(135deg, ${hex6(p.hex)}, ${darken(p.hex, .3)})`;
    case 'custom': return `linear-gradient(180deg, #000 0%, ${hex6(p.hex)} 50%, #000 100%)`;
    case 'misc': {
      const deg = p.dir === 'H' ? '90deg' : p.dir === 'V' ? '180deg' : '135deg';
      return `linear-gradient(${deg}, ${hex6(p.hex)}, ${hex6(p.mid)}, ${hex6(p.end)})`;
    }
    case 'img': {
      const b64 = S.backup && S.backup.images && S.backup.images[String(p.slot)];
      return b64 ? `url(data:image/jpeg;base64,${b64}) center / cover no-repeat #000` : '#000';
    }
  }
  return 'transparent';
}
function palName(id) { const p = PAL[num(id)]; return p ? p.name : `#${id}`; }
function palTextColor(id) { const p = PAL[num(id)]; if (!p) return '#fff'; if (p.type === 'none' || p.type === 'img') return '#fff'; return hex6(p.hex); }
function dispSwatch(id, label) {
  const p = PAL[num(id)];
  const cls = p && p.type === 'none' ? 'style="background:repeating-linear-gradient(45deg,#333 0 4px,#222 4px 8px)"' : `style="background:${palCss(id)}"`;
  return `<span class="sw" ${cls}></span><span class="swname">${esc(label ? label + ': ' : '')}${esc(palName(id))}</span>`;
}

// ── nomes de CC/PC pelo MODO AMIGÁVEL ─────────────────────────────────────
function pedalIdxFor(ch) {
  const mm = gi('match_mode', 0);
  if (mm !== 0) return mm;
  const c = num(ch); if (c < 1 || c > 16) return 0;
  return gi('match_channel_' + (c - 1), 0);
}
function pedalNameOf(idx) {
  const i = num(idx); if (i <= 0) return null;
  const m = MATCH_MODE_PEDAL[i];
  if (m && m[0] === 'user') { const up = S.backup.user_pedals && S.backup.user_pedals[String(m[1])]; return (up && up.name) || MATCH_MODE_OPTIONS[i]; }
  return MATCH_MODE_OPTIONS[i] || `#${i}`;
}
function ccLabel(ch, n) {
  n = num(n);
  if (SPECIAL_CCS[n]) return SPECIAL_CCS[n];
  if (n >= 200 && n <= 321 && KEMPER[n]) return KEMPER[n];
  if (n >= 400 && n <= 504 && GP5[n]) return GP5[n];
  const idx = pedalIdxFor(ch); const m = MATCH_MODE_PEDAL[idx];
  if (!m) return '';
  if (m[0] === 'user') { const up = S.backup.user_pedals && S.backup.user_pedals[String(m[1])]; return (up && up.cc && up.cc[String(n)]) || ''; }
  const t = m[1] && D.CC_LABELS[m[1]]; return (t && t[String(n)]) || '';
}
function pcLabel(ch, n) {
  n = num(n);
  const idx = pedalIdxFor(ch); const m = MATCH_MODE_PEDAL[idx];
  if (!m) return '';
  if (m[0] === 'user') { const up = S.backup.user_pedals && S.backup.user_pedals[String(m[1])]; return (up && up.pc && up.pc[String(n)]) || ''; }
  const t = m[0] && D.PC_LABELS[m[0]]; return (t && t[n]) || '';
}
function ccMsg(ch, n, valHtml, extraCls) {

      ? `<span class="edrow"><span class="swname">x</span>${edNum('custom_only_x', 0, 100)}<span class="swname">y</span>${edNum('custom_only_y', 0, 100)}<span class="swname">s</span>${edNum('custom_only_size', 1, 100)}</span>`

  // MIDI / MODO AMIGÁVEL
  const mm = gi('match_mode');
  const pedalOpts = MATCH_MODE_OPTIONS.map((_, i) => [i, i === 0 ? 'MULTIPLE MODE' : pedalNameOf(i)]);
  let midiBody = kv([
    ['Modo amigável', E() ? edSel('match_mode', pedalOpts) : mm === 0 ? '<span class="chip acc">MULTIPLE MODE</span> <span class="swname">um aparelho por canal</span>' : `<span class="chip acc">${esc(pedalNameOf(mm))}</span>`],
    ['Omitir CC sem nome', vYes('match_omit_unnamed', 1)],
    ['MIDI reverso (USB host)', vYes('host_reverse_midi')],
    ['MIDI Control Host', vYes('host_ctrl_enabled')],
  ]);
  if (mm === 0) {
    const rows = []; for (let c = 1; c <= 16; c++) { const i = c - 1; const pIdx = gi('match_channel_' + i); const lcc = gi('match_live_cc_' + i);

        `<td><span class="edrow">${edNum('match_live_cc_' + i, 0, 127)}<span class="swname">on</span>${edNum('match_live_cc_on_' + i, 0, 127, 127)}<span class="swname">off</span>${edNum('match_live_cc_off_' + i, 0, 127)}</span></td></tr>`); continue; }

  if (usesKemper) parts.push(card('Kemper Player', kv([

  // SW GLOBAL 1/2

    parts.push(card(`External SW ${i}`, (mode === 'mute' ? '<div class="note">Sem função (MUTE).</div>' : paramsHtml(mode, p)) + `<div class="flags">${P(p, 'reset_on_preset') || gi(`ext${i}_reset_on_preset`) ? '<span class="chip">RESET AO TROCAR PRESET</span>' : ''}</div>` +
      `<div class="hr"></div>` + kv([['Indicador na tela', vSel(`ext_indic_show${i}`, idx(IND), 0, IND[ind] || `#${ind}`)],
        ...(ind ? [['Sigla', E() ? `<span class="edrow">${edTxt(`ext_indic_sigla${i}`, 8)}${edNum(`ext_indic_font_size${i}`, 1, 40)}<span class="swname">pt · x</span>${edNum(`ext_indic_x${i}`, 0, 100)}<span class="swname">y</span>${edNum(`ext_indic_y${i}`, 0, 100)}</span>`
            : `<span class="pill">${esc(g(`ext_indic_sigla${i}`))}</span> <span class="swname">${gi(`ext_indic_font_size${i}`)}pt · x${gi(`ext_indic_x${i}`)} y${gi(`ext_indic_y${i}`)}</span>`],
          ['Cores ON / OFF', E() ? `<span class="edrow">${edPal(`ext_indic_on_color${i}`)}${edPal(`ext_indic_off_color${i}`)}</span>` : `${dispSwatch(g(`ext_indic_on_color${i}`))} ${dispSwatch(g(`ext_indic_off_color${i}`))}`]] : [])]),
      '', SW_MODE_TITLE[mode] || mode));
  }

  // EXPRESSION
  if (gc().exp_enabled !== undefined) parts.push(card('Pedal de expressão', kv([
    ['Ativo', vOnOff('exp_enabled')],
    ['Destino', E() ? `<span class="edrow"><span class="swname">CC</span>${edNum('exp_cc', 0, 127, 11)}<span class="swname">canal</span>${edNum('exp_channel', 1, 16, 1)}<span class="swname">${esc(ccLabel(gi('exp_channel', 1), gi('exp_cc', 11)))}</span></span>` : ccMsg(gi('exp_channel', 1), gi('exp_cc', 11))],
    ['Calibração', E() ? `<span class="edrow">${edNum('exp_cal_min', 0, 4095)}<span class="swname">→</span>${edNum('exp_cal_max', 0, 4095, 4095)}</span>` : `<span class="pill">${gi('exp_cal_min')} → ${gi('exp_cal_max', 4095)}</span>`],
  ]) + '<div class="note">Um preset com um EXTRA de valor EXP substitui este destino enquanto estiver ativo.</div>'));

  // USER PEDALS
  const up = b.user_pedals || {};
  const upSlots = Object.keys(up).filter((k) => up[k] && (up[k].name || Object.keys(up[k].cc || {}).length || Object.keys(up[k].pc || {}).length));
  if (upSlots.length) parts.push(card('Aparelhos personalizados (USER 1/2/3)', upSlots.map((k) => { const u = up[k];
    const tbl = (obj, kind) => Object.keys(obj || {}).length ? `<table class="t"><thead><tr><th>${kind}</th><th>Nome</th></tr></thead><tbody>${Object.keys(obj).sort((a, c) => num(a) - num(c)).map((n) => `<tr><td class="n">${n}</td><td>${esc(obj[n])}</td></tr>`).join('')}</tbody></table>` : '';
    return `<div class="sec"><div class="sh">USER ${k} · <span style="color:var(--text)">${esc(u.name || '(sem nome)')}</span></div>${tbl(u.cc, 'CC')}${tbl(u.pc, 'PC')}${!Object.keys(u.cc || {}).length && !Object.keys(u.pc || {}).length ? '<div class="note">Sem rótulos.</div>' : ''}</div>`; }).join(''), 'span2'));

  // MÍDIA
  const imgs = Object.keys(b.images || {}).sort((a, c) => num(a) - num(c)); const ics = Object.keys(b.icons || {}).sort((a, c) => num(a) - num(c));
  if (imgs.length || ics.length) {
    const useMap = mediaUsage();
    const im = imgs.map((s) => `<div class="it"><div class="im" style="background-image:url(data:image/jpeg;base64,${b.images[s]})"></div><div class="cp"><b>Imagem ${num(s) + 1}</b><span>${(useMap.img[s] || []).join(' ') || '<i>sem uso</i>'}</span></div></div>`).join('');
    const ic = ics.map((s) => `<div class="it"><div class="im ic" style="background-image:url(data:image/png;base64,${b.icons[s]})"></div><div class="cp"><b>Ícone ${num(s) + 1}</b><span>${(useMap.ico[s] || []).join(' ') || '<i>sem uso</i>'}</span></div></div>`).join('');
    parts.push(card('Mídia no backup', (imgs.length ? `<div class="k swname" style="margin-bottom:6px">IMAGENS DE FUNDO (${imgs.length})</div><div class="media">${im}</div>` : '') +
      (ics.length ? `<div class="k swname" style="margin:12px 0 6px">ÍCONES ENVIADOS (${ics.length})</div><div class="media">${ic}</div>` : ''), 'span2', 'presets que usam cada item'));
  }

  // LED palette custom
  if (gc().color_0 !== undefined) parts.push(card('Paleta de LED', `<div class="letters">${LED.map((c, i) => `<div class="letter" title="${esc(c.name)}" style="width:auto;padding:0 10px;gap:6px;flex-direction:row;height:34px;font-size:11px">${ledDot(i, false)}${esc(c.name)}</div>`).join('')}</div><div class="note">Valores RGB gravados no backup (chaves color_N).</div>`, 'span2'));

  // LOG DE BOOT (backup gravado por editor >= 13.7): o que o pedal imprimiu
  // na serial desde o power-on, na hora em que o backup foi feito. E' o que o
  // suporte olha quando o cliente relata problema: a 2a linha ("reset: ...")
  // diz se o pedal reiniciou sozinho (BROWNOUT/PANIC/*_WDT) e o resto mostra
  // placa, LittleFS, PSRAM, display, WiFi e RECURSOS.
  let bootLogBox = '';
  if (typeof b.boot_log === 'string' && b.boot_log) {
    const m = /reset: ([A-Z_\/]+)/.exec(b.boot_log);
    const reason = m ? m[1] : '';
    const bad = /^(BROWNOUT|PANIC|INT_WDT|TASK_WDT|WDT)$/.test(reason);

    const chips = (reason ? `<span class="chip ${bad ? 'bad' : 'ok'}">RESET: ${esc(reason)}</span>` : '')
      + (truncated ? ' <span class="chip warn">LOG TRUNCADO</span>' : '')
      + ` <span class="chip">${b.boot_log.split('\n').filter(Boolean).length} LINHAS</span>`;
    bootLogBox = `<details class="raw"${bad ? ' open' : ''}><summary>Log de boot do pedal ${chips}</summary><pre>${esc(b.boot_log)}</pre></details>`;
  } else {
    bootLogBox = `<details class="raw"><summary>Log de boot do pedal <span class="chip">AUSENTE</span></summary><div class="note">Este backup nao traz o log de boot (editor/firmware anteriores ao 13.7).</div></details>`;
  }

  const raw = Object.keys(gc()).map((k) => `${k}=${gc()[k]}`).join('\n');
  return `<div class="view-intro"><h1>Global</h1><p>Configurações principais salvas pelo usuário neste backup.</p></div>${!Object.keys(gc()).length ? '<div class="warnbox">Este backup não contém configurações globais. Os valores abaixo são padrões de referência.</div>' : ''}${editBox}<div class="grid">${[parts[0], parts[primaryCount - 1], ...parts.slice(1, primaryCount - 1)].join('')}</div><details class="more"${E() ? ' open' : ''}><summary>Mais configurações · switches globais, expressão e mídia</summary><div class="grid">${parts.slice(primaryCount).join('')}</div></details>${bootLogBox}<details class="raw"><summary>Todas as chaves do global_config (${Object.keys(gc()).length})</summary><pre>${esc(raw)}</pre></details>`;
}

function mediaUsage() {
  const img = {}, ico = {};
  for (const tag of presetTags()) {
    const pr = presetOf(tag);
    for (const k of ['bg_color', 'back_layers_color']) { const id = num(pr.hdr[k]); if (id >= IMAGE_SLOT_FIRST_ID) (img[String(id - IMAGE_SLOT_FIRST_ID)] ||= []).push(tag); }
    const ids = new Set();
    for (const L of [1, 2]) for (const sw of pr.sws[L]) { const d = sw.d; [d.icon_id, ...d.spin.map((x) => x.icon_id), ...d.stomp.map((x) => x.icon_id), ...d.tap.map((x) => x.icon_id), d.spinlp.icon_id].forEach((i) => ids.add(i)); }
    for (const i of ids) if (i >= ICON_UPLOAD_FIRST_ID) (ico[String(i - ICON_UPLOAD_FIRST_ID)] ||= []).push(tag);
  }
  return { img, ico };
}

// ─────────────────────────────────────────────────────────────────────────────
// SW: estados (tiles) e parâmetros por modo
// ─────────────────────────────────────────────────────────────────────────────
const hasCh = (p, s = '') => P(p, 'ch' + s) >= 1 && P(p, 'ch' + s) <= 16;
function stompTier(p) { const hasB = hasCh(p, '2') || P(p, 'fav2'); const hasC = hasCh(p, '3') || P(p, 'fav3'); return { hasB, hasC }; }
function st(cap, tile) { return `<div class="state"><span class="cap">${cap}</span>${tile}</div>`; }
function statesHtml(mode, p, d, size, shape) {
  const T = (t) => tileHtml(t, size, shape);
  if (mode === 'fx1' || mode === 'fx2' || mode === 'fx3') {
    const { hasB, hasC } = mode === 'fx1' ? stompTier(p) : { hasB: true, hasC: mode === 'fx3' };
    let h = st('Curto OFF', T(mainState(d, false))) + st('Curto ON', T(mainState(d, true)));
    if (hasB) h += st('Longo OFF', T(subState(d, d.stomp[0]))) + st('Longo ON', T(subState(d, d.stomp[1])));
    if (hasC) h += st('Reclick OFF', T(subState(d, d.stomp[2]))) + st('Reclick ON', T(subState(d, d.stomp[3])));
    return h;
  }
  if (mode === 'spin') {
    let h = [0, 1, 2].map((i) => st(`Posição ${i + 1}`, T({ ...d.spin[i], ic: d.spin[i].ic_on, bg: d.spin[i].bg_on, br: d.spin[i].br_on, sg: -1 }))).join('');
    if (hasCh(p, 'lp_')) h += st('Long OFF', T({ ...d.spinlp, ic: d.spinlp.ic_off, bg: d.spinlp.bg_off, br: d.spinlp.br_off, sg: -1 })) + st('Long ON', T({ ...d.spinlp, ic: d.spinlp.ic_on, bg: d.spinlp.bg_on, br: d.spinlp.br_on, sg: -1 }));
    return h;
  }
  if (mode === 'tap_tempo') {
    let h = st('TAP', T(subState(d, d.tap[0])));
    if (hasCh(p, 'lp_')) h += st('Long OFF', T(subState(d, d.tap[1]))) + st('Long ON', T(subState(d, d.tap[2])));
    return h;
  }
  if (mode === 'control') return st('FX 1', T({ ...d.spin[0], ic: d.spin[0].ic_on, bg: d.spin[0].bg_on, br: d.spin[0].br_on, sg: d.sg_off })) + st('FX 2', T({ ...d.spin[1], ic: d.spin[1].ic_on, bg: d.spin[1].bg_on, br: d.spin[1].br_on, sg: d.sg_on }));
  if (mode === 'mute') return st('Tile', T(mainState(d, false)));
  return st('OFF', T(mainState(d, false))) + st('ON', T(mainState(d, true)));
}
const flag = (cond, label, cls = '') => cond ? `<span class="chip ${cls}">${label}</span>` : '';
const secHead = (label, colorIdx) => `<div class="sh">${colorIdx !== undefined ? ledDot(colorIdx, false) : ''}${label}</div>`;
function favHtml(p, s) {
  if (!P(p, 'fav' + s)) return '';
  const letters = 'ABCDEFGHIJ';
  return `<div class="msg"><span class="kind">FAV</span><span class="nm">vai para ${letters[P(p, 'fav_bank' + s)] || '?'}${P(p, 'fav_preset' + s, 1)}</span><span class="ch">${FAV_MODES[P(p, 'fav_mode' + s)] || ''}${P(p, 'fav_layer' + s) ? ' · L2' : ''}</span></div>`;
}
function stompSection(p, s, label, showEmpty) {
  const ch = P(p, 'ch' + s);
  if (!(ch >= 1 && ch <= 16) && !P(p, 'fav' + s)) return showEmpty ? `<div class="sec">${secHead(label)}<div class="note">Sem canal — seção inativa.</div></div>` : '';
  const custom = P(p, 'custom' + s);
  const on = custom ? P(p, 'on' + s, 127) : 127, off = custom ? P(p, 'off' + s, 0) : 0;
  return `<div class="sec">${secHead(label, P(p, 'color' + s, 1))}${ch >= 1 ? ccMsg(ch, P(p, 'num' + s), `ON ${on} · OFF ${off}`) : ''}${favHtml(p, s)}<div class="flags">` +
    flag(true, P(p, 'start' + s) ? 'COMEÇA LIGADO' : 'COMEÇA DESLIGADO', P(p, 'start' + s) ? 'ok' : 'off') + flag(P(p, 'at_preset' + s, 1), 'DISPARA NA CHAMADA') +
    flag(custom, 'VALORES CUSTOM') + flag(P(p, 'inv' + s), 'LED INVERTIDO') + flag(s && P(p, 'bka' + s), 'VOLTAR AO CURTO') + `</div></div>`;
}
function slotList(str, kind) {
  // kind: 'single' t:ch:num:val | 'macro' t:ch:num:on:off | 'mom' ch:num:on:off | 'tap' ch:num:mode | 'spin' ch:num:v1:v2:v3
  const rows = [];
  for (const q of splitSlots(str)) {
    if (kind === 'single') { const [t, ch, n, v] = q; if (!(ch >= 1)) continue; rows.push(t === 1 ? pcMsg(ch, n) : ccMsg(ch, n, v === 128 ? 'EXP' : v)); }
    else if (kind === 'macro') { const [t, ch, n, on, off] = q; if (!(ch >= 1)) continue; rows.push(t === 1 ? pcMsg(ch, n) : ccMsg(ch, n, `ON ${on < 0 ? '—' : on} · OFF ${off < 0 ? '—' : off}`)); }
    else if (kind === 'mom') { const [ch, n, on, off] = q; if (!(ch >= 1)) continue; rows.push(ccMsg(ch, n, `press ${on} · solta ${off}`)); }
    else if (kind === 'tap') { const [ch, n, m] = q; if (!(ch >= 1)) continue; rows.push(ccMsg(ch, n, m === 2 ? '127 → 0 (pulso)' : '127')); }
    else if (kind === 'spin') { const [ch, n, v1, v2, v3] = q; if (!(ch >= 1)) continue; rows.push(ccMsg(ch, n, `${v1} · ${v2} · ${v3}`)); }
  }
  return rows.join('');
}
function lpHtml(p, label = 'Long press') {
  if (!hasCh(p, 'lp_')) return '';
  return `<div class="sec">${secHead(label, P(p, 'lp_color', 1))}${ccMsg(P(p, 'lp_ch'), P(p, 'lp_num'), `ON ${P(p, 'lp_on', 127)} · OFF ${P(p, 'lp_off')}`)}<div class="flags">${flag(true, P(p, 'lp_start') ? 'COMEÇA LIGADO' : 'COMEÇA DESLIGADO', P(p, 'lp_start') ? 'ok' : 'off')}${flag(P(p, 'lp_at_preset'), 'DISPARA NA CHAMADA')}</div></div>`;
}
function paramsHtml(mode, p) {
  const emptyNote = '<div class="note">Nenhum envio configurado.</div>';
  switch (mode) {
    case 'mute': return '<div class="note">Sem função (MUTE).</div>';
    case 'fx1': case 'fx2': case 'fx3': {
      const { hasB, hasC } = mode === 'fx1' ? stompTier(p) : { hasB: true, hasC: mode === 'fx3' };
      const tier = hasC ? 3 : hasB ? 2 : 1;
      return `<div class="flags" style="margin:0 0 4px"><span class="chip acc">TIER ${tier}</span>${flag(P(p, 'ledu'), 'ANEL ÚNICO')}</div>` + stompSection(p, '', 'Click curto (A)', true) + (hasB ? stompSection(p, '2', 'Click longo (B)') : '') + (hasC ? stompSection(p, '3', 'Reclick (C)') : '');
    }
    case 'single': {
      const main = slotList(p.sslots, 'single') || (hasCh(p) ? (P(p, 'as_pc') ? pcMsg(P(p, 'ch'), P(p, 'pc')) : ccMsg(P(p, 'ch'), P(p, 'num'), P(p, 'on', 127))) : '');
      const long = slotList(p.lslots, 'single'), re = slotList(p.rslots, 'single');
      return `<div class="sec">${secHead('Click', P(p, 'color', 1))}${main || emptyNote}</div>` + (long ? `<div class="sec">${secHead('Long press', P(p, 'lp_color', 5))}${long}</div>` : '') + (re ? `<div class="sec">${secHead('Reclick', P(p, 'rc_color', 9))}${re}</div>` : '') +
        `<div class="flags">${flag(P(p, 'at_preset', 1), 'DISPARA NA CHAMADA')}${flag(P(p, 'remember_state'), 'LEMBRA ESTADO')}</div>`;
    }
    case 'macros': {
      let h = '';
      for (const [s, label] of [['', 'Click curto (A)'], ['2', 'Click longo (B)'], ['3', 'Reclick (C)']]) {
        const rows = slotList(p['mslots' + s], 'macro'); if (!rows && s) continue;
        h += `<div class="sec">${secHead(label, P(p, 'color' + s, 1))}${rows || emptyNote}<div class="flags">${flag(true, P(p, 'start' + s) ? 'COMEÇA LIGADO' : 'COMEÇA DESLIGADO', P(p, 'start' + s) ? 'ok' : 'off')}${flag(P(p, 'at_preset' + s, 1), 'DISPARA NA CHAMADA')}${flag(P(p, 'inv' + s), 'LED INVERTIDO')}${flag(s && P(p, 'bka' + s), 'VOLTAR AO CURTO')}</div></div>`;
      }
      return `<div class="flags" style="margin:0 0 4px">${flag(P(p, 'ledu'), 'ANEL ÚNICO')}</div>` + h;
    }
    case 'momentary': {
      const rows = slotList(p.mom_slots, 'mom') || (hasCh(p) ? ccMsg(P(p, 'ch'), P(p, 'num'), `press ${P(p, 'on', 127)} · solta ${P(p, 'off')}`) : '');
      return `<div class="sec">${secHead('Enquanto pisado', P(p, 'color', 1))}${rows || emptyNote}</div><div class="flags">${flag(P(p, 'led_tog'), 'ON/OFF SIMULADO')}${flag(P(p, 'fade_on') || P(p, 'fade_off'), `FADE ${P(p, 'fade_on')}/${P(p, 'fade_off')} ms`)}</div>`;
    }
    case 'tap_tempo': {
      const rows = slotList(p.tslots, 'tap');
      return `<div class="sec">${secHead('Tap (a cada batida)', P(p, 'color', 1))}${rows || emptyNote}</div>` + lpHtml(p);
    }
    case 'spin': {
      const rows = slotList(p.spin_slots, 'spin') || (hasCh(p) ? ccMsg(P(p, 'ch'), P(p, 'num'), `${P(p, 'val1')} · ${P(p, 'val2', 64)} · ${P(p, 'val3', 127)}`) : '');
      return `<div class="sec"><div class="sh">${ledDot(P(p, 'color', 1), false)}${ledDot(P(p, 'color2', 2), false)}${ledDot(P(p, 'color3', 0), false)} Posições 1 · 2 · 3</div>${rows || emptyNote}<div class="flags">${flag(P(p, 'at_preset', 1), 'DISPARA NA CHAMADA')}${flag(P(p, 'ledu'), 'ANEL EM 3 CORES')}</div></div>` + lpHtml(p);
    }
    case 'ramp': {
      const curve = ['LINEAR', 'EXP', 'LOG', 'SINE'][P(p, 'curve')] || '?';
      return `<div class="sec">${secHead('Varredura', P(p, 'color', 1))}${hasCh(p) ? ccMsg(P(p, 'ch'), P(p, 'num'), `${P(p, 'min_val')} → ${P(p, 'max_val', 127)}`) : emptyNote}<div class="flags"><span class="chip">SOBE ${P(p, 'up_ms', 1000)} ms</span><span class="chip">DESCE ${P(p, 'down_ms', 1000)} ms</span><span class="chip">${curve}</span><span class="chip">passo ${P(p, 'step_ms', 25)} ms</span>${flag(P(p, 'start_on'), 'COMEÇA NO MÁXIMO')}${flag(P(p, 'trigger'), 'GATILHO ' + P(p, 'trigger'))}</div></div>`;
    }
    case 'steps': {
      const vals = String(p.svals || '').split(':').filter((x) => x !== ''); const sync = P(p, 'sync');
      const figs = String(p.sfigs || '').split(':'), mss = String(p.smss || '').split(':');
      const stepsTbl = `<table class="t"><thead><tr><th>Step</th><th>Valor</th><th>${sync ? 'Figura' : 'Tempo'}</th></tr></thead><tbody>${vals.map((v, i) => `<tr><td class="n">${i + 1}</td><td class="n">${v}</td><td class="n">${sync ? (STEP_FIGS[num(figs[i], 4)] || '?') : (mss[i] !== undefined ? mss[i] + ' ms' : P(p, 'step_ms', 500) + ' ms')}</td></tr>`).join('')}</tbody></table>`;
      return `<div class="sec">${secHead('Sequência', P(p, 'color', 1))}${hasCh(p) ? ccMsg(P(p, 'ch'), P(p, 'num', 21)) : emptyNote}${stepsTbl}<div class="flags"><span class="chip acc">${sync ? (P(p, 'bsrc') ? `SYNC · BPM MANUAL ${P(p, 'bpm', 120)}` : 'SYNC · TAP') : 'TEMPO MANUAL'}</span>${flag(P(p, 'trig'), 'MOMENTÂNEO')}${flag(P(p, 'inv'), 'LED INVERTIDO')}</div></div>` +
        (P(p, 'eff_ch') >= 1 ? `<div class="sec">${secHead('Efeito ON/OFF')}${ccMsg(P(p, 'eff_ch'), P(p, 'eff_num', 20), P(p, 'eff_custom') ? `ON ${P(p, 'eff_on', 127)} · OFF ${P(p, 'eff_off')}` : 'ON 127 · OFF 0')}</div>` : '');
    }
    case 'control':
      return `<div class="sec">${secHead('FX 1', P(p, 'color', 1))}${hasCh(p) ? ccMsg(P(p, 'ch'), P(p, 'num'), '127 / 0') : emptyNote}</div><div class="sec">${secHead('FX 2', P(p, 'color2', 5))}${hasCh(p, '2') ? ccMsg(P(p, 'ch2'), P(p, 'num2'), '127 / 0') : emptyNote}</div><div class="flags"><span class="chip">COMEÇA EM FX ${P(p, 'start') ? 2 : 1}</span>${flag(P(p, 'at_preset', 1), 'DISPARA NA CHAMADA')}</div>`;
    default: {
      const keys = Object.keys(p); if (!keys.length) return emptyNote;
      return `<div class="kv">${keys.map((k) => `<div class="k">${esc(k)}</div><div class="v mono">${esc(p[k])}</div>`).join('')}</div>`;
    }
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER — PRESETS
// ─────────────────────────────────────────────────────────────────────────────
function renderPresets() {
  const tags = presetTags();
  if (!tags.length) return '<div class="empty"><h2>Sem presets</h2><p>Este backup não traz presets.</p></div>';
  if (!S.tag || !tags.includes(S.tag)) S.tag = tags[0];
  const groups = {}; for (const t of tags) (groups[t[0]] ||= []).push(t);
  const bank = S.tag[0];
  const bankOn = (letter) => gi('bank_letter_enabled_' + 'ABCDEFGHIJ'.indexOf(letter), 1);
  const bar = '<div class="view-intro"><h1>Preset</h1><p>Escolha o banco e o preset para conferir seus envios e as funções de cada switch.</p></div>' +
    '<section class="preset-selector" aria-label="Seletor de banco e preset"><span class="selector-label">Banco</span><div class="bank-row">' +
    Object.keys(groups).sort().map(L => '<button class="bank-btn ' + (L === bank ? 'on ' : '') + (bankOn(L) ? '' : 'off') + '" data-bank="' + esc(L) + '" aria-pressed="' + (L === bank) + '" aria-label="Banco ' + esc(L) + (bankOn(L) ? '' : ' desativado') + '">' + esc(L) + '</button>').join('') +
    '</div><div class="preset-row" aria-label="Presets do banco ' + esc(bank) + '">' + groups[bank].map(t => {
      const h = parseKv(S.backup.presets[t], '|');
      return '<button class="pbtn ' + (t === S.tag ? 'on ' : '') + (num(h.enabled, 1) ? '' : 'off') + '" data-tag="' + esc(t) + '" aria-pressed="' + (t === S.tag) + '"><span class="tg">' + esc(t) + '</span><span class="sw" style="background:' + palCss(h.bg_color) + '"></span><span class="nm">' + esc(h.name || '(sem nome)') + (num(h.enabled, 1) ? '' : ' · desativado') + '</span></button>';
    }).join('') + '</div>' + (bankOn(bank) ? '' : '<p class="note">Este banco está desativado nas configurações globais.</p>') + '</section>';
  return bar + renderPresetDetail(presetOf(S.tag));
}

function friendlySummary() {
  if (!Object.keys(gc()).length) return '<p class="note">Modo amigável indisponível: este backup não traz configurações globais.</p>';
  const mm = gi('match_mode');
  if (mm) return '<span class="chip acc">' + esc(pedalNameOf(mm)) + '</span><p class="note">Os nomes dos comandos abaixo seguem este aparelho.</p>';
  const rows = [];
  for (let ch = 1; ch <= 16; ch++) {
    const pedal = pedalIdxFor(ch);
    if (pedal) rows.push(['Canal ' + ch, esc(pedalNameOf(pedal))]);
  }
  return '<span class="chip acc">MULTIPLE MODE</span><p class="note">Um aparelho por canal MIDI.</p>' + (rows.length ? kv(rows) : '<p class="note">Nenhum aparelho atribuído aos canais.</p>');
}

function screenPreset(pr) {
  const h = pr.hdr; const bg = num(h.bg_color); const nameCol = palTextColor(h.name_color); const borderCol = PAL[num(h.name_border_color)] && PAL[num(h.name_border_color)].type !== 'none' ? palTextColor(h.name_border_color) : null;
  const fs = num(h.font_size, 24); const cq = (fs * 1.15 / 480 * 100).toFixed(2);
  const x = h.name_x !== undefined ? num(h.name_x) : 50, y = h.name_y !== undefined ? num(h.name_y) : 50;
  const tagCol = PAL[num(h.tag_color)] && PAL[num(h.tag_color)].type !== 'none' ? palTextColor(h.tag_color) : '#aaa';
  return `<div class="screen"><div class="bgimg" style="background:${palCss(bg)}"></div><div class="ptag" style="color:${tagCol}">${pr.tag}</div>` +
    `<div class="pname" style="left:${x}%;top:${y}%;--fs:${cq};color:${nameCol};${num(h.font_bold, 1) ? '' : 'font-weight:500;'}${borderCol ? `-webkit-text-stroke:1px ${borderCol};` : ''}">${esc(h.name || '')}</div></div>`;
}
function screenLive(pr, layer) {
  const h = pr.hdr; const swN = presetSwitchCount(); const shape = gi('icon_shape');
  const sws = pr.sws[layer];
  const tile = (i) => { const sw = sws[i - 1]; const p = sw.p, d = sw.d;
    let t;
    if (sw.mode === 'spin' || sw.mode === 'control') t = { ...d.spin[0], ic: d.spin[0].ic_on, bg: d.spin[0].bg_on, br: d.spin[0].br_on, sg: -1 };
    else if (sw.mode === 'tap_tempo') t = subState(d, d.tap[0]);
    else t = mainState(d, !!P(p, 'start'));
    return `<div style="display:flex;align-items:center;justify-content:center;min-width:0">${tileHtml(t, 62, shape)}</div>`; };
  const order = swN === 4 ? [3, 4, 1, 2] : [4, 5, 6, 1, 2, 3];
  const cls = swN === 4 ? 'c2' : 'c3';
  return `<div class="screen"><div class="bgimg" style="background:${palCss(h.back_layers_color)}"></div>` +
    (gi('name_preset_live', 1) ? `<div class="strip" style="color:${palTextColor(h.name_color)}">${esc(h.name || '')}${layer === 2 ? ' · L2' : ''}</div>` : '') +
    `<div class="tiles ${cls}">${order.map(tile).join('')}</div></div>`;
}

function renderPresetDetail(pr) {
  const h = pr.hdr; const swN = presetSwitchCount(); const letters = 'ABCDEFGHIJ';
  const hasL2 = num(h.l2) === 1; if (!hasL2) S.layer = 1;
  const head = `<div class="phead"><span class="tag">${pr.tag}</span><span class="big">${esc(h.name || '(sem nome)')}</span>${num(h.enabled, 1) ? '<span class="chip ok">ATIVO</span>' : '<span class="chip bad">DESATIVADO</span>'}` +
    (hasL2 ? `<span class="chip acc">LAYER 2</span><div class="layerseg"><button data-layer="1" class="${S.layer === 1 ? 'on' : ''}">LAYER 1</button><button data-layer="2" class="${S.layer === 2 ? 'on' : ''}">LAYER 2</button></div>` : '') + `</div>`;

  const chamada = `<div class="sec"><div class="sh">Na chamada do preset</div>${(num(h.channel) >= 1 && num(h.channel) <= 16) ? pcMsg(h.channel, h.bank) : '<div class="note">Sem PC principal (canal 0).</div>'}` +
    pr.extras.map((e) => e.t === 'pc' ? pcMsg(e.ch, e.n) : ccMsg(e.ch, e.n, e.v === 128 ? '<span class="chip acc">EXP</span>' : e.v)).join('') + `</div>`;
  const layoutOv = (v, list) => (v === '' || v === undefined || num(v) < 0) ? '<span class="swname">herda o global</span>' : `<span class="chip acc">${list[num(v)] || '#' + v}</span>`;
  const info = card('Preset', kv([
    ['Program Change', `<span class="pill">PC ${num(h.bank)}</span> <span class="swname">canal ${num(h.channel)}</span>`],
    ['Fundo (PRESET)', dispSwatch(h.bg_color)],
    ['Fundo (LIVE)', dispSwatch(h.back_layers_color)],
    ['Cor do nome', `${dispSwatch(h.name_color)} ${PAL[num(h.name_border_color)] && PAL[num(h.name_border_color)].type !== 'none' ? '· borda ' + dispSwatch(h.name_border_color) : ''}`],
    ['Fonte do nome', `<span class="pill">${num(h.font_size, 24)}pt</span> ${num(h.font_bold, 1) ? 'NEGRITO' : 'REGULAR'} <span class="swname">x${h.name_x ?? '—'} y${h.name_y ?? '—'}</span>`],
    ['Cor da tag', dispSwatch(h.tag_color)],
    ['Layer 2', yes(h.l2)],
    ['Indicadores ESW', yes(h.esw ?? 1)],
    ['Layout PRESET', layoutOv(h.plyt, PRESET_LAYOUTS)],
    ['Layout LIVE', layoutOv(h.llyt, LIVE_LAYOUTS)],
    ['Envios extras', `<span class="pill">${pr.extras.length}</span>`],
  ]));
  const screens = card('Prévia da tela', `<div style="display:flex;gap:18px;flex-wrap:wrap"><div class="screenwrap"><span class="cap">Modo PRESET</span>${screenPreset(pr)}</div><div class="screenwrap"><span class="cap">Modo LIVE${hasL2 ? ' · layer ' + S.layer : ''}</span>${screenLive(pr, S.layer)}</div></div><div class="note">Prévia aproximada (layout L1, estado inicial de cada switch).</div>`, 'span2');

  const shape = gi('icon_shape');
  const sws = pr.sws[S.layer].slice(0, swN).map((sw) => {
    const ledIdx = sw.mode === 'spin' ? P(sw.p, 'color', 1) : P(sw.p, 'color', 1);
    return `<section class="card swcard"><h3><span class="num">SW ${sw.n}</span><span class="mode">${SW_MODE_TITLE[sw.mode] || sw.mode}</span><span class="sub">${sw.mode !== 'mute' ? ledDot(ledIdx) : ''}</span></h3><div class="body">` +
      `<div class="states">${statesHtml(sw.mode, sw.p, sw.d, 74, shape)}</div>${sw.d.font ? `<div class="flags" style="margin:-4px 0 6px"><span class="chip">FONTE ${['AUTO', '9pt', '12pt', '18pt', '24pt'][sw.d.font] || '?'}</span></div>` : ''}${paramsHtml(sw.mode, sw.p)}</div></section>`;
  }).join('');

  const rawLines = Object.keys(pr.lines).map((k) => `${k}: ${pr.lines[k]}`).join('\n');
  return head + `<div class="preset-overview">${card('Preset chamado · PC e envios extras', chamada + '<p class="note">Os envios automáticos dos switches estão identificados nos cartões abaixo como “Dispara na chamada”.</p>')}${card('Modo amigável', friendlySummary())}</div><h2 class="sect">${swN} switches · modo LIVE${hasL2 ? ' · layer ' + S.layer : ''}</h2><p class="section-note">Comandos separados por gesto e estado. ON / OFF indicam os valores enviados ao ativar e desativar cada função.</p><div class="swgrid">${sws}</div><details class="more"><summary>Aparência e prévia da tela do preset</summary><div class="grid">${info}${screens}</div></details>` +
    `<details class="raw"><summary>Dados crus do preset ${pr.tag}</summary><pre>${esc(S.backup.presets[pr.tag])}\n\n${esc(rawLines)}</pre></details>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// APP
// ─────────────────────────────────────────────────────────────────────────────
const $main = document.getElementById('main');
const $info = document.getElementById('fileinfo');
const $edit = document.getElementById('edit');
const $export = document.getElementById('export');
// keepScroll: re-render depois de uma edição não pula pro topo.
function render(keepScroll = false) {
  if (!S.backup) {
    $main.innerHTML = `<div class="empty" id="drop"><h2>${S.view === 'global' ? 'Global · configurações do usuário' : 'Preset · bancos e switches'}</h2><p>Abra um backup da BFMiDi para começar.</p><p>Arraste o arquivo <span class="k">bfmidi-backup-*.json</span> aqui ou use o botão <b>ABRIR BACKUP</b>.</p><p>Nada é enviado a lugar nenhum — tudo é lido no seu navegador.</p><p>Com o arquivo aberto, <b>EDITAR</b> libera a troca de placa, modo amigável, LEDs etc. e <b>EXPORTAR</b> baixa o backup alterado.</p></div>`;
    return;
  }
  const y = window.scrollY;
  $main.innerHTML = S.view === 'global' ? renderGlobal() : renderPresets();
  window.scrollTo({ top: keepScroll ? y : 0 });
}
function setView(v) { S.view = v; document.querySelectorAll('.seg button').forEach((b) => { b.classList.toggle('on', b.dataset.view === v); b.setAttribute('aria-pressed', String(b.dataset.view === v)); }); $edit.hidden = v !== 'global'; render(); }
function updateInfo() {
  const b = S.backup; if (!b) return;
  const gcOk = !!(b.global_config && Object.keys(b.global_config).length);
  const ch = S.orig ? chgKeys().length : 0;
  $info.innerHTML = `<span class="fname" title="${esc(S.name)}">${esc(S.name)}</span><span class="chip">v${esc(b.version)}</span>${gcOk ? `<span class="chip acc">${esc(boardCanonical(b.global_config.board) || 'placa ?')}</span>` : '<span class="chip warn">SEM GLOBAL_CONFIG</span>'}${num(b.truncated) ? '<span class="chip bad">TRUNCADO</span>' : ''}${ch ? `<span class="chip warn" title="${esc(chgKeys().join(', '))}">MODIFICADO · ${ch}</span>` : ''}`;
}
function setEdit(on) {
  S.edit = !!on; $edit.classList.toggle('on', S.edit);
  if (S.edit && S.view !== 'global') setView('global'); else render(true);
}
function load(text, name) {
  let b;
  try { b = JSON.parse(text); } catch (e) { alert('Arquivo não é um JSON válido.'); return; }
  if (!b || typeof b !== 'object' || !b.presets) { alert('Este JSON não parece um backup da BFMiDi (sem "presets").'); return; }
  S.backup = b; S.name = name; S.tag = null; S.layer = 1; S.edit = false; $edit.classList.remove('on');
  // paleta de LED do próprio backup (color_N), quando presente
  LED = LED_DEFAULT.map(([n, rgb], i) => { const v = b.global_config && b.global_config['color_' + i]; const q = v ? String(v).split(',').map((x) => num(x)) : null; return { name: n, rgb: q && q.length === 3 ? q : rgb }; });
  const gcOk = !!(b.global_config && Object.keys(b.global_config).length);
  S.orig = gcOk ? JSON.parse(JSON.stringify(b.global_config)) : null;
  updateInfo();
  document.querySelectorAll('.seg button').forEach((x) => { x.disabled = false; });
  $edit.disabled = !gcOk; $export.disabled = false;
  setView(S.view);
}
document.getElementById('file').addEventListener('change', (e) => { const f = e.target.files[0]; if (!f) return; f.text().then((t) => load(t, f.name)); e.target.value = ''; });
document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));
$edit.addEventListener('click', () => setEdit(!S.edit));
$export.addEventListener('click', exportBackup);
$main.addEventListener('click', (e) => {
  if (e.target.closest('#undo')) { if (confirm('Desfazer TODAS as alterações e voltar ao que está no arquivo?')) undoAll(); return; }
  const bank = e.target.closest('[data-bank]'); if (bank) { S.tag = presetTags().find(t => t[0] === bank.dataset.bank); S.layer = 1; render(); return; }
  const pb = e.target.closest('.pbtn'); if (pb) { S.tag = pb.dataset.tag; S.layer = 1; render(); return; }
  const lb = e.target.closest('.layerseg button'); if (lb) { S.layer = num(lb.dataset.layer, 1); render(); }
});
// Edição: qualquer controle com data-k grava no global_config e re-renderiza
// (o card pode mudar de forma — ex.: MULTIPLE MODE abre a tabela de canais).
$main.addEventListener('change', (e) => {
  const el = e.target.closest('[data-k]'); if (!el || !S.edit) return;
  const k = el.dataset.k; let v;
  if (el.dataset.bool) v = el.checked ? '1' : '0';
  else if (el.type === 'number') { const n = num(el.value, num(el.min)); v = String(Math.min(num(el.max, 1e9), Math.max(num(el.min, -1e9), n))); }
  else v = el.value;
  // Placa: escolher o MESMO modelo que já estava (só com o nome novo) não é
  // alteração — mantém a grafia gravada no arquivo.
  if (el.dataset.board && boardCanonical(v) === boardCanonical(S.orig.board || '')) v = S.orig.board;
  setKey(k, v);
  render(true); updateInfo();
});
document.addEventListener('dragover', (e) => { e.preventDefault(); const d = document.getElementById('drop'); if (d) d.classList.add('over'); });
document.addEventListener('dragleave', () => { const d = document.getElementById('drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', (e) => { e.preventDefault(); const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) f.text().then((t) => load(t, f.name)); });
render();
</script>
</body>
</html>
