<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BFMiDi · Backup View</title>
<style>
  :root {
    --bg: #0C1016;
    --card-a: #1B2029; --card-b: #141820;
    --line: rgba(255,255,255,.075); --line2: rgba(255,255,255,.13);
    --text: #F2F4F7; --soft: #C9CFD6; --muted: #8E97A3; --faint: #5F6873;
    --accent: #FC6337; --accent2: #FF8A4C; --ok: #2BD65B;
    --r: 1.1rem;
  }
  /* Tudo em rem: 16px numa janela de 1728px (a largura da imagem de referência),
     escalando junto com a janela até 11px. A composição mantém a proporção. */
  html { font-size: clamp(11px, calc(100vw / 108), 16px); }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; color: var(--text); font-size: .95rem; line-height: 1.35;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(40rem 28rem at -4% 104%, rgba(252,99,55,.22), transparent 70%),
      radial-gradient(52rem 18rem at 62% 108%, rgba(252,99,55,.10), transparent 70%),
      radial-gradient(70rem 36rem at 50% -12%, rgba(64,92,140,.16), transparent 70%),
      var(--bg);
    background-attachment: fixed; }
  ::selection { background: rgba(252,99,55,.35); }
  button { font: inherit; color: inherit; }

  /* ── topo ── */
  .top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap;
    min-height: 4.9rem; padding: .9rem 2.5rem; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(16,20,26,.97), rgba(11,14,19,.97)); }
  .brand { display: flex; align-items: center; gap: 1.2rem; white-space: nowrap; }
  .brand .name { font-size: 1.55rem; font-weight: 600; letter-spacing: .01em; }
  .brand b { color: var(--accent); font-weight: 900; }
  .brand .sep { width: 1px; height: 1.7rem; background: var(--line2); }
  .brand .sub { font-size: 1.05rem; font-weight: 600; letter-spacing: .05em; color: var(--muted); text-transform: uppercase; }
  .filebtn { margin-left: .7rem; display: inline-flex; align-items: center; gap: .75rem; height: 2.65rem; padding: 0 1.35rem; border-radius: .7rem; cursor: pointer;
    background: linear-gradient(180deg, #FF8B50, #F1602A); color: #1A0B04; font-size: .95rem; font-weight: 900; letter-spacing: .06em; text-transform: uppercase;
    box-shadow: 0 0 1.6rem -.2rem rgba(252,99,55,.6), inset 0 1px 0 rgba(255,255,255,.35); }
  .filebtn svg { width: 1.2rem; height: 1.2rem; }
  .filebtn:hover { filter: brightness(1.06); }
  .filebtn input { display: none; }
  .fileinfo { margin-left: auto; display: flex; align-items: center; gap: 1.1rem; flex-wrap: wrap; color: var(--muted); font-size: .95rem; font-weight: 700; }
  .fileinfo .fname { color: var(--text); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; max-width: 30vw;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  main { max-width: 108rem; margin: 0 auto; padding: 1.5rem 2.75rem 2.5rem; }
  .empty { margin: 10vh auto; max-width: 38rem; text-align: center; padding: 3rem 2rem; border-radius: 1.4rem; border: 2px dashed rgba(255,255,255,.14);
    background: linear-gradient(180deg, rgba(27,32,41,.6), rgba(20,24,32,.6)); color: var(--muted); font-size: 1.05rem; transition: .2s; }
  .empty.over { border-color: var(--accent); background: rgba(252,99,55,.07); color: var(--text); }
  .empty h2 { margin: 0 0 .6rem; color: var(--text); font-size: 1.7rem; font-weight: 900; letter-spacing: .02em; }
  .empty p { margin: .4rem 0; }
  .empty .k { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--accent2); }

  .chip { display: inline-flex; align-items: center; gap: .6rem; height: 2.65rem; padding: 0 1.2rem; border-radius: 999px; font-size: .95rem; font-weight: 900;
    letter-spacing: .065em; text-transform: uppercase; white-space: nowrap; color: var(--text); background: rgba(12,15,20,.75); border: 1px solid var(--line2); }
  .chip svg { width: 1.3rem; height: 1.3rem; }
  .chip .dot { width: .7rem; height: .7rem; border-radius: 50%; background: currentColor; box-shadow: 0 0 .6rem currentColor; }
  .chip.ok { color: #3BE377; border-color: rgba(43,214,91,.6); background: rgba(43,214,91,.08); }
  .chip.acc { color: var(--accent2); border-color: rgba(252,99,55,.7); background: rgba(252,99,55,.08); box-shadow: 0 0 1rem -.35rem rgba(252,99,55,.6); }
  .chip.bad { color: #FF8A8A; border-color: rgba(255,72,72,.55); background: rgba(255,72,72,.08); }
  .chip.warn { color: #FFD766; border-color: rgba(255,204,32,.5); background: rgba(255,204,32,.08); }

  /* superfície comum dos cards */
  .console, .principal, .row, details.boot, .phead {
    background: linear-gradient(180deg, var(--card-a), var(--card-b)); border: 1px solid var(--line); border-radius: var(--r);
    box-shadow: 0 1.4rem 2.6rem -1.6rem rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.045); }

  /* ── linha de cima: console · modelo · principal ── */
  .hero { display: grid; grid-template-columns: 29.8rem minmax(0, 1fr) 29.75rem; gap: 1.4rem; align-items: stretch; margin-bottom: 1.4rem; }
  .console { align-self: start; display: flex; align-items: center; gap: 1.05rem; padding: 1rem 1rem 1rem 1.1rem; }
  .display { position: relative; flex: none; width: 11.45rem; height: 10.1rem; border-radius: .95rem; cursor: pointer; user-select: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(120% 80% at 50% 0%, #131820 0%, #06080B 65%);
    border: 1px solid rgba(255,255,255,.07); border-bottom: 2px solid var(--accent);
    box-shadow: inset 0 .2rem .9rem rgba(0,0,0,.9), 0 .7rem 1.3rem -.7rem rgba(252,99,55,.85); }
  .display .bk { font-size: 4.4rem; font-weight: 900; line-height: .9; letter-spacing: -.015em; color: #fff; }
  .display .sub { margin-top: .2rem; font-size: 1.2rem; font-weight: 700; letter-spacing: .02em; color: #D9DEE4; }
  .display .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 1.4rem; height: 2.6rem; padding: 0; border: 0; background: transparent;
    color: var(--muted); cursor: pointer; font-size: 1.4rem; font-weight: 900; opacity: 0; transition: .15s; }
  .display .nav.l { left: .2rem; } .display .nav.r { right: .2rem; }
  .display:hover .nav { opacity: .9; }
  .display .nav:hover { color: var(--accent2); }
  .display .nav:disabled { visibility: hidden; }
  .keys { display: grid; grid-template-columns: repeat(3, 4.5rem); grid-auto-rows: 4.4rem; gap: .875rem .9rem; }
  .keys.k2 { grid-template-columns: repeat(2, 4.5rem); }
  .key { border-radius: .85rem; border: 1px solid rgba(255,255,255,.075); background: linear-gradient(180deg, #242B35, #181D25); color: #E9EDF2;
    font-size: 2.35rem; font-weight: 800; cursor: pointer; transition: .12s;
    box-shadow: 0 .35rem .8rem -.2rem rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05); }
  .key:hover:not(:disabled) { border-color: rgba(252,99,55,.45); }
  .key.on { color: #fff; border-color: rgba(255,178,130,.55); background: linear-gradient(180deg, #FF8D55, #F25D26);
    box-shadow: 0 0 1.7rem -.1rem rgba(252,99,55,.6), inset 0 1px 0 rgba(255,255,255,.35); }
  .key:disabled { cursor: not-allowed; }
  .key.off:not(.on) { opacity: .5; }

  .model { position: relative; overflow: hidden; container-type: inline-size; min-width: 0; border-radius: var(--r);
    display: flex; flex-direction: column; justify-content: center; padding: 1.8rem 2.6rem;
    background: radial-gradient(55% 95% at 90% 18%, rgba(252,99,55,.24), transparent 70%),
      radial-gradient(40% 70% at 100% 100%, rgba(252,99,55,.14), transparent 70%), linear-gradient(180deg, #1B1F27, #11141A);
    border: 1px solid rgba(252,99,55,.6);
    box-shadow: 0 0 0 1px rgba(252,99,55,.12), 0 0 2.4rem -.3rem rgba(252,99,55,.4), inset 0 0 2.2rem rgba(252,99,55,.07), 0 1.4rem 2.6rem -1.6rem rgba(0,0,0,.85); }
  .model > :not(.dev) { position: relative; z-index: 1; }
  .model small { font-size: 1.05rem; font-weight: 900; letter-spacing: .3em; color: var(--accent); }
  .model .name { margin: .55rem 0 1.15rem; font-size: min(3.9rem, 9.6cqw); font-weight: 900; line-height: 1.05; letter-spacing: .005em; white-space: nowrap;
    text-shadow: 0 .2rem 1.2rem rgba(0,0,0,.6); }
  .model .tags { display: flex; gap: 1.1rem; flex-wrap: wrap; }
  .model .tags .chip { font-size: 1.05rem; padding: 0 1.3rem; }
  .model .dev { position: absolute; z-index: 0; right: -4.5rem; top: .25rem; width: 50%; pointer-events: none;
    -webkit-mask-image: linear-gradient(100deg, transparent 16%, #000 44%); mask-image: linear-gradient(100deg, transparent 16%, #000 44%); }
  .model .dev text { font-family: inherit; }
  @container (max-width: 30rem) { .model .dev { opacity: .35; } }

  /* ── card PRINCIPAL (o header do preset: PC, canal e extras), no visual do editor ── */
  .principal { container-type: inline-size; min-width: 0; padding: .8rem 1.25rem 1rem; }
  .pbanner { height: 3.15rem; border-radius: .9rem; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #05070A, #0B0E12); border: 1px solid rgba(255,255,255,.08); box-shadow: inset 0 .25rem .7rem rgba(0,0,0,.9);
    font-size: 2rem; font-weight: 900; letter-spacing: .03em; }
  .pfields { display: grid; gap: .7rem; margin-top: 1.05rem; }
  .fld { display: flex; height: 3.5rem; min-width: 0; border-radius: .8rem; overflow: hidden;
    background: linear-gradient(180deg, #161A21, #10141A); border: 1px solid rgba(255,255,255,.08); }
  .fld .ftag { width: 5.5rem; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2rem;
    color: #fff; font-size: .85rem; font-weight: 900; letter-spacing: .05em; }
  .fld .ftag svg { width: 1.4rem; height: 1.4rem; }
  .fld.pc .ftag { background: linear-gradient(180deg, #3D8DFF, #1B5CE3); }
  .fld.ch .ftag { background: linear-gradient(180deg, #FF8C50, #EF5E27); }
  .fld.ch { height: 3.6rem; border-color: rgba(252,99,55,.75); box-shadow: 0 0 1.1rem -.35rem rgba(252,99,55,.55); }
  .fld .fval { flex: 1; min-width: 0; display: flex; align-items: center; gap: .95rem; padding: 0 1rem 0 1.25rem; font-size: 1.9rem; font-weight: 800; }
  .fld .fval small { font-size: .95rem; font-weight: 700; letter-spacing: .03em; color: #D5DAE0; text-transform: uppercase;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fld .chev { margin-left: auto; flex: none; color: var(--muted); }
  .fld .chev svg { width: 1.2rem; height: 1.2rem; }
  .fld.ch .fval { color: #FF7C47; font-size: 2rem; font-weight: 600; }
  .fld.off .fval { color: var(--muted); }
  .chrow { display: flex; gap: .8rem; min-width: 0; }
  .chrow .fld { flex: 1; }
  .xbtn { position: relative; flex: none; width: 7.3rem; height: 3.6rem; border-radius: .8rem; cursor: pointer; border: 1px solid rgba(255,255,255,.1);
    background: linear-gradient(180deg, #1D232C, #151A21); color: #E6EAEE; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: .25rem; font-size: .82rem; font-weight: 900; letter-spacing: .08em; box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
  .xbtn svg { width: 1.35rem; height: 1.35rem; }
  .xbtn:hover:not(:disabled) { border-color: rgba(252,99,55,.6); }
  .xbtn:disabled { cursor: default; }
  .xbtn.on { color: var(--accent2); border-color: rgba(252,99,55,.7); }
  .xbtn .cnt { position: absolute; top: -.45rem; right: -.45rem; min-width: 1.4rem; height: 1.4rem; padding: 0 .35rem; border-radius: .7rem; background: var(--accent);
    color: #1b0c05; font-size: .8rem; font-weight: 900; display: flex; align-items: center; justify-content: center; letter-spacing: 0; }
  .xlist { margin-top: .8rem; display: grid; gap: .45rem; }
  .xlist .xi { display: flex; align-items: center; gap: .6rem; padding: .55rem .8rem; border-radius: .7rem; background: #10141A; border: 1px solid var(--line);
    font-weight: 800; font-size: 1rem; text-transform: uppercase; min-width: 0; }
  .xlist .xi span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .xlist .xi .k { flex: none; font-size: .75rem; padding: .15rem .45rem; border-radius: .35rem; color: #fff; }
  .xlist .xi .k.pc { background: #1B5CE3; } .xlist .xi .k.cc { background: #3a3f46; }
  .xlist .xi .c { margin-left: auto; flex: none; color: var(--muted); font-size: .85rem; }
  /* Largo (card ocupando a linha toda): PC e CANAL lado a lado. */
  @container (min-width: 44rem) { .pfields { grid-template-columns: 1fr 1.3fr; } }

  /* ── cabeçalho do preset ── */
  .phead { display: inline-flex; align-items: center; gap: 1.6rem; flex-wrap: wrap; padding: .6rem 1.1rem .6rem 1.3rem; margin-bottom: .9rem;
    background: linear-gradient(180deg, #141820, #0F1318); }
  .phead .tag { display: flex; align-items: center; justify-content: center; height: 3.25rem; min-width: 5.05rem; padding: 0 .9rem; border-radius: .8rem;
    font-size: 2rem; font-weight: 900; color: var(--accent2);
    background: linear-gradient(180deg, rgba(252,99,55,.30), rgba(252,99,55,.14)); border: 1px solid rgba(252,99,55,.65); box-shadow: 0 0 1.1rem -.35rem rgba(252,99,55,.6); }
  .phead .big { font-size: 2.45rem; font-weight: 900; line-height: 1; letter-spacing: .005em; }
  .phead .chip { height: 2.75rem; padding: 0 1.35rem; font-size: 1rem; }
  .phead .chip.acc { padding: 0 1.65rem; }
  .layerseg { display: inline-flex; gap: .3rem; padding: .2rem; border-radius: .95rem; background: rgba(8,10,14,.8); border: 1px solid var(--line); }
  .layerseg button { height: 2.75rem; padding: 0 1.65rem; border-radius: .75rem; border: 1px solid transparent; background: transparent; cursor: pointer;
    color: #AEB5BE; font-size: 1.1rem; font-weight: 900; letter-spacing: .05em; }
  .layerseg button.on { color: var(--accent2); border-color: rgba(252,99,55,.7); background: linear-gradient(180deg, rgba(252,99,55,.24), rgba(252,99,55,.1));
    box-shadow: 0 0 1.1rem -.35rem rgba(252,99,55,.65); }

  /* ── lista dos SWs (2 colunas: 1-2-3 | 4-5-6) ── */
  .swlist { display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: column; gap: .8rem 1.7rem; }
  .row { display: grid; grid-template-columns: 2.6rem .32rem 3.75rem minmax(0, 1fr) auto; align-items: center; column-gap: 1.3rem;
    min-height: 6.95rem; padding: .85rem 1.3rem .85rem 1.45rem; }
  .row .n { font-size: 4rem; font-weight: 900; line-height: 1; text-align: center; letter-spacing: -.02em; }
  .row .bar { width: .32rem; height: 3.5rem; border-radius: .2rem; background: var(--c, #3a3e44);
    box-shadow: 0 0 .8rem var(--c, transparent), 0 0 .25rem var(--c, transparent); }
  .row .txt { min-width: 0; display: flex; flex-direction: column; gap: .75rem; }
  /* A célula do modo é container: nome longo (MOMENTARY, TAP TEMPO) encolhe até caber. */
  .row .mode { min-width: 0; container-type: inline-size; }
  .row .mode span { display: block; font-size: clamp(1.1rem, calc(100cqw / (var(--len, 6) * .8)), 2.15rem); font-weight: 900; line-height: .95;
    letter-spacing: .01em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .midi { font-size: 1.2rem; font-weight: 700; letter-spacing: .01em; line-height: 1.15; text-transform: uppercase; color: #E9EDF2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .midi .more { margin-left: .6rem; font-size: .85rem; color: var(--accent2); letter-spacing: .04em; }
  .row .midi .ch { color: var(--muted); }
  .row .midi.none { color: var(--muted); font-size: 1rem; letter-spacing: .08em; }
  .opts { display: flex; gap: .6rem; padding: .5rem; border-radius: .95rem; background: linear-gradient(180deg, #0E1217, #0A0D11);
    border: 1px solid rgba(255,255,255,.05); box-shadow: inset 0 .2rem .6rem rgba(0,0,0,.7); }
  .opt { width: 4.15rem; height: 3.9rem; border-radius: .7rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .38rem;
    background: linear-gradient(180deg, #1B2029, #151920); border: 1px solid rgba(255,255,255,.07); color: #E9EDF2; box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
  .opt svg { width: 1.6rem; height: 1.6rem; }
  .opt i { font-style: normal; font-size: .68rem; font-weight: 800; letter-spacing: .07em; line-height: 1; color: var(--soft); text-transform: uppercase; }
  .opt.on { color: var(--accent2); border-color: rgba(252,99,55,.8); background: linear-gradient(180deg, rgba(252,99,55,.26), rgba(252,99,55,.12));
    box-shadow: 0 0 1.1rem -.3rem rgba(252,99,55,.6), inset 0 1px 0 rgba(255,200,170,.15); }
  .opt.on i { color: var(--accent2); }

  /* tile do SW (porte simplificado do icon_tile_render) */
  .tile { position: relative; border-radius: 18%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; gap: 4%; width: var(--s, 3.75rem); height: var(--s, 3.75rem); flex: none; border: .16rem solid transparent; }
  .tile.circle { border-radius: 50%; }
  .tile.octagon { clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }
  .tile .ico { width: 62%; height: 62%; -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
  .tile img.ico { -webkit-mask: none; mask: none; object-fit: contain; }
  .tile .sg { font-size: calc(var(--s, 3.75rem) * .15 * var(--k, 1)); font-weight: 800; letter-spacing: .03em; line-height: 1; max-width: 92%; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .tile .sg.big { font-size: calc(var(--s, 3.75rem) * .26); }
  .tile .miss { font-size: 1.2rem; color: #777; }
  .tile.bare { border-color: #8C939C; background: #0F1318 !important; }

  /* ── log de boot (barra de largura total) ── */
  details.boot { margin-top: 1.1rem; background: linear-gradient(180deg, #151920, #10141A); }
  details.boot summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 1.9rem; flex-wrap: wrap; min-height: 4.05rem;
    padding: .55rem 2.25rem; font-size: 1rem; font-weight: 800; letter-spacing: .2em; color: #AAB2BC; text-transform: uppercase; }
  details.boot summary::-webkit-details-marker { display: none; }
  details.boot summary::before { content: ''; flex: none; width: .62rem; height: .62rem; margin-right: .1rem; border-top: .2rem solid var(--accent);
    border-right: .2rem solid var(--accent); transform: rotate(45deg); transition: transform .15s; filter: drop-shadow(0 0 .3rem rgba(252,99,55,.7)); }
  details.boot[open] summary::before { transform: rotate(135deg); }
  details.boot summary .chips { display: flex; gap: 1.2rem; flex-wrap: wrap; }
  details.boot pre { margin: 0 1.2rem 1.2rem; background: #0B0E12; border: 1px solid var(--line2); border-radius: .8rem; padding: 1rem; font-size: .85rem;
    overflow: auto; max-height: 30rem; color: #C9CED3; }
  details.boot .note { padding: 0 2.25rem 1.2rem; color: var(--muted); font-size: .95rem; }

  @media (max-width: 1100px) {
    .hero { grid-template-columns: auto minmax(0, 1fr); }
    .hero > .principal { grid-column: 1 / -1; }
  }
  @media (max-width: 1000px) {
    .swlist { grid-template-columns: 1fr; grid-auto-flow: row; }
  }
  @media (max-width: 720px) {
    html { font-size: 11px; }
    .top { padding: .8rem 1.1rem; gap: .8rem; }
    .brand .sep, .brand .sub { display: none; }
    .filebtn { margin-left: 0; }
    .fileinfo { margin-left: 0; width: 100%; }
    main { padding: 1.1rem 1.1rem 2rem; }
    .hero { grid-template-columns: 1fr; }
    .console { justify-self: center; }
    .phead { display: flex; gap: 1rem; }
    .phead .big { font-size: 2rem; }
    .row { grid-template-columns: 2.4rem .32rem 3.75rem minmax(0, 1fr); grid-template-areas: "n b t x" "o o o o"; row-gap: .9rem; padding: 1rem 1.1rem 1.1rem; }
    .row .n { grid-area: n; font-size: 3.4rem; } .row .bar { grid-area: b; } .row .tile { grid-area: t; } .row .txt { grid-area: x; }
    .row .opts { grid-area: o; justify-self: start; }
    .row .midi { font-size: 1.3rem; }
    .opt i { font-size: .78rem; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="name"><b>BFMIDI</b> BACKUP VIEW</span><i class="sep"></i><span class="sub">Visualizador de backup</span></div>

// ── mensagens MIDI de um SW (a 1ª vai pra linha; todas vão pro tooltip) ──
function swMessages(mode, p) {
  const out = [];
  const cc = (ch, n) => { if (validCh(ch)) out.push({ t: num(n) >= 128 ? 'CMD' : 'CC', ch, n: num(n) }); };
  const pc = (ch, n) => { if (validCh(ch)) out.push({ t: 'PC', ch, n: num(n) }); };
  switch (mode) {
    case 'fx1': case 'fx2': case 'fx3':
      for (const s of ['', '2', '3']) if (hasCh(p, s)) cc(P(p, 'ch' + s), P(p, 'num' + s));
      break;
    case 'macros':
      for (const s of ['', '2', '3']) for (const [t, ch, n] of splitSlots(p['mslots' + s])) (t === 1 ? pc : cc)(ch, n);
      break;
    case 'single': {
      const slots = [...splitSlots(p.sslots), ...splitSlots(p.lslots), ...splitSlots(p.rslots)];
      if (slots.length) for (const [t, ch, n] of slots) (t === 1 ? pc : cc)(ch, n);
      else if (hasCh(p)) (P(p, 'as_pc') ? pc(P(p, 'ch'), P(p, 'pc')) : cc(P(p, 'ch'), P(p, 'num')));
      break;
    }
    case 'momentary': {
      const sl = splitSlots(p.mom_slots);
      if (sl.length) for (const [ch, n] of sl) cc(ch, n); else cc(P(p, 'ch'), P(p, 'num'));
      break;
    }
    case 'tap_tempo':
      for (const [ch, n] of splitSlots(p.tslots)) cc(ch, n);
      cc(P(p, 'lp_ch'), P(p, 'lp_num'));
      break;
    case 'spin': {
      const sl = splitSlots(p.spin_slots);
      if (sl.length) for (const [ch, n] of sl) cc(ch, n); else cc(P(p, 'ch'), P(p, 'num'));
      cc(P(p, 'lp_ch'), P(p, 'lp_num'));
      break;
    }
    case 'steps': cc(P(p, 'ch'), P(p, 'num', 21)); cc(P(p, 'eff_ch'), P(p, 'eff_num', 20)); break;
    case 'control': cc(P(p, 'ch'), P(p, 'num')); cc(P(p, 'ch2'), P(p, 'num2')); break;
    case 'ramp': cc(P(p, 'ch'), P(p, 'num')); break;
  }
  for (const m of out) m.name = m.t === 'PC' ? pcLabel(m.ch, m.n) : ccLabel(m.ch, m.n);
  return out;
}

function ringSvg(colors) {

  const r = 9.6, c = 12;
  const glow = (col) => `style="filter:drop-shadow(0 0 3px ${col})"`;
  if (colors[0] === colors[1] && colors[1] === colors[2])
    return `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><circle cx="${c}" cy="${c}" r="${r}" stroke="${colors[0]}" ${glow(colors[0])}/></svg>`;
  const pt = (deg) => `${(c + r * Math.cos(deg * Math.PI / 180)).toFixed(2)} ${(c + r * Math.sin(deg * Math.PI / 180)).toFixed(2)}`;
  return `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.6">` +
    [150, 270, 30].map((deg, i) => `<path d="M${pt(deg - 60)} A${r} ${r} 0 0 1 ${pt(deg + 60)}" stroke="${colors[i]}" ${glow(colors[i])}/>`).join('') + `</svg>`;

function optsHtml(mode, p) {

  if (!b || typeof b !== 'object' || !b.presets) { alert('Este JSON não parece um backup da BFMiDi (sem "presets").'); return; }
  S.backup = b; S.name = name; S.layer = 1;
  // paleta de LED do próprio backup (color_N), quando presente
  LED = LED_DEFAULT.map(([n, rgb], i) => { const v = b.global_config && b.global_config['color_' + i]; const q = v ? String(v).split(',').map((x) => num(x)) : null; return { name: n, rgb: q && q.length === 3 ? q : rgb }; });
  // Abre no preset inicial do backup (início automático), senão no primeiro que existir.
  const tags = Object.keys(b.presets).sort();
  const autoTag = (LETTERS[gi('auto_start_bank')] || 'A') + gi('auto_start_preset', 1);
  const start = hasPreset(autoTag) ? autoTag : tags[0];
  S.bank = start[0]; S.pi = num(start.slice(1), 1);
  updateInfo(); render();
}
document.getElementById('file').addEventListener('change', (e) => { const f = e.target.files[0]; if (!f) return; f.text().then((t) => load(t, f.name)); e.target.value = ''; });
$main.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-bank]'); if (nav) { e.stopPropagation(); stepBank(num(nav.dataset.bank, 1)); return; }
  if (e.target.closest('#bankNext')) { stepBank(1); return; }
  if (e.target.closest('#extras')) { S.showExtras = !S.showExtras; render(); return; }
  const k = e.target.closest('.key'); if (k && !k.disabled) { S.pi = num(k.dataset.pi, 1); S.layer = 1; render(); return; }
  const lb = e.target.closest('.layerseg button'); if (lb) { S.layer = num(lb.dataset.layer, 1); render(); }
});
document.addEventListener('keydown', (e) => {
  if (!S.backup || e.ctrlKey || e.metaKey || e.altKey || (e.target.closest && e.target.closest('input, select, textarea'))) return;
  if (e.key === 'ArrowRight') stepBank(1);
  else if (e.key === 'ArrowLeft') stepBank(-1);
  else if (/^[1-6]$/.test(e.key) && num(e.key) <= swCount() && hasPreset(S.bank + e.key)) { S.pi = num(e.key); S.layer = 1; render(); }
});
document.addEventListener('dragover', (e) => { e.preventDefault(); const d = document.getElementById('drop'); if (d) d.classList.add('over'); });
document.addEventListener('dragleave', () => { const d = document.getElementById('drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', (e) => { e.preventDefault(); const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) f.text().then((t) => load(t, f.name)); });
render();
</script>
