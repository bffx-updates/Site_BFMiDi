<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BFMiDi · Backup View</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0C1016">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230C1016'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23FC6337' stroke-width='3.5'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark;
    --bg: #090E15;
    --card-a: #1B2533; --card-b: #131B26;
    --line: rgba(255,255,255,.075); --line2: rgba(255,255,255,.13);
    --text: #F2F4F7; --soft: #C9CFD6; --muted: #8E97A3; --faint: #5F6873;
    --accent: #FC6337; --accent2: #FF8A4C; --ok: #2BD65B;
    --r: 1.1rem;
  }
  /* Poços e peças internas (mostrador, banner, campos, EXTRAS, trilho e tiles das opções, layer,
     teclas, log) no mesmo matiz azul-ardósia dos cards (≈214°), com a luminância amostrada na referência. */
  /* Tudo em rem: 16px numa janela de 1728px (a largura da imagem de referência),
     escalando junto com a janela até 11px. A composição mantém a proporção. */
  html { font-size: clamp(11px, calc(100vw / 108), 16px); }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  /* Texto pequeno com piso de 11px: max(11px, …) nos rótulos miúdos. */
  body { min-height: 100vh; color: var(--text); font-size: max(11px, .95rem); line-height: 1.35;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    /* brilhos como na referência: canto inferior direito e borda esquerda a meia altura */
    background:
      radial-gradient(44rem 26rem at 104% 106%, rgba(252,99,55,.22), transparent 70%),
      radial-gradient(22rem 30rem at -6% 64%, rgba(252,99,55,.13), transparent 70%),
      radial-gradient(70rem 36rem at 50% -12%, rgba(64,92,140,.16), transparent 70%),
      var(--bg);
    background-attachment: fixed; }
  ::selection { background: rgba(255,255,255,.22); color: #fff; }
  button { font: inherit; color: inherit; }
  /* controles e peças do console não selecionam texto no arraste */
  .key, .opt, .chip, .layerseg, .xbtn, .tile, .ftag, .display { -webkit-user-select: none; user-select: none; }
  /* foco de teclado: anel pêssego, visível sobre o laranja e sobre o grafite */
  :where(button, summary, pre):focus-visible { outline: 2px solid #FFD2B8; outline-offset: 3px; }

  /* ── topo ── */
  /* fundo opaco (o conteúdo não aparece por trás); sombra só depois de rolar */
  .top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap;
    min-height: 4.9rem; padding: .9rem 2.5rem; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #131820, #0C1015); }
  .top.scrolled { box-shadow: 0 .6rem 1.2rem -.6rem rgba(0,0,0,.8); }
  .brand { display: flex; align-items: center; gap: 1.2rem; white-space: nowrap; }
  .brand .name { font-size: 1.55rem; font-weight: 600; letter-spacing: .01em; }
  .brand b { color: var(--accent); font-weight: 900; }
  .brand .sep { width: 1px; height: 1.7rem; background: var(--line2); }
  .brand .sub { font-size: 1.05rem; font-weight: 600; letter-spacing: .05em; color: var(--muted); text-transform: uppercase; }
  .filebtn { position: relative; margin-left: .7rem; display: inline-flex; align-items: center; gap: .75rem; height: 2.65rem; padding: 0 1.35rem; border-radius: .7rem; cursor: pointer;
    background: linear-gradient(180deg, #FF8B50, #F1602A); color: #1A0B04; font-size: max(11px, .95rem); font-weight: 900; letter-spacing: .06em; text-transform: uppercase;
    box-shadow: 0 0 1.6rem -.2rem rgba(252,99,55,.6), inset 0 1px 0 rgba(255,255,255,.35); }
  .filebtn svg { width: 1.2rem; height: 1.2rem; }
  .filebtn:hover { filter: brightness(1.06); }
  /* o input fica escondido só da vista: continua na ordem do Tab, e o anel vai no botão */
  .filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip-path: inset(50%); pointer-events: none; }
  .filebtn:has(input:focus-visible) { outline: 2px solid #FFD2B8; outline-offset: 3px; }
  .fileinfo { margin-left: auto; min-width: 0; display: flex; align-items: center; gap: 1.1rem; flex-wrap: wrap; color: var(--muted); font-size: max(11px, .95rem); font-weight: 700; }
  .fileinfo .fname { color: var(--text); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; max-width: 30vw;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* chips do arquivo (versão, presets, truncado) andam juntos: se não cabem ao lado do nome, descem todos */
  .fileinfo .fchips { display: flex; align-items: center; gap: inherit; flex-wrap: wrap; min-width: 0; }
  /* ≥721px: quem cede é o nome do arquivo (reticências), só quando falta espaço de verdade */
  @media (min-width: 721px) {
    .brand, .filebtn { flex: none; }
    .filebtn { white-space: nowrap; }
    .fileinfo { flex: 1 1 auto; flex-wrap: nowrap; justify-content: flex-end; }
    .fileinfo .fname { max-width: none; min-width: 3rem; flex: 0 1 auto; }
    .fileinfo .chip, .fileinfo .fchips { flex: none; }
  }
  /* ≥900px: topo numa linha só. O topo é fixo: o foco de teclado não pode ficar escondido atrás dele. */
  @media (min-width: 900px) {
    html { scroll-padding-top: 5.9rem; }
    .top { flex-wrap: nowrap; }
  }
  @media (max-width: 1239px) { .brand .sep, .brand .sub { display: none; } }
  /* abaixo de 900 (onde o topo pode quebrar em 2 linhas) e em paisagem baixa: o topo rola junto (não come a altura da tela) */
  @media (max-width: 899px), (max-height: 500px) { html { scroll-padding-top: 0; } .top { position: static; } }

  /* margem lateral = a do topo (2.5rem): conteúdo colado às bordas do cabeçalho */
  main { max-width: 108rem; margin: 0 auto; padding: 1.5rem 2.5rem 1.9rem; }
  .empty { margin: 10vh auto; max-width: 38rem; text-align: center; padding: 3rem 2rem; border-radius: 1.4rem; border: 2px dashed rgba(255,255,255,.14);
    background: linear-gradient(180deg, rgba(27,37,51,.6), rgba(19,27,38,.6)); color: var(--muted); font-size: 1.05rem; cursor: pointer; transition: opacity .2s; }
  .empty:hover { border-color: rgba(252,99,55,.5); }
  .empty svg { display: block; width: 3rem; height: 3rem; color: var(--accent); margin: 0 auto .8rem; }
  .empty h2 { margin: 0 0 .6rem; color: var(--text); font-size: 1.7rem; font-weight: 900; letter-spacing: .02em; }
  .empty p { margin: .4rem 0; }
  .empty b { color: var(--accent2); }
  .empty .k { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--accent2); }
  /* arrastando um arquivo por cima da página (com ou sem backup aberto) */
  body.dragging .empty { border-color: var(--accent); background: rgba(252,99,55,.07); color: var(--text); }
  body.dragging::after { content: 'Solte para abrir o backup'; position: fixed; inset: 1rem; z-index: 50; display: grid; place-items: center;
    border: 2px dashed var(--accent); border-radius: 1.4rem; background: rgba(10,13,18,.8); font-size: 1.6rem; font-weight: 900; pointer-events: none; }

  /* chip neutro elevado (base opaca, fio claro em cima), não afundado */
  .chip { display: inline-flex; align-items: center; gap: .6rem; height: 2.65rem; padding: 0 1.2rem; border-radius: 999px; font-size: max(11px, .95rem); font-weight: 900;
    letter-spacing: .065em; text-transform: uppercase; white-space: nowrap; color: var(--text);
    background: linear-gradient(180deg, #18212C, #111820); border: 1px solid rgba(170,195,225,.2); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
  .chip[title] { cursor: help; }
  .chip svg { width: 1.3rem; height: 1.3rem; }
  .chip .dot { width: .7rem; height: .7rem; border-radius: 50%; background: currentColor; box-shadow: 0 0 .6rem currentColor; }
  .chip.ok { color: #3BE377; border-color: rgba(43,214,91,.6); background: rgba(43,214,91,.08); box-shadow: 0 0 1rem -.35rem rgba(43,214,91,.6); }
  .chip.acc { color: var(--accent2); border-color: rgba(252,99,55,.7); background: rgba(252,99,55,.08); box-shadow: 0 0 1rem -.35rem rgba(252,99,55,.6); }
  .chip.bad { color: #FF8A8A; border-color: rgba(255,72,72,.55); background: rgba(255,72,72,.08); }
  .chip.warn { color: #FFD766; border-color: rgba(255,204,32,.5); background: rgba(255,204,32,.08); }
  /* placa fora do catálogo: o silício não é conhecido */
  .chip.unk { color: var(--muted); border-style: dashed; }

  /* superfície comum dos cards: luz no topo e à esquerda, base escura (como na referência) */
  .console, .principal, .row, details.boot, .phead, .mmap {
    background: linear-gradient(180deg, var(--card-a), var(--card-b)); border-radius: var(--r);
    border: 1px solid rgba(255,255,255,.07); border-top-color: rgba(255,255,255,.2); border-left-color: rgba(255,255,255,.12); border-bottom-color: rgba(0,0,0,.45);
    box-shadow: 0 1.4rem 2.6rem -1.6rem rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.08); }

  /* ── linha de cima: console · modelo · principal ── */
  /* Os três com a altura do PRINCIPAL fechado; abrir EXTRAS aumenta só o PRINCIPAL. */
  .hero { display: grid; grid-template-columns: 29.8rem minmax(0, 1fr) 29.75rem; gap: 1.4rem; align-items: start; margin-bottom: 1.4rem; }
  .hero > .console, .hero > .model, .hero > .principal { min-height: 13.95rem; }
  .console { display: flex; align-items: center; gap: 1.05rem; padding: 1rem 1rem 1rem 1.1rem; }
  .display { position: relative; flex: none; width: 11.45rem; height: 10.1rem; border-radius: .95rem; cursor: pointer; user-select: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(120% 80% at 50% 0%, #141C27 0%, #080D14 65%);
    border: 1px solid rgba(255,255,255,.07); border-bottom: 2px solid var(--accent);
    box-shadow: inset 0 .2rem .9rem rgba(0,0,0,.9), 0 .7rem 1.3rem -.7rem rgba(252,99,55,.85); }
  .display .bk { font-size: 4.4rem; font-weight: 900; line-height: .9; letter-spacing: -.015em; color: #fff; }
  .display .sub { margin-top: .2rem; font-size: 1.2rem; font-weight: 700; letter-spacing: .02em; color: #D9DEE4; }
  /* Setas de banco: faixa da altura do mostrador (alvo ≥24px). Invisíveis em repouso,
     como na referência; aparecem no hover e no foco, e sempre no toque. */
  .display .nav { position: absolute; top: 0; height: 100%; width: max(24px, 1.9rem); padding: 0; border: 0; background: transparent;
    display: flex; align-items: center; justify-content: center; color: var(--muted); cursor: pointer; opacity: 0; transition: opacity .15s; }
  .display .nav svg { width: 1.2rem; height: 1.2rem; }
  .display .nav.l { left: .2rem; } .display .nav.r { right: .2rem; }
  /* aparece sem transição (o render recria a seta e ela piscaria); o fade é só para sumir */
  .display:hover .nav, .display:focus-within .nav { opacity: .9; transition: none; }
  .display .nav:hover { color: var(--accent2); }
  .display .nav:focus-visible { opacity: 1; outline-offset: -3px; border-radius: .45rem; }
  .display .nav:disabled { visibility: hidden; }
  @media (hover: none) { .display .nav { opacity: .7; } }
  /* um banco só: mostrador inerte */
  .display.single { cursor: default; }
  .keys { display: grid; grid-template-columns: repeat(3, 4.5rem); grid-auto-rows: 4.4rem; gap: .875rem .9rem; }
  .keys.k2 { grid-template-columns: repeat(2, 4.5rem); margin-inline: auto; }
  .key { border-radius: .85rem; border: 1px solid rgba(255,255,255,.075); background: linear-gradient(180deg, #212B38, #161E29); color: #E9EDF2;
    font-size: 2.35rem; font-weight: 800; cursor: pointer; transition: transform .12s;
    box-shadow: 0 .35rem .8rem -.2rem rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05); }
  .key:hover:not(:disabled):not(.on) { border-color: rgba(252,99,55,.75); }
  .key.on { color: #fff; border-color: rgba(255,178,130,.55); background: linear-gradient(180deg, #F26C33, #D24E1A);
    box-shadow: 0 0 1.7rem -.1rem rgba(252,99,55,.6), inset 0 1px 0 rgba(255,255,255,.35); }
  /* tracejado = slot fora do backup; hachurado = preset desativado */
  .key:disabled { cursor: not-allowed; background: transparent; border: 1px dashed rgba(255,255,255,.14); color: var(--faint); box-shadow: none; }
  .key.off:not(.on) { color: #7C8591; background: repeating-linear-gradient(135deg, #1A222D 0 .3rem, #141A23 .3rem .6rem); }
  .key:active:not(:disabled) { transform: translateY(1px) scale(.97); }

  .model { position: relative; overflow: hidden; container-type: inline-size; min-width: 0; border-radius: var(--r);
    display: flex; flex-direction: column; justify-content: center; padding: 1.8rem 2.6rem;
    /* O MODELO não segue a luz 'topo claro, base escura' dos outros cards: como na referência, a moldura
       é um fio laranja inteiro, mais aceso nos cantos superior esquerdo e inferior direito. Os fundos vão
       no padding-box; as três últimas camadas (border-box) só aparecem na borda. */
    background: radial-gradient(55% 95% at 90% 18%, rgba(252,99,55,.24), transparent 70%) padding-box,
      radial-gradient(40% 70% at 100% 100%, rgba(252,99,55,.16), transparent 70%) padding-box, linear-gradient(180deg, #1B1F27, #11141A) padding-box,
      radial-gradient(38% 80% at 0% 0%, #FFB27A, rgba(252,99,55,0) 100%) border-box,
      radial-gradient(42% 90% at 100% 100%, #FFC48A, rgba(252,99,55,0) 100%) border-box,
      linear-gradient(rgba(252,99,55,.55), rgba(252,99,55,.55)) border-box;
    border: 1px solid transparent;
    box-shadow: 0 0 0 1px rgba(252,99,55,.08), 0 0 2.2rem -.5rem rgba(252,99,55,.36),
      inset 0 0 2.2rem rgba(252,99,55,.07), 0 1.4rem 2.6rem -1.6rem rgba(0,0,0,.85); }
  .model > :not(.dev) { position: relative; z-index: 1; }
  .model small { font-size: 1.05rem; font-weight: 900; letter-spacing: .3em; color: var(--accent); }
  /* O nome da placa encolhe pelo número de letras (--len) até caber inteiro;
     com até 15 letras fica no tamanho de sempre. */
  .model .name { margin: .55rem 0 1.15rem; font-size: clamp(1.6rem, min(9.6cqw, calc(100cqw / (var(--len, 14) * .66))), 3.9rem); font-weight: 900; line-height: 1.05;
    letter-spacing: .005em; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 .2rem 1.2rem rgba(0,0,0,.6); }
  .model .tags { display: flex; gap: 1.1rem; flex-wrap: wrap; }
  .model .tags .chip { font-size: 1.05rem; padding: 0 1.3rem; }
  /* chips coloridos com base opaca: o desenho do pedal não aparece por baixo */
  .model .tags .chip.acc { background: linear-gradient(rgba(252,99,55,.1), rgba(252,99,55,.1)), #141A23; }
  .model .tags .chip.bad { background: linear-gradient(rgba(255,72,72,.1), rgba(255,72,72,.1)), #141A23; }
  /* ilustração dimensionada pela altura e centrada no card (não vaza em nenhuma largura) */
  .model .dev { position: absolute; z-index: 0; right: -4rem; top: 50%; width: auto; height: 14.5rem; transform: translateY(-50%); pointer-events: none;
    -webkit-mask-image: linear-gradient(100deg, transparent 16%, #000 44%); mask-image: linear-gradient(100deg, transparent 16%, #000 44%); }
  .model .dev text { font-family: inherit; }
  /* 15 letras (BFMIDI-S3 MICRO / NANO+): o desenho só recua um pouco, para o nome não encostar no 'BFMIDI' dele */
  .model.mid .dev { opacity: .55; right: -5.4rem; top: 54%; }
  /* mais de 15 (placa fora do catálogo): quase some */
  .model.long .dev { opacity: .22; }
  @container (max-width: 30rem) { .model .dev, .model.mid .dev { opacity: .35; } }

  /* ── card PRINCIPAL (o header do preset: PC, canal e extras), no visual do editor ── */
  .principal { container-type: inline-size; min-width: 0; padding: .8rem 1.25rem 1rem; }
  .pbanner { position: relative; height: 3.15rem; border-radius: .9rem; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #0A1119, #0E151F); border: 1px solid rgba(255,255,255,.08); box-shadow: inset 0 .25rem .7rem rgba(0,0,0,.9);
    font-size: 2rem; font-weight: 900; letter-spacing: .03em; }
  /* fio sob o banner, como na referência */
  .pbanner::after { content: ''; position: absolute; left: .4rem; right: .4rem; bottom: -.55rem; height: 1px; background: rgba(255,255,255,.07); }
  .pfields { display: grid; gap: .7rem; margin-top: 1.05rem; }
  .fld { display: flex; height: 3.5rem; min-width: 0; border-radius: .8rem; overflow: hidden;
    background: linear-gradient(180deg, #15202B, #0F1721); border: 1px solid rgba(255,255,255,.08); }
  .fld .ftag { width: 5.5rem; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2rem;
    color: #fff; font-size: max(11px, .85rem); font-weight: 900; letter-spacing: .05em; }
  .fld .ftag svg { width: 1.4rem; height: 1.4rem; }
  /* contraste AA: azul um pouco mais fechado no PC; no CANAL o laranja fica e o rótulo escurece */
  .fld.pc .ftag { background: linear-gradient(180deg, #2F7BF5, #1B5CE3); }
  .fld.ch .ftag { background: linear-gradient(180deg, #FF8C50, #EF5E27); color: #1A0B04; }
  .fld.ch { height: 3.6rem; border-color: rgba(252,99,55,.75); box-shadow: 0 0 1.1rem -.35rem rgba(252,99,55,.55); }
  .fld .fval { flex: 1; min-width: 0; display: flex; align-items: center; gap: .95rem; padding: 0 1rem 0 1.25rem; font-size: 1.9rem; font-weight: 800; }
  .fld .fval small { font-size: max(11px, .95rem); font-weight: 700; letter-spacing: .03em; color: #D5DAE0; text-transform: uppercase;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fld .chev { margin-left: auto; flex: none; color: var(--muted); }
  .fld .chev svg { width: 1.2rem; height: 1.2rem; }
  /* divisor antes do '>' só no PC (na referência o CANAL não tem) */
  .fld.pc .chev { padding-left: .9rem; border-left: 1px solid rgba(255,255,255,.016); align-self: stretch; display: flex; align-items: center; }
  .fld.ch .fval { color: #FF7C47; font-size: 2rem; font-weight: 600; }
  .fld.off .fval { color: var(--muted); }
  .chrow { display: flex; gap: .8rem; min-width: 0; }
  .chrow .fld { flex: 1; }
  .xbtn { position: relative; flex: none; width: 7.3rem; height: 3.6rem; border-radius: .8rem; cursor: pointer; border: 1px solid rgba(255,255,255,.1);
    background: linear-gradient(180deg, #1E2835, #161E29); color: #E6EAEE; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: .25rem; font-size: max(11px, .82rem); font-weight: 900; letter-spacing: .08em; box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
  .xbtn svg { width: 1.35rem; height: 1.35rem; }
  .xbtn:hover:not(:disabled) { border-color: rgba(252,99,55,.6); }
  .xbtn:active:not(:disabled) { transform: translateY(1px) scale(.97); }
  /* sem envios extras (o caso mais comum): o repouso da referência, claro, só sem contador e sem
     reação a hover/toque; o inativo se distingue de leve pelo ícone e rótulo em --soft */
  .xbtn:disabled { cursor: default; color: var(--soft); }
  .xbtn.on { color: var(--accent2); border-color: rgba(252,99,55,.7); }
  .xbtn .cnt { position: absolute; top: -.45rem; right: -.45rem; min-width: max(18px, 1.4rem); height: max(18px, 1.4rem); padding: 0 .35rem; border-radius: .7rem; background: var(--accent);
    color: #1b0c05; font-size: max(11px, .8rem); font-weight: 900; display: flex; align-items: center; justify-content: center; letter-spacing: 0; }
  .xlist { margin-top: .8rem; display: grid; gap: .45rem; }
  .xlist[hidden] { display: none; }
  .xlist .xi { display: flex; align-items: center; gap: .6rem; padding: .55rem .8rem; border-radius: .7rem; background: #0F151E; border: 1px solid var(--line);
    font-weight: 800; font-size: 1rem; text-transform: uppercase; min-width: 0; }
  .xlist .xi .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .xlist .xi .v { flex: none; white-space: nowrap; }
  .xlist .xi .k { flex: none; font-size: max(11px, .75rem); padding: .15rem .45rem; border-radius: .35rem; color: #fff; }
  .xlist .xi .k.pc { background: #1B5CE3; } .xlist .xi .k.cc { background: #3a3f46; }
  .xlist .xi .c { margin-left: auto; flex: none; color: var(--muted); font-size: max(11px, .85rem); }
  /* Largo (card ocupando a linha toda): PC e CANAL lado a lado. */
  @container (min-width: 44rem) { .pfields { grid-template-columns: 1fr 1.3fr; } }
  /* CANAL + aparelho do modo amigável. No card estreito (3ª coluna, celular) o aparelho fica
     embaixo do número, com a largura toda do campo; no card largo, ao lado. Nome que não
     cabe corta com reticência (o nome inteiro está no title do campo e na faixa MODO AMIGÁVEL). */
  .fld.ch .fval .chv { flex: 0 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; line-height: 1.05; }
  .fld.ch .fval .chv .chn { white-space: nowrap; }
  .fld.ch .fval .chv small { margin-top: .2rem; line-height: 1.1; }
  .fld.ch .fval small.nodev { color: var(--muted); }
  @container (min-width: 44rem) {
    .fld.ch .fval .chv { flex-direction: row; align-items: center; gap: .95rem; }
    .fld.ch .fval .chv .chn { flex: none; }
    .fld.ch .fval .chv small { margin-top: 0; }
  }

  /* ── faixa MODO AMIGÁVEL (aparelho de cada canal; config global do backup) ── */
  /* bloco próprio (não fica na linha do cabeçalho do preset), da largura do conteúdo */
  .mmap { display: flex; align-items: center; gap: .8rem 1.3rem; flex-wrap: wrap; width: fit-content; max-width: 100%;
    padding: .6rem 1.1rem .6rem 1.3rem; margin-bottom: 1.1rem; background: linear-gradient(180deg, #152029, #0F161E); }
  .mmap .lbl { font-size: max(11px, 1rem); font-weight: 900; letter-spacing: .3em; color: var(--accent); white-space: nowrap; }
  .mmap .chips { display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; min-width: 0; }
  .mmap .chip { max-width: 100%; height: 2.5rem; padding: 0 1.15rem; }
  .mmap .chip b { flex: none; color: var(--muted); font-weight: 900; }
  .mmap .chip.acc b { color: inherit; opacity: .8; }
  .mmap .chip .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

  /* ── cabeçalho do preset ── */
  .phead { display: inline-flex; align-items: center; gap: 1.6rem; flex-wrap: wrap; padding: .6rem 1.1rem .6rem 1.3rem; margin-bottom: .9rem;
    background: linear-gradient(180deg, #152029, #0F161E); }
  .phead .tag { display: flex; align-items: center; justify-content: center; height: 3.25rem; min-width: 5.05rem; padding: 0 .9rem; border-radius: .8rem;
    font-size: 2rem; font-weight: 900; color: var(--accent2);
    background: linear-gradient(180deg, rgba(252,99,55,.30), rgba(252,99,55,.14)); border: 1px solid rgba(252,99,55,.65); box-shadow: 0 0 1.1rem -.35rem rgba(252,99,55,.6); }
  .phead .big { font-size: 2.45rem; font-weight: 900; line-height: 1; letter-spacing: .005em; }
  /* '(sem nome)' no tom azulado da referência; slot fora do backup, atenuado */
  .phead .big.none { color: #C9D3E6; font-weight: 800; }
  .phead .big.missing { color: var(--muted); font-size: 1.6rem; font-weight: 700; }
  /* chips e seletor de layer quebram juntos */
  .phead .pmeta { display: flex; align-items: center; gap: 1.6rem; flex-wrap: wrap; }
  .phead .chip { height: 2.75rem; padding: 0 1.35rem; font-size: 1rem; }
  /* DUAL LAYER é status (contorno + ícone), não se confunde com o botão selecionado */
  .phead .chip.acc { padding: 0 1.65rem; background: transparent; box-shadow: none; border-color: rgba(252,99,55,.5); }
  .phead .chip.acc svg { width: 1.2rem; height: 1.2rem; }
  .nopreset { padding: 2rem; border: 1px dashed var(--line2); border-radius: var(--r); color: var(--muted); text-align: center; }
  .layerseg { display: inline-flex; gap: .3rem; padding: .2rem; border-radius: .95rem; background: rgba(10,17,26,.8); border: 1px solid var(--line); }
  .layerseg button { height: 2.75rem; padding: 0 1.65rem; border-radius: .75rem; border: 1px solid transparent; background: transparent; cursor: pointer;
    color: #AEB5BE; font-size: 1.1rem; font-weight: 900; letter-spacing: .05em; }
  .layerseg button:not(.on):hover { color: var(--text); }
  .layerseg button:active { transform: translateY(1px) scale(.97); }
  .layerseg button.on { color: var(--accent2); border-color: rgba(252,99,55,.7); background: linear-gradient(180deg, rgba(252,99,55,.34), rgba(252,99,55,.16));
    box-shadow: 0 0 1.1rem -.35rem rgba(252,99,55,.65); }

  /* ── lista dos SWs (2 colunas: 1-2-3 | 4-5-6; 1 coluna só a partir de 1239) ── */
  /* linhas da grade com a mesma altura (a da mais alta), como na referência */
  .swlist { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(var(--rows, 3), 1fr); grid-auto-flow: column; gap: .8rem 1.7rem; }
  .row { display: grid; grid-template-columns: 2.6rem .32rem 3.75rem minmax(0, 1fr) auto; align-items: center; column-gap: 1.3rem;
    min-height: 6.95rem; padding: .85rem 1.3rem .85rem 1.45rem; }
  /* número com o topo na linha do título do modo (o transform não mexe na grade) */
  .row .n { font-size: 3.65rem; font-weight: 900; line-height: 1; text-align: center; letter-spacing: -.02em; transform: translateY(-.45rem); }
  /* barra e tile sobem junto com o número: os três ficam centrados entre si */
  .row .bar, .row > .tile { transform: translateY(-.3rem); }
  .row .bar { width: .32rem; height: 3.5rem; border-radius: .2rem; background: var(--c, #3a3e44);
    box-shadow: 0 0 .8rem var(--c, transparent), 0 0 .25rem var(--c, transparent); }
  .row .txt { min-width: 0; display: flex; flex-direction: column; gap: .75rem; }
  /* A célula do modo é container: nome longo (MOMENTARY, TAP TEMPO) encolhe até caber. */
  .row .mode { min-width: 0; container-type: inline-size; }
  .row .mode span { display: block; font-size: clamp(1.1rem, calc(100cqw / (var(--len, 6) * .8)), 2.15rem); font-weight: 900; line-height: .95;
    letter-spacing: .01em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Linha MIDI: até 2 linhas antes da reticência. O '+N' vai no fluxo do texto, colado ao fim da
     mensagem; se ela não cabe nas 2 linhas, fitMidi corta o texto e põe '…' + '+N' logo depois
     do último caractere visível (.cut), em vez de deixar o '+N' na borda da coluna. */
  .row .midi { display: flex; min-width: 0; font-size: 1.2rem; font-weight: 700; letter-spacing: .01em; line-height: 1.15;
    text-transform: uppercase; color: #E9EDF2; }
  .row .midi .mt { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  .row .midi .more { margin-left: .35rem; font-size: max(11px, .85rem); color: var(--accent2); letter-spacing: .04em; cursor: help; white-space: nowrap; }
  .row .midi .ch { color: var(--muted); }
  .row .midi.none { color: var(--muted); font-size: 1rem; letter-spacing: .08em; }
  /* raio do trilho concêntrico ao dos tiles (.7rem + .5rem de padding) */
  .opts { display: flex; gap: .6rem; padding: .5rem; border-radius: 1.2rem; background: linear-gradient(180deg, #10171F, #0B1119);
    border: 1px solid rgba(255,255,255,.05); box-shadow: inset 0 .2rem .6rem rgba(0,0,0,.7); }
  /* tiles de largura igual, com piso para o rótulo de 11px caber (DISPARA) */
  .opt { position: relative; width: max(4.15rem, 61px); height: 3.9rem; padding: 0 2px; border-radius: .7rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .38rem;
    background: linear-gradient(180deg, #18212D, #121924); border: 1px solid rgba(255,255,255,.07); color: #E9EDF2; box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
  /* visible: o brilho do anel do LED se desfaz redondo, sem caixa quadrada */
  .opt svg { width: 1.6rem; height: 1.6rem; overflow: visible; }
  .opt i { font-style: normal; font-size: max(11px, .68rem); font-weight: 800; letter-spacing: .04em; line-height: 1; color: var(--soft); text-transform: uppercase;
    white-space: nowrap; text-align: center; }
  .opt.on { color: var(--accent2); border-color: rgba(252,99,55,.8); background: linear-gradient(180deg, rgba(252,99,55,.26), rgba(252,99,55,.12));
    box-shadow: 0 0 1.1rem -.3rem rgba(252,99,55,.6), inset 0 1px 0 rgba(255,200,170,.15); }
  .opt.on i { color: var(--accent2); }
  /* abaixo de ~1680px o tile fica com 61–64px: o rótulo aperta o espaçamento para não encostar na borda
     (a 1728, a largura da referência, o tile tem 66px e o espaçamento continua .04em) */
  @media (max-width: 1679px) { .opt i { letter-spacing: 0; } }
  /* só para leitor de tela (estado da opção e cor do LED) */
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* tile do SW (porte simplificado do icon_tile_render) */
  .tile { position: relative; border-radius: 18%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; gap: 4%; width: var(--s, 3.75rem); height: var(--s, 3.75rem); flex: none; border: .16rem solid transparent; }
  .tile.circle { border-radius: 50%; }
  .tile.octagon { clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }
  .tile .ico { width: 62%; height: 62%; -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
  .tile img.ico { -webkit-mask: none; mask: none; object-fit: contain; }
  .tile .sg { font-size: calc(var(--s, 3.75rem) * .15 * var(--k, 1)); font-weight: 800; letter-spacing: .03em; line-height: 1; max-width: 92%; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  /* modo TEXTO: a sigla encolhe (--kb) até caber no tile */
  .tile .sg.big { font-size: calc(var(--s, 3.75rem) * .26 * var(--kb, 1)); text-overflow: clip; }
  .tile .miss { font-size: 1.2rem; color: #777; }
  .tile.bare { border-color: #8C939C; background: #0F1318 !important; }

  /* ── log de boot (barra de largura total) ── */
  details.boot { margin-top: 1.1rem; background: radial-gradient(18rem 5rem at 0% 50%, rgba(252,99,55,.10), transparent 70%), linear-gradient(180deg, #16202B, #101820); }
  /* seta na altura da 1ª linha; rótulo e chips quebram juntos (.sb), os chips alinhados ao rótulo */
  details.boot summary { cursor: pointer; list-style: none; display: flex; align-items: flex-start; gap: 1.9rem; min-height: 4.05rem;
    padding: .7rem 2.25rem; font-size: 1rem; font-weight: 800; letter-spacing: .2em; color: #AAB2BC; text-transform: uppercase; }
  details.boot summary .sb { display: flex; align-items: center; flex-wrap: wrap; gap: .8rem 1.9rem; min-width: 0; }
  details.boot summary .lbl { display: flex; align-items: center; min-height: 2.65rem; }
  details.boot summary:hover { color: var(--text); }
  details.boot summary:focus-visible { outline-offset: -4px; border-radius: var(--r); }
  details.boot summary::-webkit-details-marker { display: none; }
  details.boot summary::before { content: ''; flex: none; width: .62rem; height: .62rem; margin: calc((2.65rem - .82rem) / 2) .1rem 0 0; border-top: .2rem solid var(--accent);
    border-right: .2rem solid var(--accent); transform: rotate(45deg); transition: transform .15s; filter: drop-shadow(0 0 .3rem rgba(252,99,55,.7)); }
  details.boot[open] summary::before { transform: rotate(135deg); }
  details.boot summary .chips { display: flex; gap: .8rem 1.2rem; flex-wrap: wrap; }
  details.boot pre { margin: 0 1.2rem 1.2rem; background: #0A0F16; border: 1px solid var(--line2); border-radius: .8rem; padding: 1rem; font-size: max(11px, .85rem);
    overflow: auto; max-height: 30rem; color: #C9CED3; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; }
  details.boot pre::-webkit-scrollbar { width: 10px; height: 10px; }
  details.boot pre::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 10px; border: 3px solid #0A0F16; }
  details.boot pre::-webkit-scrollbar-track, details.boot pre::-webkit-scrollbar-corner { background: transparent; }
  /* linha do motivo do reset realçada dentro do log (vermelha se for falha) */
  mark.rs { background: rgba(43,214,91,.12); color: inherit; }
  mark.rs.bad { background: rgba(255,72,72,.2); color: #FFC2C2; }
  details.boot .note { padding: 0 2.25rem 1.2rem; color: var(--muted); font-size: max(11px, .95rem); }

  /* 1240–1299 (notebook de 1280): ainda 2 colunas. O piso de 61px das opções pesa mais quando o rem
     encolhe, então os vãos da linha e o entre colunas cedem aos poucos (contínuo, 0 em 1300) e o
     texto MIDI fica com pelo menos a largura que tem em 1300. */
  @media (min-width: 1240px) and (max-width: 1299px) {
    .swlist { column-gap: clamp(1.2rem, calc(1.7rem - (1300px - 100vw) * .08), 1.7rem); }
    .row { column-gap: clamp(1rem, calc(1.3rem - (1300px - 100vw) * .05), 1.3rem); }
  }
  /* ≤1239 (onde o hero também passa para 2 linhas): lista em 1 coluna, linhas na altura natural (sem igualar) */
  @media (max-width: 1239px) {
    .swlist { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-flow: row; }
    .hero { grid-template-columns: auto minmax(0, 1fr); }
    .hero > .principal { grid-column: 1 / -1; min-height: 0; }
    .hero > .console, .hero > .model { align-self: stretch; min-height: 0; }
  }
  @media (max-width: 720px) {
    html { font-size: 11px; }
    .top { padding: .8rem 1.1rem; gap: .8rem; }
    .filebtn { margin-left: 0; }
    .fileinfo { margin-left: 0; width: 100%; }
    .fileinfo .fname { max-width: none; flex: 1 1 auto; min-width: 0; }
    main { padding: 1.1rem 1.1rem 2rem; }
    .hero { grid-template-columns: 1fr; }
    .console { justify-self: stretch; justify-content: center; }
    .keys.k2 { margin-inline: 0; }
    .phead { display: flex; gap: 1rem; }
    /* O nome não estica (os chips vêm logo depois dele, como acima de 720) e nunca passa da linha
       da tag: nome longo quebra ao lado dela. Os chips só descem quando não cabem ao lado. */
    .phead .big { font-size: 2rem; flex: 0 1 auto; min-width: 0; max-width: calc(100% - 6.05rem); }
    .phead .pmeta { gap: .8rem; }
    .row { grid-template-columns: 2.4rem .32rem 3.75rem minmax(0, 1fr) auto; padding: 1rem 1.1rem 1.1rem; }
    .row .n { font-size: 3.4rem; }
    .row .midi { font-size: 1.3rem; }
    /* resumo do log mais justo: RESET + N LINHAS cabem juntos numa linha a 360; o que desce
       continua alinhado ao rótulo (a seta fica fora de .sb) */
    details.boot summary { padding: .7rem 1.2rem; gap: 1.1rem; }
    details.boot summary .sb { gap: .7rem 1rem; }
    details.boot summary .chips { gap: .7rem .8rem; }
    details.boot .note { padding: 0 1.2rem 1.2rem; }
    details.boot pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 .6rem .8rem; }
  }
  /* celular estreito (360): marca e ABRIR BACKUP numa linha só */
  @media (max-width: 380px) {
    .top { gap: .6rem; }
    .brand .name { font-size: 1.4rem; }
    .filebtn { padding: 0 1rem; gap: .5rem; letter-spacing: .03em; }
    /* os três chips do arquivo (V3 · PRESETS · TRUNCADO) cabem numa linha até 320 */
    .fileinfo { gap: .8rem; }
  }
  /* abaixo de 360 (320–359): console mais justo, teclas de 44px, sem rolagem lateral */
  @media (max-width: 359px) {
    .console { gap: .6rem; padding: .8rem; }
    .keys { grid-template-columns: repeat(3, 4rem); grid-auto-rows: 4rem; gap: .6rem; }
    .keys.k2 { grid-template-columns: repeat(2, 4rem); }
    .model { padding-inline: 1.6rem; }
    .model .name { font-size: clamp(1.4rem, min(9.6cqw, calc(100cqw / (var(--len, 14) * .66))), 3.9rem); }
  }
  /* só abaixo de 600px as opções descem para baixo do texto */
  @media (max-width: 600px) {
    .row { grid-template-columns: 2.4rem .32rem 3.75rem minmax(0, 1fr); grid-template-areas: "n b t x" "o o o o"; row-gap: .9rem; }
    .row .n { grid-area: n; } .row .bar { grid-area: b; } .row .tile { grid-area: t; } .row .txt { grid-area: x; }
    .row .opts { grid-area: o; justify-self: start; }
    .row.noopts { grid-template-areas: "n b t x"; row-gap: 0; }
  }
  /* ponteiro grosso (toque): alvos de 44px */
  @media (pointer: coarse) {
    .filebtn, .layerseg button { min-height: 44px; }
    .layerseg button { padding: 0 1.4rem; }
  }
  /* alto contraste (forced-colors): os estados deixam de depender só da cor */
  @media (forced-colors: active) {
    .key.on, .layerseg button.on, .opt.on, .xbtn.on, .mmap .chip.acc { outline: 2px solid Highlight; outline-offset: -3px; }
    .key.off:not(.on) { color: GrayText; }
    .model { border-color: CanvasText; }
    mark.rs, mark.rs.bad { background: Mark; color: MarkText; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
  /* ── LOG VIEW (telemetria da blackbox) ── */
  .lvbtn { display: inline-flex; align-items: center; gap: .65rem; height: 2.65rem; padding: 0 1.25rem; border-radius: .7rem; cursor: pointer; flex: none;
    background: linear-gradient(180deg, #18212C, #111820); border: 1px solid rgba(252,99,55,.55); color: var(--accent2);
    font-size: max(11px, .95rem); font-weight: 900; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .lvbtn svg { width: 1.25rem; height: 1.25rem; }
  .lvbtn:hover { background: rgba(252,99,55,.12); }
  .lvbtn[aria-pressed="true"] { background: linear-gradient(180deg, #FF8B50, #F1602A); color: #1A0B04; border-color: transparent;
    box-shadow: 0 0 1.6rem -.2rem rgba(252,99,55,.6), inset 0 1px 0 rgba(255,255,255,.35); }
  .lv { display: grid; gap: 1.2rem; }
  .lv h2 { margin: 0; font-size: max(13px, 1.15rem); font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
  .lv-card { background: linear-gradient(180deg, var(--card-a), var(--card-b)); border-radius: var(--r); padding: 1.3rem 1.5rem; min-width: 0;
    border: 1px solid rgba(255,255,255,.07); border-top-color: rgba(255,255,255,.2); border-left-color: rgba(255,255,255,.12); border-bottom-color: rgba(0,0,0,.45);
    box-shadow: 0 1.4rem 2.6rem -1.6rem rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.08); }
  .lv-card > h2 + * { margin-top: .5rem; }
  .lv-note { margin: .35rem 0 .7rem; color: var(--muted); font-size: max(11px, .92rem); }
  .lv-head { display: flex; align-items: center; gap: .8rem 1.4rem; flex-wrap: wrap; }
  .lv-back { justify-self: start; background: none; border: 0; color: var(--accent2); font-weight: 800; cursor: pointer; padding: .3rem 0; font-size: max(12px, .95rem); }
  .lv-back:hover { text-decoration: underline; }
  .lv-none p { color: var(--soft); max-width: 60rem; }
  .lv-diag { border-left: .35rem solid var(--sev); }
  .lv-diag ul { list-style: none; margin: .8rem 0 0; padding: 0; display: grid; gap: .9rem; }
  .lv-diag li { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: .4rem 1.1rem; align-items: start; padding-top: .9rem; border-top: 1px solid var(--line); }
  .lv-diag li:first-child { border-top: 0; padding-top: 0; }
  .lv-diag b { font-size: max(13px, 1.05rem); }
  .lv-diag p { margin: .3rem 0 0; color: var(--soft); }
  .lv-diag .fix { color: var(--text); }
  .lv-diag .fix span { color: var(--accent2); font-weight: 800; }
  .lv-sev { display: inline-flex; align-items: center; gap: .45rem; height: 2rem; padding: 0 .8rem; border-radius: 999px; white-space: nowrap; justify-self: start;
    font-size: max(11px, .82rem); font-weight: 900; letter-spacing: .07em; color: var(--sev); border: 1px solid var(--sev); background: color-mix(in srgb, var(--sev) 12%, transparent); }
  .lv-sev svg { width: 1.05rem; height: 1.05rem; }
  .lv-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; }
  .lv-kpi { --sev: transparent; position: relative; display: grid; gap: .25rem; padding: 1rem 1.2rem; border-radius: var(--r); background: linear-gradient(180deg, #172130, #111922);
    border: 1px solid rgba(255,255,255,.08); box-shadow: inset .3rem 0 0 var(--sev); min-width: 0; }
  .lv-kpi .k { font-size: max(11px, .78rem); font-weight: 900; letter-spacing: .14em; color: var(--muted); }
  .lv-kpi b { font-size: max(18px, 1.7rem); font-weight: 800; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lv-kpi .s { color: var(--muted); font-size: max(11px, .86rem); overflow-wrap: anywhere; }
  .lv-boots { display: flex; gap: .5rem; flex-wrap: wrap; }
  .lv-boots .chip { height: 2.2rem; cursor: pointer; }
  .lv-chart { width: 100%; min-height: 2rem; overflow: hidden; }
  .lv-chart svg { display: block; font-family: inherit; }
  .lv-empty { margin: 1rem 0; color: var(--faint); font-size: max(11px, .92rem); }
  .lv-legend { display: flex; flex-wrap: wrap; gap: .5rem 1.3rem; margin-top: .6rem; color: var(--soft); font-size: max(11px, .88rem); }
  .lv-legend span { display: inline-flex; align-items: center; gap: .45rem; }
  .lv-legend i { width: .8rem; height: .8rem; border-radius: 50%; background: var(--c); flex: none; }
  .lv-legend i.bar { width: 1.4rem; height: .7rem; border-radius: 3px; background: linear-gradient(90deg, #ec835a, #d03b3b); }
  .lv-legend.sm { margin-top: .3rem; font-size: max(11px, .8rem); }
  .lv-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.2rem 1.6rem; margin-top: .6rem; }
  .lv-grid figure { margin: 0; min-width: 0; }
  .lv-grid figcaption { color: var(--soft); font-weight: 700; font-size: max(11px, .88rem); margin-bottom: .4rem; }

// PRESET
// ─────────────────────────────────────────────────────────────────────────────
function presetOf(tag) {

  } else if (raw && typeof raw === 'object') Object.assign(lines, raw);

    }
    case 'steps': cc(P(p, 'ch'), P(p, 'num', 21)); cc(P(p, 'eff_ch'), P(p, 'eff_num', 20)); break;
    case 'control': cc(P(p, 'ch'), P(p, 'num')); cc(P(p, 'ch2'), P(p, 'num2')); break;

    case 1: {
      const bad = LV_RESET_BAD.has(e.a) || e.b === 1;
      let t = e.a === 1 ? 'Controladora LIGADA' : `Reiniciou: ${LV_RESET[e.a] || e.a}`;
      if (e.b === 1) t = `REINICIADA PELO VIGIA: loop parado ${lvMs(e.c)}`;
      if (e.tag) t += ` — caiu em ${e.tag}`;
      return { lane: 'sys', sev: e.a === 9 ? 'crit' : bad ? 'crit' : 'info', label: 'BOOT', text: t };
    }
    case 2: return { lane: 'wifi', sev: 'info', label: 'WI-FI', text: `Wi-Fi ligou (${LV_WHY[e.a] || e.a})` };
    case 3: return { lane: 'wifi', sev: e.a === 2 || e.a === 3 ? 'warn' : 'info', label: 'WI-FI', text: `Wi-Fi DESLIGOU (${LV_WHY[e.a] || e.a})` };
    case 4: return { lane: 'wifi', sev: 'info', label: 'WI-FI', text: `Aparelho entrou no Wi-Fi da controladora (…${e.tag}) — ${e.b} conectado(s)` };
    case 5: return { lane: 'wifi', sev: 'warn', label: 'WI-FI', text: `Aparelho SAIU do Wi-Fi (…${e.tag}): ${lvReason(e.b2)} — ${e.b} conectado(s)` };
    case 6: return { lane: 'wifi', sev: 'info', label: 'WI-FI', text: `Rede de casa conectou (${lvI16(e.b)} dBm)` };
    case 7: return { lane: 'wifi', sev: 'warn', label: 'WI-FI', text: `Rede de casa CAIU: ${lvReason(e.b2)}${lvI16(e.b) ? ` (${lvI16(e.b)} dBm)` : ''}${e.a > 1 ? ` — ${e.a} vezes seguidas` : ''}` };
    case 8: return { lane: 'http', sev: e.b >= 1000 ? 'serious' : 'warn', label: 'HTTP', text: `Pedido lento: ${LV_METHOD[e.a] || ''} ${e.tag || '?'} levou ${lvMs(e.b)}`, ms: e.b };
    case 9: return { lane: 'sys', sev: 'serious', label: 'MEMÓRIA', text: `Memória interna baixa: ${lvKB(e.c)} livres (maior bloco ${e.b} KB)` };
    case 10: return { lane: 'press', sev: e.b >= 300 ? 'serious' : 'warn', label: 'PISADA',
      text: `Pisada lenta (pino ${e.a}): ${lvMs(e.b)}${e.tag ? ` — controladora presa em ${e.tag}` : ' — sem loop lento no meio: contato do footswitch repicando'}`, ms: e.b };
    case 11: return { lane: 'press', sev: 'warn', label: 'PISADA', text: `Pisada recuperada (pino ${e.a}): o loop ficou parado ${lvMs(e.b)} e o toque só foi visto depois` };
    case 12: return { lane: 'slow', sev: 'crit', label: 'TRAVOU',
      text: `Controladora PARADA ${lvMs(e.c)} na fase ${j.phName(e.a)}${e.tag ? ` (pedido ${e.tag})` : ''}${e.b ? ' — o vigia reiniciou' : ''}`, ms: e.c };
    case 13: return { lane: 'http', sev: 'warn', label: 'HTTP',
      text: `Pedido incompleto DESCARTADO: ${LV_METHOD[e.a] || ''} ${e.tag || '?'} — o aparelho mandou ${e.b2} bytes em ${lvMs(e.b)} e não terminou (a controladora seguiu normal)` };
    case 14: return e.a === 0 ? { lane: 'mem', sev: 'info', label: 'MEMÓRIA', text: `Memória de presets montou: ${e.b} KB usados de ${Math.round(e.c / 1048576)} MB` }
      : { lane: 'mem', sev: 'crit', label: 'MEMÓRIA', text: e.a === 1 ? 'A memória de presets foi FORMATADA neste boot: presets, imagens, ícones e o editor foram perdidos'
        : e.a === 2 ? 'A memória de presets NÃO montou (sem sistema de arquivos)' : 'Partição de armazenamento AUSENTE' };
    case 15: return { lane: 'mem', sev: e.a === 5 ? 'warn' : 'serious', label: 'LEITURA', text: `Leitura falhou ${LV_FSR[e.a] || ''}: ${e.tag || '?'}${e.b ? ` (erro ${e.b})` : ''}` };
    case 16: return { lane: 'mem', sev: e.a === 4 || e.a === 10 ? 'serious' : e.a === 8 ? 'info' : 'serious', label: 'GRAVAÇÃO',
      text: `Gravação falhou — ${LV_FSW[e.a] || 'causa ' + e.a}: ${e.tag || '?'}${e.b ? ` (erro ${e.b})` : ''}` };
    case 17: return { lane: 'mem', sev: 'warn', label: 'MEMÓRIA', text: `Memória de presets QUASE CHEIA: ${lvKB(e.c)} livres` };
    case 18: return { lane: 'mem', sev: 'crit', label: 'NVS', text: 'A NVS (configurações) foi APAGADA pelo sistema: a controladora voltou aos padrões de fábrica' };
    case 19: return { lane: 'mem', sev: e.b === 4 ? 'info' : 'serious', label: 'NVS', text: `Configuração ${LV_NVSK[e.a] || e.a} na NVS: ${LV_NVS_STATE[e.b] || e.b}` };
    case 20: return { lane: 'mem', sev: 'serious', label: 'NVS', text: `Gravação na NVS FALHOU (${LV_NVSK[e.a] || e.tag}) — ${e.b} entradas livres de ${e.b + e.b2}` };
    case 21: return { lane: 'mem', sev: 'warn', label: 'NVS', text: `NVS quase cheia: ${e.b} entradas livres` };
    case 22: return { lane: 'mem', sev: 'serious', label: 'MEMÓRIA', text: `Alocação de memória FALHOU ${e.b}x (última: ${lvKB(e.c)} na ${e.a === 2 ? 'PSRAM' : 'memória interna'}, em ${e.tag || '?'})` };
    case 23: return { lane: 'mem', sev: 'warn', label: 'MEMÓRIA', text: `PSRAM no limite: ${lvKB(e.c)} livres, maior bloco ${e.b} KB (o backup pode não caber)` };
    case 24: return { lane: 'mem', sev: 'serious', label: 'MEMÓRIA', text: `Pilha quase no fim: tarefa ${e.tag || '?'} com ${e.b} B livres` };
    case 25: return { lane: 'mem', sev: 'crit', label: 'MEMÓRIA', text: `Memória ${e.a === 2 ? 'PSRAM' : 'interna'} CORROMPIDA (um bloco foi escrito além do limite)` };
    case 26: return { lane: 'mem', sev: e.a === 1 || e.a === 2 ? 'warn' : 'info', label: 'MÍDIA', text: `${LV_MEDIA[e.a] || 'mídia ' + e.a}${e.a <= 2 ? ` — slot ${e.b}` : ''}` };
    case 27: return { lane: 'sys', sev: e.a === 3 ? 'serious' : 'info', label: 'ATUALIZAÇÃO',
      text: e.a === 1 ? 'Atualização por Wi-Fi iniciou' : e.a === 2 ? `Atualização por Wi-Fi terminou OK (${lvKB(e.c)})` : `Atualização por Wi-Fi FALHOU: ${e.tag || 'erro ' + e.b}` };
    case 28: return { lane: 'sys', sev: 'info', label: 'LOG', text: `O log de boot encheu aos ${lvT(e.c)} — as linhas depois disso se perderam (o relatório diz quantas)` };
    case 29: return { lane: 'sys', sev: 'info', label: 'REINÍCIO', text: `Reinício pedido: ${LV_RST[e.a] || e.a}` };
    default: return { lane: 'sys', sev: 'info', label: 'EVENTO', text: `Evento ${e.type}` };
  }
}

// Diagnóstico automático: o que aconteceu, por que e o que fazer.
function lvDiagnose(j) {
  const out = [];
  const add = (sev, title, text, fix) => out.push({ sev, title, text, fix });
  const ev = j.ev;
  const count = (f) => ev.filter(f).length;
  const vigia = count((e) => e.type === 1 && e.b === 1) + j.stalls.filter((s) => s.rebooted).length;
  if (vigia) add('crit', 'A controladora travou de vez e o vigia a reiniciou',
    `${vigia} vez(es) o loop ficou parado 60 s ou mais.`, 'Mande este backup ao suporte. A fase em que travou está na linha do tempo.');
  const stalls = j.stalls.length ? j.stalls.map((s) => ({ ph: s.phase, dur: s.dur, route: s.route }))
    : ev.filter((e) => e.type === 12).map((e) => ({ ph: e.a, dur: e.c, route: e.tag }));
  if (stalls.length) {
    const web = stalls.filter((s) => j.phName(s.ph) === 'WEB');
    const worst = stalls.reduce((a, s) => (s.dur > a.dur ? s : a), stalls[0]);
    if (web.length) add('crit', `Um aparelho no Wi-Fi congelou a controladora (${web.length}x, pior ${lvMs(Math.max(...web.map((s) => s.dur)))})`,
      `Nesse tempo os footswitches não respondem. O servidor web atende um pedido por vez e espera o aparelho terminar de mandar o pedido${worst.route ? ` (ex.: ${worst.route})` : ''}. Celular com sinal fraco, que dormiu ou saiu da rede no meio de um pedido, segura a controladora.`,
      'Deixe o celular/tablet perto da controladora, feche o editor nos aparelhos que não estão sendo usados e evite usar o editor durante o show. Correção definitiva: atualização de firmware.');
    const other = stalls.filter((s) => j.phName(s.ph) !== 'WEB');
    if (other.length) add('crit', `A controladora ficou parada ${other.length}x fora do Wi-Fi (pior ${lvMs(Math.max(...other.map((s) => s.dur)))})`,
      `Fases: ${[...new Set(other.map((s) => j.phName(s.ph)))].join(', ')}.`, 'Mande este backup ao suporte.');
  }
  const crash = count((e) => e.type === 1 && LV_RESET_BAD.has(e.a) && e.a !== 9);
  if (crash) add('crit', `Reinícios por falha: ${crash}`, 'Pânico ou watchdog: o firmware caiu e reiniciou sozinho. O log de boot traz o endereço da falha.',
    'Mande este backup ao suporte (o log de boot vai junto).');
  const brown = count((e) => e.type === 1 && e.a === 9);
  if (brown) add('crit', `Queda de tensão: ${brown} reinício(s)`, 'A alimentação não aguentou o pico de corrente (o Wi-Fi puxa picos ao transmitir).',
    'Use a fonte de 9 V indicada. Alimentar só pela USB, ou com cabo/fonte fraca, causa isso.');
  const autoOff = count((e) => e.type === 3 && e.a === 2);
  if (autoOff) add('info', `O Wi-Fi desligou sozinho ${autoOff}x porque ninguém conectou em 90 s`,
    'É o comportamento normal da controladora: sem nenhum aparelho no Wi-Fi em 90 s, o rádio desliga para não atrapalhar no palco.',
    'Conecte o celular logo depois de ligar, ou religue o Wi-Fi pelo combo do pé.');
  const combo = count((e) => e.type === 3 && e.a === 3);
  if (combo) add('warn', `O Wi-Fi foi DESLIGADO pelo pé ${combo}x (combo de dois footswitches)`,
    'Pisar os dois footswitches do combo do Wi-Fi juntos desliga o rádio — pode ter sido sem querer.',
    'Se não for intencional, troque a ação desse combo em CONFIGURAÇÕES › BANCOS › COMBOS.');
  const leaves = ev.filter((e) => e.type === 5);
  if (leaves.length) {
    const by = {};
    leaves.forEach((e) => { const k = [4].includes(e.b2) ? 'sleep' : [34, 200].includes(e.b2) ? 'signal' : [3, 8].includes(e.b2) ? 'left' : 'other'; by[k] = (by[k] || 0) + 1; });
    if (by.sleep) add('warn', `Aparelho caiu do Wi-Fi por inatividade (${by.sleep}x)`, 'O celular parou de responder à controladora — normalmente a tela apagou ou a economia de bateria desligou o Wi-Fi.',
      'Mantenha a tela do celular acesa durante o uso, ou desligue a economia de bateria para o app.');
    if (by.signal) add('warn', `Aparelho caiu do Wi-Fi por sinal fraco (${by.signal}x)`, 'O sinal entre o celular e a controladora ficou fraco demais.', 'Aproxime o aparelho; evite obstáculos e o case metálico na frente.');
    if (by.left) add('warn', `O próprio aparelho saiu do Wi-Fi da controladora (${by.left}x)`,
      'O celular desconectou por conta própria — é comum ele trocar para o 4G ou para a rede de casa porque a rede da controladora não tem internet.',
      'No celular, ao entrar na rede BFMIDI_WIFI, confirme "manter conectado" / "usar sem internet". Desligue a troca automática de rede.');
    if (by.other) add('info', `Aparelho saiu do Wi-Fi por outros motivos (${by.other}x)`, 'Veja os motivos na lista de eventos.', '');
  }
  const sta = ev.filter((e) => e.type === 7);
  if (sta.length) {
    const n = sta.reduce((a, e) => a + Math.max(1, e.a), 0);
    add('warn', `A conexão com a rede de casa caiu ${n}x`, `Motivos: ${[...new Set(sta.map((e) => lvReason(e.b2)))].join('; ')}.`,
      'Confira o sinal do roteador onde a controladora fica e a senha salva.');
  }
  if (j.ep.length) {
    const tot = new Array(8).fill(0);
    j.ep.forEach((e) => e.phaseMs.forEach((v, i) => { tot[i] += v; }));
    const w = tot.reduce((a, v, i) => (v > tot[a] ? i : a), 0), name = j.phName(w);
    const pct = Math.round((tot[w] * 100) / Math.max(1, tot.reduce((a, v) => a + v, 0)));
    const worstEp = j.ep.reduce((a, e) => (e.max > a.max ? e : a), j.ep[0]);
    const why = name === 'WEB' ? 'pedidos do app/editor pelo Wi-Fi' : name === 'WIFI' ? 'tentativas de conectar na rede de casa'
      : name === 'MIDI' ? 'tráfego MIDI / USB host' : (name === 'SWITCHES' || name === 'COMANDOS' || name === 'TELA') ? 'desenho da tela e troca de preset (imagens grandes pesam)' : LV_PH_DESC[name] || name;
    add(name === 'WEB' || name === 'WIFI' ? 'serious' : 'warn', `${j.ep.length} período(s) de lentidão — ${pct}% do tempo em ${name}`,
      `Causa provável: ${why}. Pior volta: ${lvMs(worstEp.max)}${worstEp.route ? ` (pedido ${worstEp.route}, ${lvMs(worstEp.routeMs)})` : ''}.`,
      name === 'WEB' ? 'Use o editor só para configurar, não durante o show; feche-o nos aparelhos parados.'
        : name === 'WIFI' ? 'Se não usa a rede de casa no palco, esqueça a rede salva (SYSTEM › WI-FI).'
          : 'Se for no palco, prefira fundos de preset em cor sólida em vez de imagem.');
    // Só é "CPU tomada" com pouca CPU ociosa: num travamento esperando o celular o loop
    // também some da CPU, mas sobra CPU livre (é espera, não falta de processador).
    const cpu = j.ep.filter((e) => e.loopMin < 60 && e.top && e.topPct >= 20 && e.idleMin < 15);
    if (cpu.length) add('warn', 'Outra tarefa tomou a CPU da controladora', `Durante a lentidão o loop chegou a ${Math.min(...cpu.map((e) => e.loopMin))}% de um núcleo; a tarefa mais ocupada foi ${cpu[0].top} (${cpu[0].topPct}%).`,
      /wifi|tiT|lwip/i.test(cpu[0].top) ? 'Tráfego de Wi-Fi intenso: menos aparelhos conectados ajuda.' : 'Mande este backup ao suporte.');
  }
  const presses = ev.filter((e) => e.type === 10);
  const bounce = presses.filter((e) => !e.tag);
  if (bounce.length) {
    const pins = [...new Set(bounce.map((e) => e.a))];
    add('warn', `Footswitch com contato repicando (pino ${pins.join(', ')})`, `${bounce.length} pisada(s) demoraram sem a controladora estar ocupada: o contato fica abrindo e fechando antes de firmar.`,
      'Teste o footswitch em SYSTEM › TESTES › BOTÕES; se repetir, troque a chave.');
  }
  const held = presses.filter((e) => e.tag);
  if (held.length) add('serious', `${held.length} pisada(s) atrasada(s) porque a controladora estava ocupada`,
    `Pior atraso ${lvMs(Math.max(...held.map((e) => e.b)))}; ocupada em: ${[...new Set(held.map((e) => e.tag.split(' ')[0]))].join(', ')}.`, 'Veja o período de lentidão correspondente na linha do tempo.');
  if (j.press.recov) add('warn', `${j.press.recov} toque(s) só foram percebidos depois de um travamento`, 'O pé tocou e soltou enquanto a controladora estava parada; o toque foi recuperado depois.', '');
  const drops = count((e) => e.type === 13);
  if (drops) add('info', `${drops} pedido(s) incompleto(s) descartado(s) — a controladora não parou`,
    'Um aparelho começou a mandar um pedido pelo Wi-Fi e não terminou (sinal fraco, celular dormiu ou saiu da rede). Desde o firmware de 06/nov/2026 a controladora descarta esse pedido depois de 1–3 s em vez de ficar esperando, e os footswitches seguem respondendo.',
    'Se acontecer muito, aproxime o aparelho da controladora.');
  const heap = count((e) => e.type === 9);
  if (heap) add('serious', 'Memória interna baixa', `${heap} aviso(s) de memória abaixo de 16 KB.`, 'Mande este backup ao suporte.');
  // F1: memória e armazenamento
  if (count((e) => e.type === 14 && e.a === 1) || (j.fs && j.fs.formatted)) add('crit', 'A memória de presets foi FORMATADA neste boot',
    'A controladora não conseguiu montar o sistema de arquivos e o refez do zero: presets, imagens, ícones e o próprio editor foram perdidos.',
    'Grave de novo pelo atualizador online (ele regrava o editor) e restaure o último backup. Se repetir, a flash pode estar com defeito: mande ao suporte.');
  if (count((e) => e.type === 14 && e.a >= 2)) add('crit', 'A memória de presets não montou', 'Sem sistema de arquivos a controladora toca sem presets e sem editor.', 'Grave pelo atualizador online; se repetir, mande ao suporte.');
  if (count((e) => e.type === 18)) add('crit', 'As configurações (NVS) foram apagadas pelo sistema',
    'A área de configuração corrompeu e o sistema a apagou inteira: placa, Wi-Fi salvo, FS GLOBAL e config global voltaram ao padrão.',
    'Confira o MODELO em CONFIGURAÇÕES › HARDWARE (uma placa errada deixa a tela morta) e refaça as configurações globais. Mande este backup ao suporte.');
  const nvsW = count((e) => e.type === 20), nvsF = count((e) => e.type === 21);
  if (nvsW || nvsF || (j.nvs && j.nvs.free >= 0 && j.nvs.free < 40)) add('serious', nvsW ? `${nvsW} gravação(ões) de configuração falharam na NVS` : 'A NVS está quase cheia',
    `${j.nvs ? `${j.nvs.used} de ${j.nvs.total} entradas usadas.` : ''} Quando a NVS enche, salvar a config global, o Wi-Fi ou o FS GLOBAL falha em silêncio.`,
    'Mande este backup ao suporte (a solução é do firmware).');
  const blobBad = ev.filter((e) => e.type === 19 && e.b !== 4);
  if (blobBad.length) add('serious', 'Configuração ilegível na NVS', `${blobBad.map((e) => `${LV_NVSK[e.a] || e.a}: ${LV_NVS_STATE[e.b] || e.b}`).join('; ')}. A controladora usou o padrão no lugar.`, 'Refaça essa configuração no editor e salve; se repetir, mande ao suporte.');
  const nospace = count((e) => e.type === 16 && (e.a === 4 || e.a === 2 || e.a === 10)) + count((e) => e.type === 17);
  if (nospace || (j.fs && j.fs.freeKB >= 0 && j.fs.freeKB < 64)) add('serious', 'Memória de presets cheia ou quase',
    `${j.fs ? `${j.fs.freeKB} KB livres.` : ''} ${count((e) => e.type === 16) ? `${count((e) => e.type === 16)} gravação(ões) recusada(s).` : ''} Uma edição que não grava volta ao que estava.`,
    'Apague imagens ou ícones que não usa em CONFIGURAÇÕES › IMAGENS (presets e mídia dividem a mesma memória).');
  const wother = ev.filter((e) => e.type === 16 && ![4, 2, 10, 8].includes(e.a));
  if (wother.length) add('serious', `${wother.length} gravação(ões) falharam por erro de memória`, `Causas: ${[...new Set(wother.map((e) => LV_FSW[e.a] || e.a))].join('; ')}.`, 'Se repetir sem a memória estar cheia, a flash pode estar com defeito: mande ao suporte.');
  const rerr = ev.filter((e) => e.type === 15);
  if (rerr.length || (j.fs && (j.fs.readErr || j.fs.lineDrop))) add('serious', 'Presets com leitura falhando',
    `${j.fs ? `${j.fs.readErr} leitura(s) com erro, ${j.fs.lineDrop} linha(s) descartada(s).` : ''} Um preset que não lê inteiro toca com footswitches vazios ou com a configuração antiga.`,
    'Abra o preset no editor e salve de novo (regrava o arquivo); se repetir, restaure o backup.');
  if (j.fs && j.fs.readN && j.fs.readMax >= 50) add('warn', `A troca de preset está lenta ao ler a memória (pior ${j.fs.readMax} ms)`,
    `Média ${j.fs.readAvg} ms em ${j.fs.readN} troca(s). Normal: 10–20 ms. A memória fragmentada ou quase cheia deixa a leitura lenta.`, 'Libere espaço (imagens/ícones) ou refaça um RESTAURAR do backup, que regrava tudo em sequência.');
  const media = ev.filter((e) => e.type === 26);
  if (media.some((e) => e.a === 1)) add('warn', 'Fundo de preset com imagem que não decodifica (tela preta)', `Slot(s) ${[...new Set(media.filter((e) => e.a === 1).map((e) => e.b))].join(', ')}.`,
    'Troque a imagem desse slot por um JPEG comum (baseline, sem progressivo) em CONFIGURAÇÕES › IMAGENS.');
  if (media.some((e) => e.a === 2)) add('warn', 'Ícone enviado que não decodifica (ícone sumido)', `Slot(s) ${[...new Set(media.filter((e) => e.a === 2).map((e) => e.b))].join(', ')}.`, 'Envie o ícone de novo como PNG 100×100.');
  if (media.some((e) => e.a >= 3)) add('info', 'Sem memória para o cache de imagens', 'A controladora seguiu funcionando, só mais lenta ao trocar de fundo.', '');
  if (j.media && j.media.decN && j.media.decMax >= 250) add('info', `Decodificar o fundo levou até ${j.media.decMax} ms`, `${j.media.bgMiss} falta(s) e ${j.media.bgHit} acerto(s) do cache de fundo neste boot. Cada falta é um decode de ~130 ms na troca de preset.`,
    'No palco, prefira fundos em cor sólida nos presets que troca com frequência.');
  const sMs = j.sub.ms || [], sTot = sMs.reduce((a, v) => a + v, 0);
  if (sTot && j.ep.length) { const w = sMs.reduce((a, v, i) => (v > sMs[a] ? i : a), 0);
    if (sMs[w] >= 500) add('info', `Dentro das voltas lentas, o tempo foi principalmente em "${j.subName(w)}"`, `${LV_SUB_DESC[j.subName(w)] || ''}: ${lvMs(sMs[w])} neste boot.`, ''); }
  if (count((e) => e.type === 22)) add('serious', 'A controladora ficou sem memória para alocar', 'Alguma função pediu memória e não recebeu: pode faltar cache de imagem, buffer de backup ou o próprio editor.', 'Reinicie a controladora; se repetir, mande este backup ao suporte.');
  if (count((e) => e.type === 23)) add('warn', 'PSRAM no limite', 'Com pouca PSRAM livre o backup pode não caber e as imagens deixam de ser guardadas em cache.', 'Reinicie a controladora; se repetir, mande ao suporte.');
  if (count((e) => e.type === 24)) add('serious', 'Pilha de uma tarefa quase no fim', `Tarefa(s): ${[...new Set(ev.filter((e) => e.type === 24).map((e) => e.tag))].join(', ')}. Estourar a pilha trava a controladora.`, 'Mande este backup ao suporte.');
  if (count((e) => e.type === 25)) add('crit', 'Memória corrompida detectada', 'Um bloco de memória foi escrito além do limite — é defeito de firmware e costuma terminar em travamento.', 'Mande este backup ao suporte com o que estava fazendo na hora.');
  if (count((e) => e.type === 27 && e.a === 3)) add('serious', 'Uma atualização por Wi-Fi falhou', `${ev.filter((e) => e.type === 27 && e.a === 3).map((e) => e.tag).filter(Boolean).join('; ') || 'veja o evento'}.`, 'Use o atualizador online pelo cabo.');
  if (j.bootlog && j.bootlog.fullMs) add('info', `O log de boot encheu aos ${lvT(j.bootlog.fullMs)}`, `${j.bootlog.lostLines} linha(s) (${lvKB(j.bootlog.lostBytes)}) se perderam depois disso; a blackbox continua inteira.`, '');
  if (j.http.slow >= 5 && !j.ep.length) add('info', `${j.http.slow} pedidos HTTP lentos`, `O mais lento: ${j.http.maxRoute} (${lvMs(j.http.max)}). Não chegaram a causar lentidão.`, '');
  if (!out.length) add('ok', 'Nada fora do normal registrado', 'Sem travamentos, sem períodos de lentidão e sem quedas de Wi-Fi neste registro.', '');
  const rank = { crit: 0, serious: 1, warn: 2, info: 3, ok: 4 };
  return out.sort((a, b) => rank[a.sev] - rank[b.sev]);
}

function lvSevIcon(sev) { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${LV_SEV_ICON[sev]}</svg>`; }
function lvBadge(sev) { const s = LV_SEV[sev]; return `<span class="lv-sev" style="--sev:${s.c}">${lvSevIcon(sev)}${s.l}</span>`; }

function renderLogView() {
  const b = S.backup;
  const back = b && !b.logOnly ? '<button class="lv-back" id="lvBack">‹ Voltar aos presets</button>' : '';
  if (!b) return `<div class="empty" id="drop">${FOLDER_SVG}<h2>LOG VIEW</h2><p>Abra um backup da BFMiDi (<span class="k">bfmidi-backup-*.json</span>) ou o texto do <span class="k">/log</span> / <span class="k">/diag</span> salvo da controladora (.txt).</p><p>Nada é enviado a lugar nenhum — tudo é lido no seu navegador.</p></div>`;
  const j = S.lv;
  if (!j || j.badVersion) {
    return `<div class="lv">${back}<div class="lv-card lv-none"><h2>Sem telemetria neste arquivo</h2><p>${j && j.badVersion
      ? `A blackbox deste arquivo é de uma versão mais nova do formato (v${esc(j.v)}). Abra esta página atualizada.`
      : 'O log não traz a BLACKBOX. Ela existe a partir do firmware 15.6 publicado em 06/nov/2026: atualize a controladora pelo atualizador online e faça o backup de novo depois que o problema acontecer (sem desligar a controladora).'}</p></div></div>`;
  }

  const modes = ['desligado', 'só rede de casa', 'só AP', 'AP + rede de casa'];
  const stallMax = Math.max(0, ...j.stalls.map((s) => s.dur), ...j.ev.filter((e) => e.type === 12).map((e) => e.c));
  const kpis = [
    kpi('LIGADA HÁ', lvT(j.up), `boot nº ${j.boot} desde ligar · fw ${esc(j.fw)}`),
    kpi('PIOR VOLTA DO LOOP', lvMs(j.loop.max), j.loop.max ? `fase ${esc(j.phName(j.loop.maxPh))}` : 'nenhuma lenta', j.loop.max >= 1000 ? 'crit' : j.loop.max >= 150 ? 'warn' : null),
    kpi('PISADAS', j.press.n ? `${j.press.avg} ms` : '—', j.press.n ? `média de ${j.press.n} · pior ${lvMs(j.press.max)}` : 'nenhuma neste boot', j.press.max >= 300 ? 'serious' : j.press.slow ? 'warn' : null),
    kpi('TRAVAMENTOS', stallMax ? lvMs(stallMax) : '0', stallMax ? 'pior (≥ 3 s parada)' : 'nenhum registrado', stallMax ? 'crit' : null),
    kpi('PEDIDOS HTTP', String(j.http.n), `${j.http.slow} lentos · pior ${lvMs(j.http.max)}${j.http.drops ? ` · ${j.http.drops} descartado(s)` : ''}`, j.http.max >= 1000 ? 'warn' : null),
    kpi('WI-FI AGORA', modes[n.mode] || '?', `${n.apSta} no AP${n.apRssi ? ` · ${n.apRssi} dBm` : ''}${n.staRssi ? ` · casa ${n.staRssi} dBm` : ''}`, n.apRssi && n.apRssi < -75 ? 'warn' : null),
    kpi('MEMÓRIA INTERNA', lvKB(n.heap), `mínima ${lvKB(n.heapMin)} · bloco ${lvKB(n.heapBlk)}`, n.heapMin < 16384 ? 'serious' : null),
    kpi('CPU DO LOOP', `${n.loop}%`, `de um núcleo · outra: ${esc(n.top || '—')} ${n.topPct}%`),
    ...(j.f1 ? [
      kpi('PSRAM', lvKB(n.psram), `mínima ${lvKB(n.psramMin)} · bloco ${lvKB(n.psramBlk)}`, n.psramMin < 524288 ? 'warn' : null),
      kpi('MEMÓRIA DE PRESETS', j.fs.freeKB >= 0 ? `${j.fs.freeKB} KB` : '—', `livres${j.fs.formatted ? ' · FORMATADA NESTE BOOT' : ''}`, j.fs.formatted ? 'crit' : j.fs.freeKB >= 0 && j.fs.freeKB < 64 ? 'serious' : null),
      kpi('NVS (CONFIG)', j.nvs && j.nvs.free >= 0 ? `${j.nvs.used}/${j.nvs.total}` : '—', `entradas · ${j.nvs ? j.nvs.writes : 0} gravação(ões)${j.nvs && j.nvs.fails ? ` · ${j.nvs.fails} FALHA(S)` : ''}`, j.nvs && (j.nvs.fails || j.nvs.free < 40) ? 'serious' : null),
    ] : []),
  ].join('');
  const boots = [...new Set([j.boot, ...j.ev.map((e) => e.boot), ...j.ep.map((e) => e.boot), ...j.min.map((m) => m.boot)])].sort((a, b2) => b2 - a);
  if (!boots.includes(S.lvBoot)) S.lvBoot = j.boot;
  const bootChips = boots.length > 1 ? `<div class="lv-boots" role="group" aria-label="Escolher o boot">${boots.map((bt) =>

  const evs = j.ev.slice().reverse();
  const evRows = evs.map((e) => { const x = lvEvent(e, j);
    return `<tr><td class="t">${e.boot}</td><td class="t">${lvT(e.ms)}</td><td>${lvBadge(x.sev)}</td><td><span class="lane" style="--c:${LV_LANE.find((l) => l.k === x.lane).c}">${x.label}</span></td><td class="tx">${esc(x.text)}</td></tr>`; }).join('');
  const epCards = j.ep.slice().reverse().map((e) => {
    const tot = Math.max(1, e.phaseMs.reduce((a, v) => a + v, 0));
    const seg = e.phaseMs.map((v, i) => (v ? `<i style="flex:${v};--c:${LV_PH_COL[i]}" data-tip="${esc(j.phName(i))}: ${lvMs(v)} (${Math.round((v * 100) / tot)}%)"></i>` : '')).join('');
    return `<div class="lv-ep"><div class="h"><b>Boot ${e.boot} · ${lvT(e.start)}</b><span>durou ${lvMs(e.dur)}</span><span>${e.slow} volta(s) lenta(s)</span><span>pior ${lvMs(e.max)}</span>${lvBadge(e.max >= 1000 ? 'crit' : e.max >= 300 ? 'serious' : 'warn')}</div>` +
      `<div class="lv-stack" role="img" aria-label="Tempo por fase: ${e.phaseMs.map((v, i) => (v ? `${j.phName(i)} ${v} ms` : '')).filter(Boolean).join(', ')}">${seg}</div>` +

      (e.subMs && e.subMs.some((v) => v) ? `<div class="d">Dentro das fases: ${e.subMs.map((v, i) => (v ? `<b>${esc(j.subName(i))}</b> ${lvMs(v)}` : '')).filter(Boolean).join(' · ')}` +

    const subStack = sTot ? `<div class="lv-stack" role="img" aria-label="Tempo por sub-fase">${sMs.map((v, i) => (v ? `<i style="flex:${v};--c:${LV_SUB_COL[i]}" data-tip="${esc(`${j.subName(i)}: ${lvMs(v)} — ${LV_SUB_DESC[j.subName(i)] || ''}`)}"></i>` : '')).join('')}</div>` +
      `<div class="lv-legend sm">${sMs.map((v, i) => (v ? `<span><i style="--c:${LV_SUB_COL[i]}"></i>${esc(j.subName(i))} <b>${lvMs(v)}</b></span>` : '')).join('')}</div>` : '<p class="lv-note">Nenhuma volta lenta com sub-fase marcada neste boot.</p>';
    const stacks = mm && mm.stackNames ? mm.stackNames.map((nm, i) => `<span><i style="--c:${mm.stackMin[i] >= 0 && mm.stackMin[i] < 512 ? LV_SEV.serious.c : '#199e70'}"></i>${esc(nm)} <b>${mm.stackMin[i] < 0 ? '—' : mm.stackMin[i] + ' B'}</b></span>`).join('') : '';
    return `<section class="lv-card"><h2>Memória e armazenamento</h2>

      <li><b>Memória de presets (LittleFS)</b>: ${f.freeKB >= 0 ? `${f.freeKB} KB livres` : 'livre desconhecido'}${f.formatted ? ' · <b>FORMATADA NESTE BOOT</b>' : ''} · leitura do preset: ${f.readN ? `${f.readN} troca(s), média ${f.readAvg} ms, pior ${f.readMax} ms (${hist})` : 'nenhuma troca'} · ${f.readErr} leitura(s) com erro · ${f.lineDrop} linha(s) descartada(s) · gravações conferidas: ${f.writeN}${f.writeN ? ` (média ${f.writeAvg} ms, pior ${f.writeMax} ms)` : ''} · falharam ${f.writeFail}</li>
      <li><b>Configurações (NVS)</b>: ${nv && nv.free >= 0 ? `${nv.used} de ${nv.total} entradas usadas (${nv.free} livres)` : 'sem leitura'} · ${nv ? nv.writes : 0} gravação(ões) · ${nv ? nv.fails : 0} falha(s) · ${nv ? nv.gc : 0} página(s) reciclada(s)${nv && nv.virgin ? ' · unidade recém-gravada' : ''}</li>
      <li><b>Imagens e ícones</b>: cache de fundo ${md.bgHit} acerto(s) / ${md.bgMiss} falta(s) / ${md.bgEvict} evicção(ões) · ${md.decN} decode(s)${md.decN ? ` (média ${md.decAvg} ms, pior ${md.decMax} ms)` : ''} · ${md.fail} falha(s)</li>
      <li><b>Alocação</b>: ${mm ? `${mm.allocFail} falha(s) · ${mm.allocFallback} buffer(s) caíram da PSRAM para a memória interna · ${mm.allocNull} sem memória nenhuma${mm.heapCorrupt ? ` · <b>${mm.heapCorrupt} corrupção(ões) de heap</b>` : ''}` : '—'}</li>
      ${j.bootlog && j.bootlog.fullMs ? `<li><b>Log de boot</b>: encheu aos ${lvT(j.bootlog.fullMs)} · ${j.bootlog.lostLines} linha(s) (${lvKB(j.bootlog.lostBytes)}) perdidas depois</li>` : ''}
