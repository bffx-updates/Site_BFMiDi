  })();
  const stallRows = j.stalls.map((s) => `<li>${lvBadge('crit')} fw ${esc(s.fw)} · boot ${s.boot} · ${lvT(s.at)}: parada <b>${lvMs(s.dur)}</b> na fase <b>${esc(j.phName(s.phase))}</b>${s.route ? ` (pedido ${esc(s.route)})` : ''} · memória ${s.heapKB} KB${s.rebooted ? ' · <b>o vigia reiniciou</b>' : ''}</li>`).join('');
  const minRows = j.min.slice().reverse().map((m) => `<tr><td>${m.boot}</td><td>${m.minute}</td><td>${m.loops}</td><td>${m.slow}</td><td>${m.maxLoop}${m.maxLoop ? ' ' + esc(j.phName(m.maxPh)) : ''}</td><td>${m.presses}</td><td>${m.maxPress}</td><td>${m.http}</td><td>${m.httpSlow}</td><td>${m.wifiEv}</td><td>${m.apMax}</td><td>${m.apRssi || ''}</td><td>${m.staRssi || ''}</td><td>${m.loopMin}%</td><td>${m.heapKB}</td>${j.f1 ? `<td>${m.psramMinKB || ''}</td><td>${m.fsFreeKB || ''}</td><td>${m.wifiCh || ''}</td><td>${m.subTop >= 0 ? esc(j.subName(m.subTop)) + ' ' + m.subMs : ''}</td>` : ''}</tr>`).join('');
  return `<div class="lv">${back}
  <section class="lv-card lv-diag" aria-labelledby="lvDiagT" style="--sev:${LV_SEV[worstSev].c}">
    <h2 id="lvDiagT">Diagnóstico</h2>
    <ul>${diag.map((d) => `<li style="--sev:${LV_SEV[d.sev].c}">${lvBadge(d.sev)}<div><b>${esc(d.title)}</b><p>${esc(d.text)}</p>${d.fix ? `<p class="fix"><span>O que fazer:</span> ${esc(d.fix)}</p>` : ''}</div></li>`).join('')}</ul>
  </section>
  <section class="lv-kpis" aria-label="Resumo">${kpis}</section>
  <section class="lv-card" aria-labelledby="lvTlT">
    <div class="lv-head"><h2 id="lvTlT">Linha do tempo</h2>${bootChips}</div>
    <p class="lv-note">Tempo desde ligar (ou reiniciar) a controladora. Passe o mouse ou toque nas marcas.</p>
    <div class="lv-chart" data-chart="timeline"></div>
    <div class="lv-legend">${LV_LANE.map((l) => `<span><i style="--c:${l.c}"></i>${l.l}</span>`).join('')}<span><i class="bar"></i>Período lento / travado</span></div>
  </section>
  <section class="lv-card" aria-labelledby="lvMinT">
    <div class="lv-head"><h2 id="lvMinT">Minuto a minuto · boot ${S.lvBoot}</h2></div>
    <div class="lv-grid" data-minutes>
      <figure><figcaption>Pior volta do loop (ms), cor = fase que pesou</figcaption><div class="lv-chart" data-chart="m-loop"></div><div class="lv-legend sm" data-phleg></div></figure>
      <figure><figcaption>Pior atraso de pisada (ms)</figcaption><div class="lv-chart" data-chart="m-press"></div></figure>
      <figure><figcaption>Pedidos HTTP por minuto</figcaption><div class="lv-chart" data-chart="m-http"></div><div class="lv-legend sm"><span><i style="--c:#3987e5"></i>Normais</span><span><i style="--c:#d95926"></i>Lentos</span></div></figure>
      <figure><figcaption>Sinal Wi-Fi (dBm, mais alto = melhor)</figcaption><div class="lv-chart" data-chart="m-rssi"></div><div class="lv-legend sm"><span><i style="--c:#3987e5"></i>Pior aparelho no AP</span><span><i style="--c:#199e70"></i>Rede de casa</span></div></figure>
      <figure><figcaption>CPU: menor fatia do loop (% de um núcleo)</figcaption><div class="lv-chart" data-chart="m-cpu"></div></figure>
      <figure><figcaption>Memória interna mínima (KB)</figcaption><div class="lv-chart" data-chart="m-heap"></div></figure>
      ${j.f1 ? '<figure><figcaption>PSRAM mínima (KB) e memória de presets livre (KB)</figcaption><div class="lv-chart" data-chart="m-psram"></div><div class="lv-legend sm"><span><i style="--c:#d55181"></i>PSRAM mínima</span><span><i style="--c:#c98500"></i>Presets livre</span></div></figure>' : ''}
    </div>
    <details class="lv-table"><summary>Ver a tabela por minuto</summary><div class="scroll"><table><thead><tr><th>Boot</th><th>Min</th><th>Voltas</th><th>Lentas</th><th>Pior (ms)</th><th>Pisadas</th><th>Pior pisada</th><th>HTTP</th><th>Lentos</th><th>Wi-Fi ev.</th><th>No AP</th><th>Sinal AP</th><th>Sinal casa</th><th>Loop mín.</th><th>Mem KB</th>${j.f1 ? '<th>PSRAM mín KB</th><th>FS livre KB</th><th>Canal</th><th>Sub-fase</th>' : ''}</tr></thead><tbody>${minRows || '<tr><td colspan="19">O primeiro minuto ainda não tinha fechado.</td></tr>'}</tbody></table></div></details>
  </section>
  <section class="lv-grid2">
    <div class="lv-card"><h2>Tempo de cada volta do loop</h2><p class="lv-note">Este boot. Escala logarítmica — o normal é tudo em &lt; 5 ms.</p><div class="lv-chart" data-chart="hist-loop"></div></div>
    <div class="lv-card"><h2>Atraso das pisadas</h2><p class="lv-note">Da borda no pino até a controladora agir. Normal: 25–50 ms.</p><div class="lv-chart" data-chart="hist-press"></div></div>
  </section>
  <section class="lv-card"><h2>Onde a controladora gastou o tempo nas voltas lentas</h2><p class="lv-note">Soma de todas as voltas ≥ ${j.slowMs} ms neste boot, por fase.</p><div class="lv-chart" data-chart="phases"></div><div class="lv-legend" data-phtot></div></section>
  ${memCard}
  <section class="lv-card"><h2>Períodos de lentidão (${j.ep.length})</h2>${epCards || '<p class="lv-note">Nenhum período lento registrado (pior volta ≥ 150 ms ou soma ≥ 400 ms).</p>'}</section>
  ${j.stalls.length ? `<section class="lv-card"><h2>Travamentos gravados (sobrevivem a desligar)</h2><ul class="lv-stalls">${stallRows}</ul></section>` : ''}
  <section class="lv-card"><h2>Eventos (${j.ev.length})</h2><div class="scroll"><table class="lv-ev"><thead><tr><th>Boot</th><th>Hora</th><th>Nível</th><th>Tipo</th><th>O que aconteceu</th></tr></thead><tbody>${evRows || '<tr><td colspan="5">Nenhum evento.</td></tr>'}</tbody></table></div></section>
  <details class="lv-table lv-card"><summary>Ver o relatório da blackbox em texto</summary><pre>${esc(j.reportText)}</pre></details>
</div><div class="lv-tip" id="lvTip" role="tooltip" hidden></div>`;
}

// ── gráficos (SVG medido na largura real do container) ──
const LV_AX = '#5F6873', LV_GRID = 'rgba(255,255,255,.07)', LV_INK = '#8E97A3';
function lvNice(max) { if (max <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(max))), f = max / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function lvSvg(w, h, body, label) { return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">${body}</svg>`; }
function lvYAxis(x0, x1, y0, y1, max, fmt) {
  let s = '';
  for (let k = 0; k <= 4; k++) { const v = (max * k) / 4, y = y1 - ((y1 - y0) * k) / 4;
    s += `<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="${LV_GRID}"/><text x="${x0 - 6}" y="${y + 3.5}" text-anchor="end" fill="${LV_AX}" font-size="10.5">${fmt(v)}</text>`; }
  return s;
}
// Barras por minuto. vals: [{x(label), v, c, tip}] ; stacked: [{v,c}] opcional.
function lvBars(el, items, opt = {}) {
  const w = Math.max(240, el.clientWidth), h = opt.h || 150, L = 40, R = 8, T = 8, B = 22;
  if (!items.length) { el.innerHTML = `<p class="lv-empty">${opt.empty || 'Sem dados ainda.'}</p>`; return; }
  const rawMax = Math.max(1, ...items.map((it) => (it.stack ? it.stack.reduce((a, s) => a + s.v, 0) : it.v)));
  const max = opt.noAxis ? rawMax * 1.18 : lvNice(rawMax);
  const iw = (w - L - R) / items.length, bw = Math.max(2, Math.min(opt.bw || 28, iw - 2));
  let s = opt.noAxis ? '' : lvYAxis(L, w - R, T, h - B, max, opt.fmt || ((v) => Math.round(v)));
  items.forEach((it, i) => {
    const x = L + i * iw + (iw - bw) / 2;
    let y = h - B;
    const parts = it.stack || [{ v: it.v, c: it.c }];
    parts.forEach((p, k) => {
      if (!p.v) return;
      const bh = Math.max(1, ((h - B - T) * p.v) / max);
      const top = k === parts.length - 1 || !parts.slice(k + 1).some((q) => q.v);
      // ponta de cima arredondada, base reta (ancorada no eixo)
      const rr = top ? Math.min(4, bw / 2, bh / 2) : 0;
      s += `<rect x="${x}" y="${y - bh}" width="${bw}" height="${bh}" rx="${rr}" fill="${p.c}"/>`;
      if (rr && bh > rr) s += `<rect x="${x}" y="${y - bh / 2}" width="${bw}" height="${bh / 2}" fill="${p.c}"/>`;
      y -= bh + (k < parts.length - 1 ? 2 : 0);
    });
    if (it.lbl !== undefined) s += `<text x="${x + bw / 2}" y="${y - 5}" text-anchor="middle" fill="${LV_INK}" font-size="10.5" font-weight="700">${esc(it.lbl)}</text>`;
    s += `<rect x="${L + i * iw}" y="${T}" width="${iw}" height="${h - B - T}" fill="transparent" data-tip="${esc(it.tip)}"/>`;
    if (items.length <= 12 || i % Math.ceil(items.length / 12) === 0) s += `<text x="${L + i * iw + iw / 2}" y="${h - 6}" text-anchor="middle" fill="${LV_AX}" font-size="10.5">${esc(it.x)}</text>`;
  });
  s += `<line x1="${L}" x2="${w - R}" y1="${h - B}" y2="${h - B}" stroke="${LV_AX}"/>`;
  el.innerHTML = lvSvg(w, h, s, opt.label || '');
}
// Linhas por minuto. series: [{c, vals:[v|null]}], xs: labels, tips por índice.
function lvLines(el, xs, series, opt = {}) {
  const w = Math.max(240, el.clientWidth), h = opt.h || 150, L = 40, R = 10, T = 10, B = 22;
  const all = series.flatMap((s) => s.vals).filter((v) => v !== null && v !== undefined);
  if (!all.length) { el.innerHTML = `<p class="lv-empty">${opt.empty || 'Sem dados ainda.'}</p>`; return; }
  let lo = opt.min !== undefined ? opt.min : Math.min(...all), hi = opt.max !== undefined ? opt.max : Math.max(...all);
  if (hi === lo) { hi += 1; lo -= 1; }
  const X = (i) => L + (xs.length === 1 ? (w - L - R) / 2 : (i * (w - L - R)) / (xs.length - 1));
  const Y = (v) => T + ((hi - v) * (h - T - B)) / (hi - lo);
  let s = '';
  for (let k = 0; k <= 4; k++) { const v = lo + ((hi - lo) * k) / 4, y = Y(v);
    s += `<line x1="${L}" x2="${w - R}" y1="${y}" y2="${y}" stroke="${LV_GRID}"/><text x="${L - 6}" y="${y + 3.5}" text-anchor="end" fill="${LV_AX}" font-size="10.5">${Math.round(v)}</text>`; }
  series.forEach((se) => {
    let d = '', pen = false;
    se.vals.forEach((v, i) => { if (v === null || v === undefined) { pen = false; return; } d += `${pen ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`; pen = true; });
    s += `<path d="${d}" fill="none" stroke="${se.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    se.vals.forEach((v, i) => { if (v !== null && v !== undefined && (xs.length <= 20)) s += `<circle cx="${X(i)}" cy="${Y(v)}" r="3.2" fill="${se.c}" stroke="#131B26" stroke-width="2"/>`; });
  });
  xs.forEach((x, i) => {
    const cw = (w - L - R) / Math.max(1, xs.length);
    s += `<rect x="${X(i) - cw / 2}" y="${T}" width="${cw}" height="${h - T - B}" fill="transparent" data-tip="${esc(opt.tip(i))}"/>`;
    if (xs.length <= 12 || i % Math.ceil(xs.length / 12) === 0) s += `<text x="${X(i)}" y="${h - 6}" text-anchor="middle" fill="${LV_AX}" font-size="10.5">${esc(x)}</text>`;
  });
  el.innerHTML = lvSvg(w, h, s, opt.label || '');
}

function lvTimeline(el, j) {
  const bt = S.lvBoot;
  const evs = j.ev.filter((e) => e.boot === bt), eps = j.ep.filter((e) => e.boot === bt);
  const tMax = bt === j.boot ? j.up : Math.max(5000, ...evs.map((e) => e.ms + (e.type === 12 ? e.c : 0)), ...eps.map((e) => e.start + e.dur)) * 1.03;
  const w = Math.max(300, el.clientWidth), LW = 92, R = 12, laneH = 30, T = 6, B = 24, h = T + LV_LANE.length * laneH + B;
  const X = (ms) => LW + (Math.min(ms, tMax) * (w - LW - R)) / Math.max(1, tMax);
  let s = '';
  // eixo de tempo
  const step = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200].map((v) => v * 1000).find((v) => tMax / v <= 8) || 14400000;
  for (let t = 0; t <= tMax; t += step) s += `<line x1="${X(t)}" x2="${X(t)}" y1="${T}" y2="${h - B}" stroke="${LV_GRID}"/><text x="${X(t)}" y="${h - 7}" text-anchor="middle" fill="${LV_AX}" font-size="10.5">${lvT(t)}</text>`;
  LV_LANE.forEach((l, i) => {
    const y = T + i * laneH;
    s += `<text x="0" y="${y + laneH / 2 + 4}" fill="${LV_INK}" font-size="11.5" font-weight="700">${l.l}</text><line x1="${LW}" x2="${w - R}" y1="${y + laneH / 2}" y2="${y + laneH / 2}" stroke="rgba(255,255,255,.1)" stroke-dasharray="2 4"/>`;
  });
  const laneY = (k) => T + LV_LANE.findIndex((l) => l.k === k) * laneH + laneH / 2;
  // períodos lentos (barras na faixa "Lentidão")
  eps.forEach((e) => {
    const x0 = X(e.start), x1 = Math.max(x0 + 4, X(e.start + e.dur)), y = laneY('slow');
    s += `<rect x="${x0}" y="${y - 8}" width="${x1 - x0}" height="16" rx="4" fill="${e.max >= 1000 ? LV_SEV.crit.c : LV_SEV.serious.c}" fill-opacity=".85" data-tip="${esc(`Lento ${lvMs(e.dur)} · pior volta ${lvMs(e.max)} · fase ${j.phName(e.worst)}${e.route ? ` · pedido ${e.route} ${lvMs(e.routeMs)}` : ''}`)}"/>`;
  });
  evs.forEach((e) => {
    const x = lvEvent(e, j), lane = LV_LANE.find((l) => l.k === x.lane), y = laneY(x.lane), cx = X(e.ms);
    if (e.type === 12) { const x1 = Math.max(cx + 4, X(e.ms + e.c)); s += `<rect x="${cx}" y="${y - 10}" width="${x1 - cx}" height="20" rx="4" fill="${LV_SEV.crit.c}" stroke="#131B26" stroke-width="2" data-tip="${esc(lvT(e.ms) + ' · ' + x.text)}"/>`; return; }
    const r = x.ms ? Math.min(9, 4 + Math.log10(Math.max(10, x.ms))) : 5;
    const hollow = e.type === 5 || e.type === 7 || e.type === 3;
    const col = x.sev === 'crit' ? LV_SEV.crit.c : lane.c;
    s += e.type === 1 ? `<rect x="${cx - 5}" y="${y - 5}" width="10" height="10" transform="rotate(45 ${cx} ${y})" fill="${col}" stroke="#131B26" stroke-width="2"/>`
      : `<circle cx="${cx}" cy="${y}" r="${r}" fill="${hollow ? '#131B26' : col}" stroke="${hollow ? col : '#131B26'}" stroke-width="2"/>`;
    s += `<circle cx="${cx}" cy="${y}" r="12" fill="transparent" data-tip="${esc(lvT(e.ms) + ' · ' + x.text)}"/>`;
  });
  if (bt === j.boot) s += `<line x1="${X(j.up)}" x2="${X(j.up)}" y1="${T}" y2="${h - B}" stroke="${LV_INK}" stroke-dasharray="3 3"/><text x="${X(j.up) - 4}" y="${T + 9}" text-anchor="end" fill="${LV_INK}" font-size="10.5">agora</text>`;
  el.innerHTML = lvSvg(w, h, s, `Linha do tempo do boot ${bt}: ${evs.length} eventos e ${eps.length} períodos lentos`);
}

// '+N' da linha MIDI: fica no fluxo do texto. Se a mensagem não cabe nas 2 linhas, o texto é
// cortado aqui (busca binária pelo maior trecho que cabe) e termina em '…' seguido do '+N', colado
// ao último caractere visível. Só muda o que se vê: o leitor de tela recebe o texto inteiro (.sr)
// e a lista completa continua no title da linha. Ao redimensionar, tudo volta ao inteiro e é medido
// de novo (mede todas antes de cortar, para não intercalar leitura e escrita de layout à toa).
function fitMidi() {
  const ms = Array.from($main.querySelectorAll('.row .midi')).filter((m) => m.querySelector('.more'));
  for (const m of ms) {
    const t = m.querySelector('.mt');
    if (t._full !== undefined) { t.innerHTML = t._full; t.removeAttribute('aria-hidden'); const sr = m.querySelector('.sr'); if (sr) sr.remove(); }
    m.classList.remove('cut');
  }
  const over = (t) => t.scrollHeight > t.clientHeight + 1;
  ms.filter((m) => over(m.querySelector('.mt'))).forEach((m) => {
    const t = m.querySelector('.mt'), more = t.querySelector('.more');
    t._full = t.innerHTML;
    const full = t.textContent;
    more.remove();
    const nodes = []; const w = document.createTreeWalker(t, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) nodes.push([n, n.data]);
    const total = nodes.reduce((a, [, d]) => a + d.length, 0);
    const keep = (k) => {   // os k primeiros caracteres, sem espaço/separador pendurado, + '…'
      let left = k, last = null;
      for (const [n, d] of nodes) { const take = Math.max(0, Math.min(d.length, left)); n.data = d.slice(0, take); left -= take; if (take) last = n; }
      if (last) last.data = last.data.replace(/[\s\-:·]+$/, '') + '…';
    };
    t.appendChild(more);
    let lo = 1, hi = total - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; keep(mid); if (over(t)) hi = mid - 1; else lo = mid; }
    keep(lo);
    m.classList.add('cut');
    t.setAttribute('aria-hidden', 'true');
    m.insertAdjacentHTML('beforeend', `<span class="sr">${esc(full)}</span>`);
  });
}

function stepBank(dir) {
  const banks = banksInBackup(); if (banks.length < 2) return;
  const i = banks.indexOf(S.bank);
  S.bank = banks[((i < 0 ? 0 : i) + dir + banks.length) % banks.length];
  if (!hasPreset(S.bank + S.pi)) { const first = Array.from({ length: swCount() }, (_, k) => k + 1).find((k) => hasPreset(S.bank + k)); if (first) S.pi = first; }
  S.layer = 1; render();
}
function load(text, name) {
  let b = null;
  try { b = JSON.parse(text); } catch (e) { b = null; }
  // Texto puro do GET /log ou /diag (salvo da controladora): só o LOG VIEW.
  if (!b && /BLACKBOX|CAIXA-PRETA|DIAG-JSON |reset: /.test(text)) {
    S.backup = { logOnly: true, boot_log: text }; S.name = name; S.lv = lvParse(text); S.lvBoot = S.lv && !S.lv.badVersion ? S.lv.boot : 0;
    S.view = 'log'; updateInfo(); render(); return;
  }
  if (!b) { alert('Arquivo não é um backup da BFMiDi nem um log da controladora.'); return; }
  if (typeof b !== 'object' || !b.presets) { alert('Este JSON não parece um backup da BFMiDi (sem "presets").'); return; }
  S.backup = b; S.name = name; S.layer = 1; S.bootOpen = null;
  S.lv = lvParse(b.boot_log); S.lvBoot = S.lv && !S.lv.badVersion ? S.lv.boot : 0;
  if (S.view === 'log' || !S.lv) S.view = S.view === 'log' ? 'log' : 'presets';
  // paleta de LED do próprio backup (color_N), quando presente
  LED = LED_DEFAULT.map(([n, rgb], i) => { const v = b.global_config && b.global_config['color_' + i]; const q = v ? String(v).split(',').map((x) => num(x)) : null; return { name: n, rgb: q && q.length === 3 ? q : rgb }; });
  // Abre no preset inicial do backup (início automático), senão no primeiro que existir.
  const tags = Object.keys(b.presets).sort();
  const autoTag = (LETTERS[gi('auto_start_bank')] || 'A') + gi('auto_start_preset', 1);
  const start = hasPreset(autoTag) ? autoTag : tags[0];
  S.bank = start[0]; S.pi = num(start.slice(1), 1);
  updateInfo(); render();
}

  const nav = e.target.closest('[data-bank]'); if (nav) { e.stopPropagation(); stepBank(num(nav.dataset.bank, 1)); return; }
  if (e.target.closest('#bankNext')) { stepBank(1); return; }
  if (e.target.closest('#extras')) { S.showExtras = !S.showExtras; render(); return; }
  const k = e.target.closest('.key'); if (k && !k.disabled) { S.pi = num(k.dataset.pi, 1); S.layer = 1; render(); return; }
  const lb = e.target.closest('.layerseg button'); if (lb) { S.layer = num(lb.dataset.layer, 1); render(); }
});
document.addEventListener('keydown', (e) => {
  // Só campos de DIGITAR bloqueiam os atalhos (o input de arquivo não digita nada).
  if (!S.backup || S.view === 'log' || e.ctrlKey || e.metaKey || e.altKey || (e.target.closest && e.target.closest('input:not([type=file]), select, textarea'))) return;
  // Lendo o log pelo teclado: as teclas são do log (senão o preset muda lá em cima e o log volta ao topo).
  if (e.target.closest && e.target.closest('details.boot pre')) return;
  if (e.key === 'ArrowRight') stepBank(1);
  else if (e.key === 'ArrowLeft') stepBank(-1);
  else if (/^[1-6]$/.test(e.key) && num(e.key) <= swCount() && hasPreset(S.bank + e.key)) {
    // Com o foco numa tecla, ele acompanha a seleção (senão o anel fica numa tecla e o laranja em outra).
    const onKey = !!document.activeElement && document.activeElement.matches('.key');
    S.pi = num(e.key); S.layer = 1; render();
    if (onKey) { const k = $main.querySelector(`.key[data-pi="${S.pi}"]`); if (k) k.focus({ preventScroll: true }); }
  }
});
// O usuário abriu/fechou o log: vale nas próximas trocas de preset e de banco.
$main.addEventListener('toggle', (e) => { if (e.target.matches('details.boot')) S.bootOpen = e.target.open; }, true);
// Arrastar arquivo: contador de enter/leave para a camada não piscar ao passar sobre filhos.
let dragDepth = 0;
const dragEnd = () => { dragDepth = 0; document.body.classList.remove('dragging'); };
document.addEventListener('dragenter', (e) => { if (!Array.from(e.dataTransfer.types || []).includes('Files')) return; dragDepth++; document.body.classList.add('dragging'); });
document.addEventListener('dragover', (e) => { e.preventDefault(); });
document.addEventListener('dragleave', () => { if (--dragDepth <= 0) dragEnd(); });
document.addEventListener('drop', (e) => { e.preventDefault(); dragEnd(); const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) f.text().then((t) => load(t, f.name)); });
// Rede de segurança: durante o arraste não chegam eventos de ponteiro; se chegou um, o arraste acabou.
addEventListener('pointermove', () => { if (dragDepth) dragEnd(); }, { passive: true });
addEventListener('blur', () => { if (dragDepth) dragEnd(); });
// Sombra no topo só depois de rolar.
addEventListener('scroll', () => document.querySelector('.top').classList.toggle('scrolled', scrollY > 4), { passive: true });
render();
</script>
</body>
